# Example multi-mode traffic simulation scenario.
#
# Run with:
#   netweevil simulate run examples/requests/simulation_scenario.yml \
#     --dataset groningen_2026_03 \
#     --profile examples/profiles/car_research_v1.yml \
#     --temporal-geojson
#
# Or POST {"scenario": <this document as JSON>} to /v1/simulation on a
# running API and watch it live from the QGIS plugin's Simulation tab.

scenario:
  id: groningen_rush_hour_demo
  label: "Morning rush demo with cars and bicycles"
  seed: 42
  description: >
    600 cars and 300 bicycles dispatched simultaneously over 30 simulated
    minutes, with a slow zone in the city centre and standing background
    traffic on the ring road area.

time:
  duration_s: 1800.0
  tick_s: 1.0
  stop_when_all_arrived: true

fleets:
  - fleet_id: commuter_cars
    profile_id: car_north_nl_2026_05     # any compiled profile loaded in the API/CLI
    agent_count: 600
    demand:
      origins:
        kind: random_bounds          # anywhere in the dataset extent
      destinations:
        kind: points                 # everyone heads to two destinations
        points:
          - { lon: 6.5665, lat: 53.2194, weight: 2.0, label: center }
          - { lon: 6.5716, lat: 53.2148, weight: 1.0, label: station }
    departures:
      kind: peak                     # normal distribution around a peak
      mean_s: 300.0
      std_s: 180.0
    behavior:
      overtake_eagerness: 0.4
      reroute_eagerness: 0.5         # half the drivers reroute out of jams
      jam_speed_threshold: 0.4
      reroute_cooldown_s: 90.0
      obey_traffic_signals: true
      alternative_route_share: 0.3   # 30% start on a ranked alternative route
      max_alternatives: 3
      no_collision: true             # storage capacity + spillback queueing
      heterogeneity: 0.2
    speed:
      speed_multiplier_mean: 1.0
      speed_multiplier_std: 0.1
      acceleration_mps2: 2.0
      deceleration_mps2: 2.5

  - fleet_id: cyclists
    profile_id: cycling_north_nl_2026_05
    agent_count: 300
    demand:
      origins:
        kind: random_bbox
        bbox: [6.52, 53.19, 6.62, 53.25]
      destinations:
        kind: random_bbox
        bbox: [6.52, 53.19, 6.62, 53.25]
    departures:
      kind: uniform
      start_s: 0.0
      end_s: 900.0
    behavior:
      obey_traffic_signals: true
      no_collision: false            # bicycles don't queue-block edges here
    speed:
      speed_multiplier_mean: 1.0
      speed_multiplier_std: 0.15

zones:
  - zone_id: centre_slow_zone
    label: "City centre 50% speed"
    polygon:
      - [6.560, 53.215]
      - [6.575, 53.215]
      - [6.575, 53.222]
      - [6.560, 53.222]
    effect:
      kind: speed_factor
      factor: 0.5

  - zone_id: ring_background_traffic
    label: "Standing background traffic"
    polygon:
      - [6.545, 53.200]
      - [6.600, 53.200]
      - [6.600, 53.212]
      - [6.545, 53.212]
    effect:
      kind: high_traffic
      background_load: 0.35          # 35% of storage capacity pre-filled

  # Example no-access zone (e.g. event closure). Add/remove these mid-run
  # through POST /v1/simulation/{id}/control as well.
  # - zone_id: event_closure
  #   polygon: [[6.563, 53.217], [6.567, 53.217], [6.567, 53.219], [6.563, 53.219]]
  #   effect:
  #     kind: no_access
  #     modes: [car]                 # empty list = all modes

traffic:
  model: greenshields                # or bpr (alpha/beta below)
  bpr_alpha: 1.0
  bpr_beta: 4.0
  min_speed_factor: 0.05
  background_load: 0.0               # global standing load on every edge
  signal_cycle_s: 60.0
  signal_green_share: 0.55
  reroute_budget_per_s: 80

output:
  frame_interval_s: 5.0              # agent-position snapshot cadence
  frame_max_agents: 20000            # stride-sampled above this count
  edge_stats_interval_s: 60.0        # congestion bin width
  store_trajectories: true
  position_model: trapezoidal        # smooth accel/decel playback interpolation
