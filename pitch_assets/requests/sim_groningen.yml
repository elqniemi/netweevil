scenario:
  id: groningen_peak
  label: "Morning peak into Groningen centre"
  seed: 42
  description: >
    700 cars dispatched from across the Groningen urban area toward the city
    centre and central station during a 15-minute morning peak, with a slow
    zone over the historic centre and standing background load on the ring.

time:
  duration_s: 900.0
  tick_s: 1.0
  stop_when_all_arrived: true

fleets:
  - fleet_id: commuter_cars
    profile_id: car_north_nl_2026_05
    agent_count: 700
    demand:
      origins:
        kind: random_bbox
        bbox: [6.49, 53.17, 6.66, 53.28]
      destinations:
        kind: points
        points:
          - { lon: 6.5685, lat: 53.2191, weight: 2.0, label: grote_markt }
          - { lon: 6.5665, lat: 53.2110, weight: 1.5, label: centraal_station }
          - { lon: 6.5760, lat: 53.2190, weight: 1.0, label: umcg }
    departures:
      kind: peak
      mean_s: 280.0
      std_s: 150.0
    behavior:
      overtake_eagerness: 0.4
      reroute_eagerness: 0.4
      jam_speed_threshold: 0.4
      reroute_cooldown_s: 120.0
      obey_traffic_signals: true
      alternative_route_share: 0.25
      max_alternatives: 2
      no_collision: true
      heterogeneity: 0.2
    speed:
      speed_multiplier_mean: 1.0
      speed_multiplier_std: 0.1
      acceleration_mps2: 2.0
      deceleration_mps2: 2.5

zones:
  - zone_id: centre_slow_zone
    label: "Historic centre 50% speed"
    polygon:
      - [6.560, 53.215]
      - [6.578, 53.215]
      - [6.578, 53.223]
      - [6.560, 53.223]
    effect:
      kind: speed_factor
      factor: 0.5
  - zone_id: ring_background
    label: "Ring background load"
    polygon:
      - [6.530, 53.198]
      - [6.610, 53.198]
      - [6.610, 53.210]
      - [6.530, 53.210]
    effect:
      kind: high_traffic
      background_load: 0.35

traffic:
  model: greenshields
  min_speed_factor: 0.05
  background_load: 0.0
  signal_cycle_s: 60.0
  signal_green_share: 0.55
  reroute_budget_per_s: 80

output:
  frame_interval_s: 10.0
  frame_max_agents: 20000
  edge_stats_interval_s: 60.0
  store_trajectories: false
  position_model: trapezoidal
