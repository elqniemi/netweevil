[workspace]
members = [
    "crates/cli",
    "crates/core",
    "crates/gui",
    "crates/ingest",
    "crates/persist",
    "crates/profile",
    "crates/query",
    "crates/report",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1.0.100"
bincode = "1.3.3"
clap = { version = "4.5.50", features = ["derive"] }
directories = "6.0.0"
eframe = { version = "0.33.0", default-features = true }
egui = "0.33.0"
arrow-array = "56.2.0"
arrow-schema = "56.2.0"
hex = "0.4.3"
memmap2 = "0.9.8"
osmpbfreader = "0.17.0"
parquet = { version = "56.2.0", default-features = false, features = ["arrow"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = "0.9.34"
sha2 = "0.10.9"
rusqlite = { version = "0.37.0", features = ["bundled"] }
time = { version = "0.3.44", features = ["formatting", "parsing", "serde"] }
toml = "0.8.23"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }
