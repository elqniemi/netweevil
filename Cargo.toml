[workspace]
members = [
    "crates/api",
    "crates/cli",
    "crates/core",
    "crates/ingest",
    "crates/manifest",
    "crates/persist",
    "crates/profile",
    "crates/query",
    "crates/report",
    "crates/simulate",
    "crates/transit",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.96.1"
repository = "https://github.com/elqniemi/netweevil"
homepage = "https://github.com/elqniemi/netweevil"
keywords = ["routing", "openstreetmap", "gis", "gtfs", "isochrone"]
categories = ["science::geo", "algorithms"]

[workspace.dependencies]
anyhow = "1.0.100"
axum = "0.8.6"
bincode = "1.3.3"
bytemuck = { version = "1.21.0", features = ["extern_crate_alloc"] }
clap = { version = "4.5.50", features = ["derive"] }
csv = "1.3.1"
directories = "6.0.0"
arrow-array = "56.2.0"
arrow-schema = "56.2.0"
flate2 = "1.1.4"
hex = "0.4.3"
memmap2 = "0.9.8"
osmpbfreader = "0.17.0"
parquet = { version = "56.2.0", default-features = false, features = ["arrow"] }
rayon = "1.10.0"
rustc-hash = "2.1.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = "0.9.34"
sha2 = "0.10.9"
rusqlite = { version = "0.37.0", features = ["bundled"] }
time = { version = "0.3.44", features = ["formatting", "parsing", "serde"] }
tokio = { version = "1.48.0", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
toml = "0.8.23"
tower-http = { version = "0.6.6", features = ["cors", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }
zip = { version = "2.2.2", default-features = false, features = ["deflate"] }

[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
large_enum_variant = "allow"
