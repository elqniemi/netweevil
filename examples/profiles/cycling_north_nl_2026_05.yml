profile:
  id: cycling_north_nl_2026_05
  label: "Cycling profile for North Netherlands May 2026"
  mode: bicycle
  defaults_pack: eu_bicycle_2026_01
  extends: bicycle_default

cost:
  objective: generalized
  distance_weight: 0.004
  time_weight: 1.0

speed_rules:
  - match:
      highway: cycleway
    speed_kph: 23.0
  - match:
      highway: path
    speed_kph: 20.0
  - match:
      highway: residential
    speed_kph: 18.0
  - match:
      highway: service
    speed_kph: 15.0
  - match:
      highway: tertiary
    speed_kph: 17.0
  - match:
      highway: secondary
    speed_kph: 16.0
  - match:
      highway: primary
    speed_kph: 15.0
  - match:
      highway: trunk
    speed_kph: 12.0
  - match:
      highway: track
    speed_kph: 14.0

factors:
  - match:
      surface: asphalt
    speed_factor: 1.08
  - match:
      surface: paved
    speed_factor: 1.03
  - match:
      surface: gravel
    speed_factor: 0.78
  - match:
      surface: cobblestone
    speed_factor: 0.62
  - match:
      surface: ground
    speed_factor: 0.70
  - match:
      surface: dirt
    speed_factor: 0.60
  - match:
      surface: sand
    speed_factor: 0.35
  - match:
      smoothness: bad
    speed_factor: 0.75
  - match:
      smoothness: very_bad
    speed_factor: 0.55
  - match:
      smoothness: horrible
    speed_factor: 0.35
  - match:
      smoothness: impassable
    speed_factor: 0.12

direction:
  allow_bicycle_contraflow_on_roads: true

turns:
  left_penalty_s: 5
  right_penalty_s: 1
  uturn_penalty_s: 18
  traffic_signal_penalty_s: 8
  roundabout_entry_penalty_s: 2

ferry:
  allow: true
  use_ferry: 0.55
  boarding_cost_s: 180
  infer_duration_when_missing: true
  default_speed_kph: 16

preferences:
  use_highways: 0.35
  use_tolls: 0.05
  use_tracks: 0.55
  service_penalty_s: 6

returns:
  geometry: full
  segment_rows: true
  road_type_breakdown:
    - time_s
    - distance_m
  surface_breakdown:
    - time_s
    - distance_m
  penalty_breakdown: true
  explain_cost_derivation: true
