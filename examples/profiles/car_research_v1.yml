profile:
  id: car_research_v1
  label: "Car profile for paper scenario A"
  mode: car
  defaults_pack: eu_car_2026_01
  extends: car_default

cost:
  objective: fastest
  distance_weight: 0.0
  time_weight: 1.0

# How posted speed limits from the source data (OSM maxspeed, Overture
# speed_limits) combine with the speeds below for motorized modes:
#   prefer — posted limit replaces the profile speed where present
#   cap    — posted limit caps the profile speed (default)
#   ignore — posted limits are ignored, profile speeds only
speeds:
  posted_limits: cap

speed_rules:
  - match:
      highway: motorway
    speed_kph: 105
  - match:
      highway: trunk
    speed_kph: 95
  - match:
      highway: primary
    speed_kph: 75
  - match:
      highway: residential
    speed_kph: 35
  - match:
      highway: track
      surface: gravel
    speed_kph: 18

factors:
  - match:
      surface: cobblestone
    speed_factor: 0.75
  - match:
      smoothness: bad
    speed_factor: 0.70

turns:
  left_penalty_s: 4
  right_penalty_s: 1
  uturn_penalty_s: 25
  traffic_signal_penalty_s: 6
  roundabout_entry_penalty_s: 2

ferry:
  allow: true
  use_ferry: 0.35
  boarding_cost_s: 300
  infer_duration_when_missing: true
  default_speed_kph: 22

preferences:
  use_highways: 0.8
  use_tolls: 0.4
  use_tracks: 0.1
  service_penalty_s: 15

returns:
  geometry: full
  segment_rows: true
  road_type_breakdown:
    - time_s
    - distance_m
  surface_breakdown:
    - time_s
    - distance_m
  penalty_breakdown: true
  explain_cost_derivation: true

