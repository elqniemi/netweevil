profile:
  id: ambulance_emergency_call_v1
  label: "Ambulance emergency call response profile"
  mode: car
  defaults_pack: eu_car_2026_01
  extends: car_default

cost:
  objective: fastest
  distance_weight: 0.0
  time_weight: 1.0

speed_rules:
  - match:
      highway: motorway
    speed_kph: 150
  - match:
      highway: trunk
    speed_kph: 140
  - match:
      highway: primary
    speed_kph: 120
  - match:
      highway: secondary
    speed_kph: 100
  - match:
      highway: tertiary
    speed_kph: 80
  - match:
      highway: residential
    speed_kph: 55
  - match:
      highway: service
    speed_kph: 38
  - match:
      highway: track
    speed_kph: 22

factors:
  - match:
      surface: gravel
    speed_factor: 0.70
  - match:
      surface: cobblestone
    speed_factor: 0.68
  - match:
      surface: ground
    speed_factor: 0.55
  - match:
      surface: dirt
    speed_factor: 0.48
  - match:
      surface: sand
    speed_factor: 0.25
  - match:
      smoothness: bad
    speed_factor: 0.70
  - match:
      smoothness: very_bad
    speed_factor: 0.45
  - match:
      smoothness: horrible
    speed_factor: 0.25
  - match:
      smoothness: impassable
    speed_factor: 0.08

turns:
  left_penalty_s: 2
  right_penalty_s: 0.5
  uturn_penalty_s: 12
  traffic_signal_penalty_s: 0.5
  roundabout_entry_penalty_s: 1

ferry:
  allow: true
  use_ferry: 0.10
  boarding_cost_s: 300
  infer_duration_when_missing: true
  default_speed_kph: 22

preferences:
  use_highways: 0.95
  use_tolls: 1.0
  use_tracks: 0.20
  service_penalty_s: 2

returns:
  geometry: full
  segment_rows: true
  road_type_breakdown:
    - time_s
    - distance_m
  surface_breakdown:
    - time_s
    - distance_m
  penalty_breakdown: true
  explain_cost_derivation: true
