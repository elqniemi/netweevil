profile:
  id: pedestrian_north_nl_2026_05
  label: "Pedestrian profile for North Netherlands May 2026"
  mode: foot
  defaults_pack: eu_foot_2026_01
  extends: foot_default

cost:
  objective: generalized
  distance_weight: 0.015
  time_weight: 1.0

speed_rules:
  - match:
      highway: footway
    speed_kph: 5.0
  - match:
      highway: pedestrian
    speed_kph: 5.0
  - match:
      highway: path
    speed_kph: 5.0
  - match:
      highway: residential
    speed_kph: 5.0
  - match:
      highway: service
    speed_kph: 4.0
  - match:
      highway: tertiary
    speed_kph: 4.8
  - match:
      highway: secondary
    speed_kph: 4.8
  - match:
      highway: primary
    speed_kph: 4.8
  - match:
      highway: track
    speed_kph: 4.6

exclude_rules:
  - match:
      highway: motorway
  - match:
      highway: trunk

factors:
  - match:
      surface: gravel
    speed_factor: 0.90
  - match:
      surface: cobblestone
    speed_factor: 0.82
  - match:
      surface: ground
    speed_factor: 0.90
  - match:
      surface: dirt
    speed_factor: 0.78
  - match:
      surface: sand
    speed_factor: 0.55
  - match:
      smoothness: bad
    speed_factor: 0.82
  - match:
      smoothness: very_bad
    speed_factor: 0.65
  - match:
      smoothness: horrible
    speed_factor: 0.45
  - match:
      smoothness: impassable
    speed_factor: 0.20

direction:
  ignore_plain_oneway_for_foot: true

ferry:
  allow: true
  use_ferry: 0.25
  boarding_cost_s: 120
  infer_duration_when_missing: true
  default_speed_kph: 8

preferences:
  use_highways: 0.01
  use_tolls: 0.0
  use_tracks: 0.45
  service_penalty_s: 8

returns:
  geometry: full
  segment_rows: true
  road_type_breakdown:
    - time_s
    - distance_m
  surface_breakdown:
    - time_s
    - distance_m
  penalty_breakdown: true
  explain_cost_derivation: true
