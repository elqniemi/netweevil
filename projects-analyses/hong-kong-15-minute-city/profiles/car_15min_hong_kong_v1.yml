profile:
  id: car_15min_hong_kong_v1
  label: "Hong Kong 15-minute city car profile"
  mode: car
  defaults_pack: hk_car_2026_05
  extends: car_default

cost:
  objective: fastest
  distance_weight: 0.0
  time_weight: 1.0

speed_rules:
  - match:
      highway: motorway
    speed_kph: 80
  - match:
      highway: trunk
    speed_kph: 60
  - match:
      highway: primary
    speed_kph: 50
  - match:
      highway: secondary
    speed_kph: 45
  - match:
      highway: tertiary
    speed_kph: 35
  - match:
      highway: residential
    speed_kph: 20
  - match:
      highway: service
    speed_kph: 15
  - match:
      highway: track
      surface: gravel
    speed_kph: 10
  - match:
      route: ferry
    speed_kph: 20

factors:
  - match:
      surface: cobblestone
    speed_factor: 0.75
  - match:
      smoothness: bad
    speed_factor: 0.70

turns:
  left_penalty_s: 1
  right_penalty_s: 5
  uturn_penalty_s: 30
  traffic_signal_penalty_s: 8
  roundabout_entry_penalty_s: 2

ferry:
  allow: true
  use_ferry: 0.35
  boarding_cost_s: 360
  infer_duration_when_missing: true
  default_speed_kph: 20

preferences:
  use_highways: 0.8
  use_tolls: 0.35
  use_tracks: 0.05
  service_penalty_s: 18

returns:
  geometry: full
  segment_rows: true
  road_type_breakdown:
    - time_s
    - distance_m
  surface_breakdown:
    - time_s
    - distance_m
  penalty_breakdown: true
  explain_cost_derivation: true

