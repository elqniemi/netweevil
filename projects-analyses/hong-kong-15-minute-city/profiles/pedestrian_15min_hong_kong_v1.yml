profile:
  id: pedestrian_15min_hong_kong_v1
  label: "Hong Kong 15-minute city pedestrian profile"
  mode: foot
  defaults_pack: hk_foot_2026_05
  extends: foot_default

cost:
  objective: generalized
  distance_weight: 0.015
  time_weight: 1.0

speed_rules:
  - match:
      highway: footway
    speed_kph: 4.8
  - match:
      highway: pedestrian
    speed_kph: 4.8
  - match:
      highway: path
    speed_kph: 4.8
  - match:
      highway: steps
    speed_kph: 2.5
  - match:
      highway: residential
    speed_kph: 4.8
  - match:
      highway: service
    speed_kph: 4.0
  - match:
      highway: tertiary
    speed_kph: 4.6
  - match:
      highway: secondary
    speed_kph: 4.6
  - match:
      highway: primary
    speed_kph: 4.5
  - match:
      highway: track
    speed_kph: 4.0
  - match:
      route: ferry
    speed_kph: 18.0

exclude_rules:
  - match:
      highway: motorway
  - match:
      highway: trunk

factors:
  - match:
      surface: gravel
    speed_factor: 0.90
  - match:
      surface: cobblestone
    speed_factor: 0.82
  - match:
      surface: ground
    speed_factor: 0.90
  - match:
      surface: dirt
    speed_factor: 0.78
  - match:
      surface: sand
    speed_factor: 0.55
  - match:
      smoothness: bad
    speed_factor: 0.82
  - match:
      smoothness: very_bad
    speed_factor: 0.65
  - match:
      smoothness: horrible
    speed_factor: 0.45
  - match:
      smoothness: impassable
    speed_factor: 0.20

turns:
  left_penalty_s: 0
  right_penalty_s: 0
  uturn_penalty_s: 0
  traffic_signal_penalty_s: 5
  roundabout_entry_penalty_s: 0

ferry:
  allow: true
  use_ferry: 0.30
  boarding_cost_s: 240
  infer_duration_when_missing: true
  default_speed_kph: 18

preferences:
  use_highways: 0.01
  use_tolls: 0.0
  use_tracks: 0.25
  service_penalty_s: 8

returns:
  geometry: full
  segment_rows: true
  road_type_breakdown:
    - time_s
    - distance_m
  surface_breakdown:
    - time_s
    - distance_m
  penalty_breakdown: true
  explain_cost_derivation: true

