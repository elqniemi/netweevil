study:
  id: groningen_15_minute_city_2026_05
  label: Groningen 15-minute city analysis
  crs: EPSG:4326
  routing_dataset: groningen_2026_05_08

sources:
  osm_full: datasets/groningen-260508.osm.pbf
  osm_routing_admin: datasets/groningen-260508-routing-admin.osm.pbf
  osm_admin: datasets/groningen-260508-admin.osm.pbf
  gtfs_openov: datasets/gtfs-openov-nl.zip

profiles:
  cycling: projects-analyses/groningen-15-minute-city/profiles/cycling_15min_groningen_v1.yml
  walking: examples/profiles/pedestrian_research_v1.yml
  car: examples/profiles/car_research_v3.yml

thresholds_s:
  primary: 900
  sensitivity: [600, 720, 900, 1200]
  reachability_counts: [300, 600, 900, 1200]
  transit_context: [900, 1800, 2700]

score_categories:
  baseline:
    - food_retail
    - education
    - healthcare
    - public_services
    - parks_recreation
    - transit_stops
  extended:
    - social_life
    - bicycle_support

service_categories:
  food_retail:
    label: Food retail
    tags:
      - shop=supermarket
      - shop=convenience
      - shop=bakery
      - shop=greengrocer
      - shop=butcher
      - amenity=marketplace
  education:
    label: Education
    tags:
      - amenity=kindergarten
      - amenity=school
      - amenity=college
      - amenity=university
      - amenity=childcare
  healthcare:
    label: Healthcare
    tags:
      - amenity=doctors
      - amenity=clinic
      - amenity=hospital
      - amenity=dentist
      - amenity=pharmacy
      - healthcare=*
  public_services:
    label: Public services
    tags:
      - amenity=library
      - amenity=townhall
      - amenity=post_office
      - amenity=community_centre
      - amenity=social_facility
  parks_recreation:
    label: Parks and recreation
    tags:
      - leisure=park
      - leisure=playground
      - leisure=sports_centre
      - leisure=pitch
      - landuse=recreation_ground
  social_life:
    label: Daily social life
    tags:
      - amenity=cafe
      - amenity=restaurant
      - amenity=pub
      - amenity=fast_food
      - amenity=cinema
      - amenity=theatre
  transit_stops:
    label: Public transport access
    tags:
      - highway=bus_stop
      - public_transport=platform
      - public_transport=stop_position
      - railway=station
      - railway=tram_stop
  bicycle_support:
    label: Bicycle support
    tags:
      - amenity=bicycle_parking
      - amenity=bicycle_rental
      - shop=bicycle
      - amenity=bicycle_repair_station

residential_origins:
  aggregation:
    type: h3
    resolution: 9
    point_set: requests/origins/residential_h3_r9_points.csv
  building_values:
    - apartments
    - house
    - residential
    - terrace
    - detached
    - dormitory
  fallback_tags:
    - addr:housenumber=*
