            $ref: '#/components/schemas/BatchAlternativeResult'
    OdPairResult:
      allOf:
        - type: object
          required: [pair_id, origin_id, destination_id]
          properties:
            pair_id: {type: string}
            origin_id: {type: string}
            destination_id: {type: string}
