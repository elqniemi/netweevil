        succeeded_count: {type: integer}
        failed_count: {type: integer}
        ignored_count: {type: integer}
        pairs:
          type: array
          items:
            $ref: '#/components/schemas/OdPairResult'
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/AnalysisDiagnostic'
        warnings:
          type: array
          items: {type: string}
    OdResponse:
      type: object
