      properties:
        distance_m: {type: number}
        lon: {type: number}
        lat: {type: number}
        z: {type: number}
        edges:
          type: array
          items:
            $ref: '#/components/schemas/LocatedEdge'
    LocatedPoint:
      type: object
      required: [point_id, candidates, nearest]
      properties:
        point_id: {type: string}
        candidates:
          type: array
          description: Snap candidates for a route. Empty when the point does not snap within `snap.max_distance_m`.
          items:
            $ref: '#/components/schemas/SnappedPoint'
        nearest:
          type: array
          description: Nearest road segments, nearest first.
          items:
            $ref: '#/components/schemas/LocatedSegment'
    LocateResponse:
      type: object
      required: [service, result]
      properties:
        service:
          type: object
          required: [dataset_id, profile_id]
          properties:
            dataset_id: {type: string}
            profile_id: {type: string}
        result:
          type: array
          items:
            $ref: '#/components/schemas/LocatedPoint'
    ServiceAreaThresholdMetric:
      type: string
      enum: [distance_m, travel_time_s]
    ServiceAreaDirection:
      type: string
      description: '`outbound` covers what the origins reach. `inbound` covers the positions that reach the origins.'
      enum: [outbound, inbound]
      default: outbound
    ExpansionRequest:
      type: object
      required: [action, origin]
      properties:
        action:
          type: string
          description: |
            `route` searches from `origin` until it settles `destination`.
            `service_area` searches up to `limit` on `metric`. `hierarchy`
            shows the contraction hierarchy query from `origin` to
            `destination`. It needs a profile with a hierarchy.
          enum: [route, service_area, hierarchy]
        origin:
          $ref: '#/components/schemas/LabeledPoint'
        destination:
          oneOf:
            - $ref: '#/components/schemas/LabeledPoint'
            - type: 'null'
        limit:
          type: [number, 'null']
        metric:
          allOf:
            - $ref: '#/components/schemas/ServiceAreaThresholdMetric'
          default: travel_time_s
        direction:
          $ref: '#/components/schemas/ServiceAreaDirection'
        snap:
          $ref: '#/components/schemas/SnapOptions'
        max_edges:
          type: integer
          default: 50000
          description: The search stops when it settles this number of edges.
    ExpansionExecutionRequest:
      type: object
      required: [request]
      properties:
        profile_id:
          $ref: '#/components/schemas/ProfileId'
        request:
          $ref: '#/components/schemas/ExpansionRequest'
    ExpansionResponse:
      type: object
      required: [type, features, meta]
      properties:
        type:
          type: string
          const: FeatureCollection
        features:
          type: array
          description: |
            One `LineString` feature for each settled edge. The properties are
            `order`, `edge_index`, `edge_id`, `cost`, `previous_edge_index`
            and `side` (`forward` or `backward`).
          items:
            $ref: '#/components/schemas/GeoJsonFeature'
        meta:
          type: object
          required: [dataset_id, profile_id, action, direction, metric, settled_edge_count, truncated, route_cost]
          properties:
            dataset_id: {type: string}
            profile_id: {type: string}
            action:
              type: string
              enum: [route, service_area, hierarchy]
            direction:
              $ref: '#/components/schemas/ServiceAreaDirection'
            metric: {type: string}
            settled_edge_count: {type: integer}
            truncated:
              type: boolean
              description: The search stopped at `max_edges`.
            route_cost: {type: [number, 'null']}

