    # ------------------------------------------------------------------
    # Service areas and accessibility
    # ------------------------------------------------------------------
    ServiceAreaThreshold:
      type: object
      required: [limit, metric]
      properties:
        id: {type: [string, 'null']}
        limit:
          type: number
          description: Seconds for `travel_time_s`. Metres for `distance_m`.
        metric:
          $ref: '#/components/schemas/ServiceAreaThresholdMetric'
    ServiceAreaOutputMode:
      type: string
      enum: [network, polygon, both]
      default: both
    ServiceAreaBandMode:
      type: string
      description: '`cumulative` areas contain the smaller areas. `ring` areas start at the previous threshold. `none` gives one area for each threshold.'
      enum: [cumulative, ring, none]
      default: cumulative
    ServiceAreaBoundaryMode:
      type: string
      enum: [overlap, cut_at_boundary]
      default: overlap
    ServiceAreaMultiOriginMode:
      type: string
      enum: [merge, overlap, cut]
      default: merge
    ServiceAreaPolygonOptions:
      type: object
      properties:
        hull_aggressiveness: {type: number, default: 1.0}
        simplification_tolerance_m:
          type: [number, 'null']
          description: Douglas-Peucker tolerance for each ring, in metres.
        cell_size_m:
          type: [number, 'null']
          description: Grid cell size for the polygon boundary. The default is 25 m multiplied by `hull_aggressiveness`, minimum 10 m.
        denoise:
          type: [number, 'null']
          minimum: 0
          maximum: 1
          description: Remove parts smaller than this fraction of the largest part. `1` keeps only the largest part.
        min_part_area_m2:
          type: [number, 'null']
        min_hole_area_m2:
          type: [number, 'null']
          description: Fill holes that are smaller than this area.
    ServiceAreaReturnOptions:
      type: object
      properties:
        geometry: {type: boolean, default: true}
        attributes: {type: boolean, default: true}
        per_threshold_summary: {type: boolean, default: true}
        diagnostics: {type: boolean, default: true}
        segments: {type: boolean, default: false}
        max_features: {type: integer, default: 250000}
        max_segments: {type: integer, default: 250000}
        max_geometry_points: {type: integer, default: 1000000}
    ServiceAreaRequest:
      allOf:
        - type: object
          required: [analysis_id]
          properties:
            analysis_id: {type: string}
            origins:
              type: array
              items:
                $ref: '#/components/schemas/LabeledPoint'
            thresholds:
              type: array
              items:
                $ref: '#/components/schemas/ServiceAreaThreshold'
            snap:
              $ref: '#/components/schemas/SnapOptions'
            connectivity:
              $ref: '#/components/schemas/ConnectivityPolicy'
            fallback:
              $ref: '#/components/schemas/FallbackPolicy'
            output_mode:
              $ref: '#/components/schemas/ServiceAreaOutputMode'
            band_mode:
              $ref: '#/components/schemas/ServiceAreaBandMode'
            boundary_mode:
              $ref: '#/components/schemas/ServiceAreaBoundaryMode'
            multi_origin_mode:
              $ref: '#/components/schemas/ServiceAreaMultiOriginMode'
            direction:
              $ref: '#/components/schemas/ServiceAreaDirection'
            polygon:
              $ref: '#/components/schemas/ServiceAreaPolygonOptions'
            returns:
              $ref: '#/components/schemas/ServiceAreaReturnOptions'
        - $ref: '#/components/schemas/TemporalRequestOptions'
    ServiceAreaExecutionRequest:
      type: object
      required: [request]
      properties:
        profile_id:
          $ref: '#/components/schemas/ProfileId'
        request:
          $ref: '#/components/schemas/ServiceAreaRequest'
    ServiceAreaThresholdFields:
      type: object
      required: [origin_id, band_start_limit, threshold_id, threshold_limit, threshold_metric, fallback_used, origin_component_id, origin_hop_distance_m]
      properties:
        origin_id: {type: [string, 'null']}
        band_start_limit: {type: [number, 'null']}
        threshold_id: {type: [string, 'null']}
        threshold_limit: {type: number}
        threshold_metric:
          $ref: '#/components/schemas/ServiceAreaThresholdMetric'
        fallback_used: {type: boolean}
        origin_component_id: {type: [integer, 'null']}
        origin_hop_distance_m: {type: [number, 'null']}
    ServiceAreaFeature:
      allOf:
        - $ref: '#/components/schemas/ServiceAreaThresholdFields'
        - type: object
          required: [geometry_type, reachable_network_length_m, reachable_edge_count, edge_id, edge_index, source_way_id, from_node_id, to_node_id, start_fraction, end_fraction, start_cost, end_cost, segment_distance_m, segment_travel_time_s, geometry]
          properties:
            geometry_type:
              type: string
              enum: [network, polygon, segment]
            reachable_network_length_m: {type: [number, 'null']}
            reachable_edge_count: {type: [integer, 'null']}
            edge_id: {type: [integer, 'null']}
            edge_index: {type: [integer, 'null']}
            source_way_id: {type: [integer, 'null']}
            from_node_id: {type: [integer, 'null']}
            to_node_id: {type: [integer, 'null']}
            start_fraction: {type: [number, 'null']}
            end_fraction: {type: [number, 'null']}
            start_cost: {type: [number, 'null']}
            end_cost: {type: [number, 'null']}
            segment_distance_m: {type: [number, 'null']}
            segment_travel_time_s: {type: [number, 'null']}
            start_components:
              $ref: '#/components/schemas/CostComponents'
            end_components:
              $ref: '#/components/schemas/CostComponents'
            geometry:
              oneOf:
                - $ref: '#/components/schemas/GeoJsonGeometry'
                - type: 'null'
    ServiceAreaSegment:
      allOf:
        - $ref: '#/components/schemas/ServiceAreaThresholdFields'
        - type: object
          required: [edge_id, edge_index, source_way_id, from_node_id, to_node_id, start_fraction, end_fraction, start_cost, end_cost, segment_distance_m, segment_travel_time_s, geometry]
          properties:
            edge_id: {type: integer}
            edge_index: {type: integer}
            source_way_id: {type: integer}
            from_node_id: {type: integer}
            to_node_id: {type: integer}
            start_fraction: {type: number}
            end_fraction: {type: number}
            start_cost: {type: number}
            end_cost: {type: number}
            segment_distance_m: {type: number}
            segment_travel_time_s: {type: [number, 'null']}
            start_components:
              $ref: '#/components/schemas/CostComponents'
            end_components:
              $ref: '#/components/schemas/CostComponents'
            geometry:
              oneOf:
                - $ref: '#/components/schemas/GeoJsonGeometry'
                - type: 'null'
    ServiceAreaThresholdSummary:
      allOf:
        - $ref: '#/components/schemas/ServiceAreaThresholdFields'
        - type: object
          required: [reachable_network_length_m, reachable_edge_count]
          properties:
            reachable_network_length_m: {type: [number, 'null']}
            reachable_edge_count: {type: [integer, 'null']}
    ServiceAreaResult:
      type: object
      required: [analysis_id, outcome, output_mode, band_mode, boundary_mode, multi_origin_mode, direction, origin_count, processed_origin_count, skipped_origin_count, fallback_origin_count, threshold_count, warnings]
      properties:
        analysis_id: {type: string}
        departure_time: {type: string}
        scenario_id: {type: string}
        outcome:
          $ref: '#/components/schemas/AnalysisOutcome'
        output_mode:
          $ref: '#/components/schemas/ServiceAreaOutputMode'
        band_mode:
          $ref: '#/components/schemas/ServiceAreaBandMode'
        boundary_mode:
          $ref: '#/components/schemas/ServiceAreaBoundaryMode'
        multi_origin_mode:
          $ref: '#/components/schemas/ServiceAreaMultiOriginMode'
        direction:
          $ref: '#/components/schemas/ServiceAreaDirection'
        origin_count: {type: integer}
        processed_origin_count: {type: integer}
        skipped_origin_count: {type: integer}
        fallback_origin_count: {type: integer}
        threshold_count: {type: integer}
        features:
          type: array
          items:
            $ref: '#/components/schemas/ServiceAreaFeature'
        summaries:
          type: array
          items:
            $ref: '#/components/schemas/ServiceAreaThresholdSummary'
        segments:
          type: array
          items:
            $ref: '#/components/schemas/ServiceAreaSegment'
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/AnalysisDiagnostic'
        warnings:
          type: array
          items: {type: string}
    ServiceAreaResponse:
      type: object
      required: [service, result]
      properties:
        service:
          $ref: '#/components/schemas/ExecutionContext'
        result:
          $ref: '#/components/schemas/ServiceAreaResult'
    ServiceAreaSequenceRequest:
      type: object
      required: [sequence_id, request]
      properties:
        sequence_id: {type: string}
        request:
          $ref: '#/components/schemas/ServiceAreaRequest'
        departure_times:
          type: array
          items: {type: string, format: date-time}
        start_time:
          type: [string, 'null']
          format: date-time
        end_time:
          type: [string, 'null']
          format: date-time
          description: Inclusive end of the range.
        step_s:
          type: [integer, 'null']
    ServiceAreaSequenceExecutionRequest:
      type: object
      required: [request]
      properties:
        profile_id:
          $ref: '#/components/schemas/ProfileId'
        request:
          $ref: '#/components/schemas/ServiceAreaSequenceRequest'
    ServiceAreaSequenceResult:
      type: object
      required: [sequence_id, frame_count, frames]
      properties:
        sequence_id: {type: string}
        frame_count: {type: integer}
        frames:
          type: array
          items:
            type: object
            required: [frame_index, departure_time, result]
            properties:
              frame_index: {type: integer}
              departure_time: {type: string}
              result:
                $ref: '#/components/schemas/ServiceAreaResult'
    ServiceAreaSequenceResponse:
      type: object
      required: [service, result]
      properties:
        service:
          $ref: '#/components/schemas/ExecutionContext'
        result:
          $ref: '#/components/schemas/ServiceAreaSequenceResult'
    AccessibilityRequest:
      type: object
      required: [origins, max_travel_time_s]
      properties:
        origins:
          $ref: '#/components/schemas/PointSetDocument'
        categories:
          type: array
          items:
            type: object
            required: [category_id, destinations]
            properties:
              category_id: {type: string}
              destinations:
                $ref: '#/components/schemas/PointSetDocument'
        thresholds_s:
          type: array
          items: {type: number}
        max_travel_time_s: {type: number}
    AccessibilityExecutionRequest:
      type: object
      required: [request]
      properties:
        profile_id:
          $ref: '#/components/schemas/ProfileId'
        engine_mode:
          $ref: '#/components/schemas/EngineMode'
        request:
          $ref: '#/components/schemas/AccessibilityRequest'
    AccessibilityCategoryResult:
      type: object
      required: [origin_id, category_id, status, outcome, fallback_used, origin_component_id, origin_hop_distance_m, origin_snap_distance_m, destination_count, snapped_destination_count, nearest_destination_id, nearest_travel_time_s, nearest_destination_snap_distance_m, counts_within_threshold_s, error]
      properties:
        origin_id: {type: string}
        category_id: {type: string}
        status:
          $ref: '#/components/schemas/BatchItemStatus'
        outcome:
          $ref: '#/components/schemas/AnalysisOutcome'
        fallback_used: {type: boolean}
        origin_component_id: {type: [integer, 'null']}
        origin_hop_distance_m: {type: [number, 'null']}
        origin_snap_distance_m: {type: [number, 'null']}
        destination_count: {type: integer}
        snapped_destination_count: {type: integer}
        nearest_destination_id: {type: [string, 'null']}
        nearest_travel_time_s: {type: [number, 'null']}
        nearest_destination_snap_distance_m: {type: [number, 'null']}
        counts_within_threshold_s:
          type: object
          description: Destination count for each threshold. The key is the threshold in seconds.
          additionalProperties: {type: integer}
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/AnalysisDiagnostic'
        error: {type: [string, 'null']}
    AccessibilityResult:
      type: object
      required: [origin_count, category_count, destination_count, max_travel_time_s, thresholds_s, row_count, succeeded_count, failed_count, skipped_origin_count, rows, warnings]
      properties:
        departure_time: {type: string}
        arrive_by: {type: string}
        scenario_id: {type: string}
        origin_count: {type: integer}
        category_count: {type: integer}
        destination_count: {type: integer}
        max_travel_time_s: {type: number}
        thresholds_s:
          type: array
          items: {type: number}
        row_count: {type: integer}
        succeeded_count: {type: integer}
        failed_count: {type: integer}
        skipped_origin_count: {type: integer}
        rows:
          type: array
          items:
            $ref: '#/components/schemas/AccessibilityCategoryResult'
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/AnalysisDiagnostic'
        warnings:
          type: array
          items: {type: string}
    AccessibilityResponse:
      type: object
      required: [service, result]
      properties:
        service:
          $ref: '#/components/schemas/ExecutionContext'
        result:
          $ref: '#/components/schemas/AccessibilityResult'

    # ------------------------------------------------------------------
    # Betweenness and scenario batches
    # ------------------------------------------------------------------
    WeightedPoint:
      type: object
      required: [id, lon, lat]
      properties:
        id: {type: string}
        lon: {type: number}
        lat: {type: number}
        z: {type: [number, 'null']}
        weight:
          type: number
          default: 1.0
          description: Demand weight. The demand of a pair is the origin weight multiplied by the destination weight.
    BetweennessRequest:
      allOf:
        - type: object
          required: [analysis_id, origins, destinations]
          properties:
            analysis_id: {type: string}
            origins:
              type: array
              items:
                $ref: '#/components/schemas/WeightedPoint'
            destinations:
              type: array
              items:
                $ref: '#/components/schemas/WeightedPoint'
            snap:
              $ref: '#/components/schemas/SnapOptions'
            max_od_pairs:
              type: integer
              default: 2000000
            include_zero:
              type: boolean
              default: false
              description: Include edges with a zero score.
        - $ref: '#/components/schemas/TemporalRequestOptions'
    BetweennessExecutionRequest:
      type: object
      required: [request]
      properties:
        profile_id:
          $ref: '#/components/schemas/ProfileId'
        request:
          $ref: '#/components/schemas/BetweennessRequest'
    BetweennessEdgeScore:
      type: object
      required: [edge_id, source_way_id, from_node_id, to_node_id, score, normalized_score, routed_pair_count, geometry]
      properties:
        edge_id: {type: integer}
        source_way_id: {type: integer}
        from_node_id: {type: integer}
        to_node_id: {type: integer}
        score: {type: number}
        normalized_score: {type: number}
        routed_pair_count: {type: integer}
        geometry:
          type: array
          items:
            $ref: '#/components/schemas/Coordinate3'
    BetweennessResult:
      type: object
      required: [analysis_id, origin_count, destination_count, requested_pair_count, routed_pair_count, unreachable_pair_count, routed_demand, time_dependent, edges, warnings]
      properties:
        analysis_id: {type: string}
        departure_time: {type: string}
        arrive_by: {type: string}
        scenario_id: {type: string}
        origin_count: {type: integer}
        destination_count: {type: integer}
        requested_pair_count: {type: integer}
        routed_pair_count: {type: integer}
        unreachable_pair_count: {type: integer}
        routed_demand: {type: number}
        time_dependent: {type: boolean}
        pairs:
          type: array
          description: Pair results. Scenario batches fill this list.
          items:
            type: object
            required: [origin_index, destination_index, demand, routed]
            properties:
              origin_index: {type: integer}
              destination_index: {type: integer}
              demand: {type: number}
              routed: {type: boolean}
        edges:
          type: array
          items:
            $ref: '#/components/schemas/BetweennessEdgeScore'
        warnings:
          type: array
          items: {type: string}
    BetweennessResponse:
      type: object
      required: [service, result]
      properties:
        service:
          $ref: '#/components/schemas/ExecutionContext'
        result:
          $ref: '#/components/schemas/BetweennessResult'
    ScenarioFeatureScore:
      type: object
      required: [source_feature_id, score]
      properties:
        source_feature_id: {type: integer}
        score: {type: number}
    ScenarioBatchCase:
      type: object
      description: A scenario. Send exactly one of `overlay`, `top_k` and `group`.
      required: [id]
      properties:
        id: {type: string}
        overlay:
          $ref: '#/components/schemas/ScenarioOverlay'
        top_k:
          type: object
          description: Close the `count` features with the highest scores. Scores of repeated features add up.
          required: [ranking, count]
          properties:
            ranking:
              type: array
              items:
                $ref: '#/components/schemas/ScenarioFeatureScore'
            count: {type: integer}
        group:
          type: object
          description: Close all features with this attribute value.
          required: [attribute, value]
          properties:
            attribute:
              type: string
              description: Source attribute name or semantic role, for example `mall_id`.
            value: {type: string}
      oneOf:
        - required: [overlay]
        - required: [top_k]
        - required: [group]
    ScenarioBatchRequest:
      type: object
      additionalProperties: false
      required: [batch_id]
      properties:
        batch_id: {type: string}
        departure_time:
          type: [string, 'null']
          description: The service uses this time for analyses that have no time of their own.
        scenarios:
          type: array
          items:
            $ref: '#/components/schemas/ScenarioBatchCase'
        routes:
          type: array
          items:
            $ref: '#/components/schemas/RouteRequest'
        service_areas:
          type: array
          items:
            $ref: '#/components/schemas/ServiceAreaRequest'
        accessibility:
          type: array
          items:
            $ref: '#/components/schemas/AccessibilityRequest'
        od:
          type: array
          items:
            type: object
            required: [analysis_id, request]
            properties:
              analysis_id: {type: string}
              request:
                $ref: '#/components/schemas/OdPairsDocument'
        matrices:
          type: array
          items:
            type: object
            required: [analysis_id, origins, destinations]
            properties:
              analysis_id: {type: string}
              origins:
                $ref: '#/components/schemas/PointSetDocument'
              destinations:
                $ref: '#/components/schemas/PointSetDocument'
        betweenness:
          type: array
          items:
            $ref: '#/components/schemas/BetweennessRequest'
    ScenarioBatchExecutionRequest:
      type: object
      required: [request]
      properties:
        profile_id:
          $ref: '#/components/schemas/ProfileId'
        request:
          $ref: '#/components/schemas/ScenarioBatchRequest'
    ScenarioAnalysisSnapshot:
      type: object
      description: Each entry has an id, and a `result` or an `error`.
      required: [routes, service_areas, accessibility, od, matrices, betweenness]
      properties:
        routes:
          type: array
          items:
            type: object
            required: [route_id]
            properties:
              route_id: {type: string}
              result:
                $ref: '#/components/schemas/RouteResult'
              error: {type: string}
        service_areas:
          type: array
          items:
            type: object
            required: [analysis_id]
            properties:
              analysis_id: {type: string}
              result:
                $ref: '#/components/schemas/ServiceAreaResult'
              error: {type: string}
        accessibility:
          type: array
          items:
            type: object
            required: [analysis_id]
            properties:
              analysis_id: {type: string}
              result:
                $ref: '#/components/schemas/AccessibilityResult'
              error: {type: string}
        od:
          type: array
          items:
            type: object
            required: [analysis_id]
            properties:
              analysis_id: {type: string}
              result:
                $ref: '#/components/schemas/OdResult'
              error: {type: string}
        matrices:
          type: array
          items:
            type: object
            required: [analysis_id]
            properties:
              analysis_id: {type: string}
              result:
                $ref: '#/components/schemas/MatrixResult'
              error: {type: string}
        betweenness:
          type: array
          items:
            type: object
            required: [analysis_id]
            properties:
              analysis_id: {type: string}
              result:
                $ref: '#/components/schemas/BetweennessResult'
              error: {type: string}
    ScenarioBatchDiff:
      type: object
      description: Comparison of a scenario with the baseline.
      required: [disconnected_route_count, disconnected_accessibility_row_count, disconnected_od_pair_count, disconnected_matrix_cell_count, disconnected_betweenness_pair_count, disconnected_demand_count, route_time_change_s, rerouting_burden_s, od_route_time_change_s, od_rerouting_burden_s, matrix_route_time_change_s, matrix_rerouting_burden_s, weighted_disconnected_demand, betweenness_edge_score_absolute_change, service_area_reachable_network_loss_m, accessibility_reachable_destination_loss]
      properties:
        disconnected_route_count: {type: integer}
        disconnected_accessibility_row_count: {type: integer}
        disconnected_od_pair_count: {type: integer}
        disconnected_matrix_cell_count: {type: integer}
        disconnected_betweenness_pair_count: {type: integer}
        disconnected_demand_count: {type: integer}
        route_time_change_s: {type: number}
        rerouting_burden_s: {type: number}
        mean_rerouting_burden_s: {type: number}
        od_route_time_change_s: {type: number}
        od_rerouting_burden_s: {type: number}
        matrix_route_time_change_s: {type: number}
        matrix_rerouting_burden_s: {type: number}
        weighted_disconnected_demand: {type: number}
        betweenness_edge_score_absolute_change: {type: number}
        service_area_reachable_network_loss_m: {type: number}
        accessibility_reachable_destination_loss: {type: integer}
    ScenarioBatchCaseResult:
      type: object
      required: [scenario_id, analyses, diff]
      properties:
        scenario_id: {type: string}
        overlay:
          $ref: '#/components/schemas/ScenarioOverlay'
        top_k:
          type: object
          properties:
            ranking:
              type: array
              items:
                $ref: '#/components/schemas/ScenarioFeatureScore'
            count: {type: integer}
        group:
          type: object
          properties:
            attribute: {type: string}
            value: {type: string}
        closed_source_feature_ids:
          type: array
          description: The features that a `top_k` or `group` selector closed.
          items: {type: integer}
        analyses:
          $ref: '#/components/schemas/ScenarioAnalysisSnapshot'
        diff:
          $ref: '#/components/schemas/ScenarioBatchDiff'
    ScenarioBatchResponse:
      type: object
      required: [service, result]
      properties:
        service:
          $ref: '#/components/schemas/ExecutionContext'
        result:
          type: object
          required: [batch_id, baseline, scenarios]
          properties:
            batch_id: {type: string}
            baseline:
              $ref: '#/components/schemas/ScenarioAnalysisSnapshot'
            scenarios:
              type: array
              items:
                $ref: '#/components/schemas/ScenarioBatchCaseResult'

    # ------------------------------------------------------------------
    # Transit
    # ------------------------------------------------------------------
    AccessMode:
      type: string
      enum: [walk, bicycle, car]
    TransitMode:
      type: string
      enum: [tram, subway, rail, bus, ferry, cable_car, gondola, funicular, coach, air, other]
    TransitPoint:
      type: object
      required: [id, lon, lat]
      properties:
        id: {type: string}
        lon: {type: number}
        lat: {type: number}
        z:
          type: number
          description: Elevation in the street graph datum. Network hosts keep endpoint snaps within one metre of it.
    TransitQueryTime:
      type: object
      required: [datetime]
      properties:
        datetime:
          type: string
          format: date-time
          description: RFC 3339 departure time, or arrival time with `arrive_by`.
        arrive_by: {type: boolean, default: false}
        search_window_s: {type: integer, default: 3600}
    TransitModeOptions:
      type: object
      properties:
        max_endpoint_snap_distance_m:
          type: number
          default: 50
          description: Maximum gap from an endpoint to the street network.
        access:
          type: array
          default: [walk]
          items:
            $ref: '#/components/schemas/AccessMode'
        egress:
          type: array
          default: [walk]
          items:
            $ref: '#/components/schemas/AccessMode'
        mixed_access_egress:
          type: boolean
          default: false
          description: Set this to use different access and egress mode lists.
        transit:
          type: array
          default: [tram, subway, rail, bus, ferry, cable_car, gondola, funicular, coach]
          items:
            $ref: '#/components/schemas/TransitMode'
        walk_speed_kph: {type: number, default: 4.8}
        bicycle_speed_kph: {type: number, default: 15}
        car_access_speed_kph: {type: number, default: 25}
        max_access_distance_m: {type: number, default: 1000}
        max_egress_distance_m: {type: number, default: 1000}
        max_bicycle_access_distance_m: {type: number, default: 5000}
        max_bicycle_egress_distance_m: {type: number, default: 5000}
        max_car_access_distance_m: {type: number, default: 15000}
        max_car_egress_distance_m: {type: number, default: 15000}
        max_transfer_distance_m: {type: number, default: 500}
        transfer_profile_id:
          type: string
          description: Use the network transfer table of this profile. When absent, transfers use straight-line walks.
        board_slack_s: {type: integer, default: 30}
        transfer_slack_s: {type: integer, default: 120}
        max_transfers: {type: integer, default: 4, minimum: 0, maximum: 255}
        min_transit_leg_duration_s: {type: integer, default: 0}
        min_transit_leg_distance_m: {type: number, default: 0}
        street_access:
          type: string
          enum: [straight_line, network]
          default: straight_line
          description: '`network` uses a street engine for access and egress times. Candidates without a network path are not reachable.'
    TransitReturnOptions:
      type: object
      properties:
        include_geometry: {type: boolean, default: false}
        walking_geometry:
          type: string
          enum: [straight_line, network]
          default: straight_line
          description: '`network` replaces straight street legs with network paths. It needs a loaded foot profile.'
        include_stops: {type: boolean, default: false}
        include_stop_segments: {type: boolean, default: false}
    TransitAlternativeOptions:
      type: object
      properties:
        max_routes: {type: integer, default: 1}
        max_time_ratio: {type: number, default: 1.5}
        max_extra_time_s: {type: [integer, 'null']}
    TransitRouteRequest:
      type: object
      required: [route_id, origin, destination, time]
      properties:
        route_id: {type: string}
        origin:
          $ref: '#/components/schemas/TransitPoint'
        destination:
          $ref: '#/components/schemas/TransitPoint'
        time:
          $ref: '#/components/schemas/TransitQueryTime'
        modes:
          $ref: '#/components/schemas/TransitModeOptions'
        returns:
          $ref: '#/components/schemas/TransitReturnOptions'
        alternatives:
          $ref: '#/components/schemas/TransitAlternativeOptions'
    TransitRouteExecutionRequest:
      type: object
      required: [feed_id, request]
      properties:
        feed_id:
          type: string
          description: Id of a loaded transit feed.
        pedestrian_profile_id:
          type: [string, 'null']
          description: Foot profile for walk legs. The default is the first loaded foot profile.
        access_profile_id:
          type: [string, 'null']
          description: Profile for bicycle or car access legs.
        egress_profile_id:
          type: [string, 'null']
          description: Profile for bicycle or car egress legs.
        request:
          $ref: '#/components/schemas/TransitRouteRequest'
    TransitExecutionContext:
      type: object
      required: [feed_id, service_start_date, service_days, agency_timezone, time_origin_unix_s, route_engine, walking_geometry]
      properties:
        feed_id: {type: string}
        service_start_date: {type: string, format: date}
        service_days: {type: integer}
        agency_timezone: {type: string}
        time_origin_unix_s: {type: integer}
        route_engine: {type: string}
        walking_geometry:
          type: string
          enum: [straight_line, network]
        transfer_profile_id: {type: string}
        pedestrian_profile_id: {type: string}
        access_profile_id: {type: string}
        egress_profile_id: {type: string}
    TransitTimeContext:
      type: object
      required: [agency_timezone, time_origin_unix_s]
      properties:
        agency_timezone: {type: string}
        time_origin_unix_s:
          type: integer
          description: Unix time of transit time zero. Add the `*_s` values to get Unix times.
    TransitOutcome:
      type: string
      enum: [scheduled, unreachable]
    TransitRouteSummary:
      type: object
      required: [departure_s, arrival_s, total_travel_time_s, transit_time_s, access_egress_time_s, transfer_time_s, wait_time_s, boarding_count]
      properties:
        departure_s: {type: integer}
        arrival_s: {type: [integer, 'null']}
        total_travel_time_s: {type: [integer, 'null']}
        transit_time_s: {type: integer}
        access_egress_time_s: {type: integer}
        transfer_time_s: {type: integer}
        wait_time_s: {type: integer}
        boarding_count: {type: integer}
    TransitStreetPath:
      type: object
      required: [travel_time_s, distance_m, edge_path, geometry, components]
      properties:
        travel_time_s: {type: integer}
        distance_m: {type: [number, 'null']}
        edge_path:
          type: array
          items: {type: integer}
        geometry:
          type: array
          items:
            $ref: '#/components/schemas/Coordinate3'
        components:
          $ref: '#/components/schemas/CostComponents'
    TransitLeg:
      type: object
      required: [leg_type, from_id, to_id, from_name, to_name, departure_s, arrival_s]
      properties:
        leg_type:
          type: string
          enum: [access, transit, transfer, egress]
        from_id: {type: string}
        to_id: {type: string}
        from_name: {type: string}
        to_name: {type: string}
        departure_s: {type: integer}
        arrival_s: {type: integer}
        mode:
          $ref: '#/components/schemas/TransitMode'
        street_mode:
          $ref: '#/components/schemas/AccessMode'
        route_id: {type: string}
        route_short_name: {type: string}
        trip_id: {type: string}
        run_index:
          type: integer
          description: Identifies the vehicle run in the imported timetable.
        headsign: {type: string}
        geometry:
          type: array
          items:
            $ref: '#/components/schemas/Coordinate3'
        geometry_elevation_source:
          type: string
          description: Source of the geometry elevations. Interpolated GTFS shapes are display geometry only.
        network_path:
          $ref: '#/components/schemas/TransitStreetPath'
    TransitRouteStop:
      type: object
      required: [sequence, stop_id, stop_name, lon, lat]
      properties:
        sequence: {type: integer}
        stop_id: {type: string}
        stop_name: {type: string}
        lon: {type: number}
        lat: {type: number}
        z: {type: number}
        arrival_s: {type: integer}
        departure_s: {type: integer}
        mode:
          $ref: '#/components/schemas/TransitMode'
        route_id: {type: string}
        route_short_name: {type: string}
        trip_id: {type: string}
        headsign: {type: string}
    TransitRouteStopSegment:
      type: object
      required: [segment_index, from_stop_id, to_stop_id, from_stop_name, to_stop_name, departure_s, arrival_s, duration_s]
      properties:
        segment_index: {type: integer}
        from_stop_id: {type: string}
        to_stop_id: {type: string}
        from_stop_name: {type: string}
        to_stop_name: {type: string}
        departure_s: {type: integer}
        arrival_s: {type: integer}
        duration_s: {type: integer}
        mode:
          $ref: '#/components/schemas/TransitMode'
        route_id: {type: string}
        route_short_name: {type: string}
        trip_id: {type: string}
        headsign: {type: string}
        geometry:
          type: array
          items:
            $ref: '#/components/schemas/Coordinate3'
        geometry_elevation_source: {type: string}
    TransitRouteResult:
      type: object
      required: [route_id, time_context, outcome, summary, legs, diagnostics]
      properties:
        route_id: {type: string}
        time_context:
          $ref: '#/components/schemas/TransitTimeContext'
        outcome:
          $ref: '#/components/schemas/TransitOutcome'
        summary:
          $ref: '#/components/schemas/TransitRouteSummary'
        legs:
          type: array
          items:
            $ref: '#/components/schemas/TransitLeg'
        stops:
          type: array
          items:
            $ref: '#/components/schemas/TransitRouteStop'
        stop_segments:
          type: array
          items:
            $ref: '#/components/schemas/TransitRouteStopSegment'
        diagnostics:
          type: array
          items: {type: string}
        alternatives:
          type: array
          items:
            type: object
            required: [alternative_index, rank, summary, legs]
            properties:
              alternative_index: {type: integer}
              rank: {type: integer}
              summary:
                $ref: '#/components/schemas/TransitRouteSummary'
              legs:
                type: array
                items:
                  $ref: '#/components/schemas/TransitLeg'
              stops:
                type: array
                items:
                  $ref: '#/components/schemas/TransitRouteStop'
              stop_segments:
                type: array
                items:
                  $ref: '#/components/schemas/TransitRouteStopSegment'
    TransitRouteResponse:
      type: object
      required: [service, result]
      properties:
        service:
          $ref: '#/components/schemas/TransitExecutionContext'
        result:
          $ref: '#/components/schemas/TransitRouteResult'
    TransitDirectionsExecutionRequest:
      allOf:
        - $ref: '#/components/schemas/TransitRouteExecutionRequest'
        - type: object
          properties:
            directions_options:
              $ref: '#/components/schemas/DirectionsOptions'
    TransitDirection:
      type: object
      required: [sequence, kind, leg_index, instruction, departure_s, arrival_s, duration_s, departure_datetime, arrival_datetime, from_id, to_id, from_name, to_name]
      properties:
        sequence: {type: integer}
        kind:
          type: string
          enum: [wait, board, ride, alight, access, transfer, egress]
        leg_index: {type: integer}
        instruction: {type: string}
        departure_s: {type: integer}
        arrival_s: {type: integer}
        duration_s: {type: integer}
        departure_datetime: {type: string, format: date-time}
        arrival_datetime: {type: string, format: date-time}
        from_id: {type: string}
        to_id: {type: string}
        from_name: {type: string}
        to_name: {type: string}
        route_id: {type: string}
        route_short_name: {type: string}
        headsign: {type: string}
        transit_mode:
          $ref: '#/components/schemas/TransitMode'
        street_mode:
          $ref: '#/components/schemas/AccessMode'
        platform: {type: string}
        location:
          $ref: '#/components/schemas/Coordinate3'
        walking_maneuvers:
          type: array
          description: Street maneuvers of a street leg with a network path.
          items:
            $ref: '#/components/schemas/Maneuver'
    TransitDirectionsResponse:
      type: object
      required: [service, result, language, directions]
      properties:
        service:
          $ref: '#/components/schemas/TransitExecutionContext'
        result:
          $ref: '#/components/schemas/TransitRouteResult'
        language: {type: string}
        directions:
          type: array
          items:
            $ref: '#/components/schemas/TransitDirection'
        directions_diagnostics:
          type: array
          items: {type: string}
    TransitServiceAreaRequest:
      type: object
      required: [analysis_id, time]
      properties:
        analysis_id: {type: string}
        catchment_mode:
          type: string
          enum: [stops, street_isochrone]
          default: stops
          description: '`street_isochrone` continues on the street network after transit, up to the total time.'
        origins:
          type: array
          items:
            $ref: '#/components/schemas/TransitPoint'
        time:
          $ref: '#/components/schemas/TransitQueryTime'
        modes:
          $ref: '#/components/schemas/TransitModeOptions'
        max_travel_time_s: {type: integer, default: 3600}
        returns:
          type: object
          properties:
            include_stops: {type: boolean, default: true}
            include_stop_segments: {type: boolean, default: true}
            include_geometry: {type: boolean, default: true}
            max_stops: {type: integer, default: 100000}
            max_stop_segments: {type: integer, default: 200000}
            max_geometry_points: {type: integer, default: 1000000}
    TransitServiceAreaExecutionRequest:
      type: object
      required: [feed_id, request]
      properties:
        feed_id: {type: string}
        pedestrian_profile_id: {type: [string, 'null']}
        access_profile_id: {type: [string, 'null']}
        egress_profile_id: {type: [string, 'null']}
        request:
          $ref: '#/components/schemas/TransitServiceAreaRequest'
    TransitServiceAreaResult:
      type: object
      required: [analysis_id, catchment_mode, time_context, outcome, origin_count, processed_origin_count, skipped_origin_count, max_travel_time_s]
      properties:
        analysis_id: {type: string}
        catchment_mode:
          type: string
          enum: [stops, street_isochrone]
        time_context:
          $ref: '#/components/schemas/TransitTimeContext'
        outcome:
          $ref: '#/components/schemas/TransitOutcome'
        origin_count: {type: integer}
        processed_origin_count: {type: integer}
        skipped_origin_count: {type: integer}
        max_travel_time_s: {type: integer}
        stops:
          type: array
          items:
            type: object
            required: [origin_id, stop_id, stop_name, lon, lat, arrival_s, travel_time_s, boarding_count]
            properties:
              origin_id: {type: string}
              stop_id: {type: string}
              stop_name: {type: string}
              lon: {type: number}
              lat: {type: number}
              arrival_s: {type: integer}
              travel_time_s: {type: integer}
              boarding_count: {type: integer}
              access_mode:
                $ref: '#/components/schemas/AccessMode'
        stop_segments:
          type: array
          items:
            type: object
            required: [origin_id, from_stop_id, to_stop_id, from_stop_name, to_stop_name, departure_s, arrival_s, duration_s, travel_time_s, boarding_count]
            properties:
              origin_id: {type: string}
              from_stop_id: {type: string}
              to_stop_id: {type: string}
              from_stop_name: {type: string}
              to_stop_name: {type: string}
              departure_s: {type: integer}
              arrival_s: {type: integer}
              duration_s: {type: integer}
              travel_time_s: {type: integer}
              boarding_count: {type: integer}
              mode:
                $ref: '#/components/schemas/TransitMode'
              route_id: {type: string}
              route_short_name: {type: string}
              trip_id: {type: string}
              geometry:
                type: array
                items:
                  $ref: '#/components/schemas/Coordinate2'
        features:
          type: array
          items:
            type: object
            required: [origin_id, mode, geometry_type, threshold_limit, threshold_metric, reachable_network_length_m, reachable_edge_count, geometry]
            properties:
              origin_id: {type: string}
              mode:
                $ref: '#/components/schemas/AccessMode'
              geometry_type: {type: string}
              threshold_limit: {type: number}
              threshold_metric: {type: string}
              reachable_network_length_m: {type: number}
              reachable_edge_count: {type: integer}
              geometry:
                oneOf:
                  - $ref: '#/components/schemas/GeoJsonGeometry'
                  - type: 'null'
        diagnostics:
          type: array
          items: {type: string}
    TransitServiceAreaResponse:
      type: object
      required: [service, result]
      properties:
        service:
          $ref: '#/components/schemas/TransitExecutionContext'
        result:
          $ref: '#/components/schemas/TransitServiceAreaResult'
    StationGeometryRequest:
      type: object
      required: [bbox]
      properties:
        bbox:
          $ref: '#/components/schemas/BBox'
        limit:
          type: integer
          default: 2000
          description: Maximum number of features. The service clamps the value to 1 through 5000.
    StationGeometryResponse:
      type: object
      required: [type, metadata, features]
      properties:
        type:
          type: string
          const: FeatureCollection
        metadata:
          type: object
          required: [feed_id, available, surface_source_available, matched, returned, truncated]
          properties:
            feed_id: {type: string}
            available: {type: boolean}
            surface_source_available:
              type: boolean
              description: The file `<name>.stations.geojson` exists next to the GTFS file.
            matched: {type: integer}
            returned: {type: integer}
            truncated: {type: boolean}
        features:
          type: array
          description: |
            Polygon features have `kind: platform_surface`. Point features
            have `kind: boarding_point`, `stop_id`, `name`, `station_code` and
            `binding_attributes`. All features have `reference_only: true`.
          items:
            $ref: '#/components/schemas/GeoJsonFeature'
    TransitBindingsResponse:
      type: object
      required: [type, features, metadata]
      properties:
        type:
          type: string
          const: FeatureCollection
        features:
          type: array
          description: |
            One feature for each examined stop. The properties are `stop_id`,
            `stop_name`, `gtfs_lon`, `gtfs_lat`, `binding`,
            `resolution_status` (`resolved`, `no_departure_candidates`,
            `no_arrival_candidates` or `unresolved`), `origin_candidates`,
            `destination_candidates` and `diagnostic`.
          items:
            $ref: '#/components/schemas/GeoJsonFeature'
        metadata:
          type: object
          required: [feed_id, dataset_id, profile_id, total_bound_stops, checked_bound_stops, failed_bound_stops, truncated, connectivity_check]
          properties:
            feed_id: {type: string}
            dataset_id: {type: string}
            profile_id: {type: string}
            total_bound_stops: {type: integer}
            checked_bound_stops: {type: integer}
            failed_bound_stops: {type: integer}
            truncated: {type: boolean}
            connectivity_check: {type: string}
    FeedStop:
      type: object
      required: [stop_id, name, lon, lat]
      properties:
        stop_id: {type: string}
        name: {type: string}
        lon: {type: number}
        lat: {type: number}
    FeedStopsResponse:
      type: object
      required: [feed_id, total, truncated, stops]
      properties:
        feed_id: {type: string}
        total:
          type: integer
          description: Number of stops that agree with the filters.
        truncated: {type: boolean}
        stops:
          type: array
          items:
            $ref: '#/components/schemas/FeedStop'
    FeedRoute:
      type: object
      required: [route_id, short_name, long_name, mode, trip_count]
      properties:
        route_id: {type: string}
        short_name: {type: string}
        long_name: {type: string}
        mode:
          $ref: '#/components/schemas/TransitMode'
        trip_count: {type: integer}
    TransitRoutePattern:
      type: object
      required: [route_id, headsign, run_count, stops]
      properties:
        route_id: {type: string}
        headsign: {type: string}
        run_count: {type: integer}
        stops:
          type: array
          items:
            type: object
            required: [stop_id, name, lon, lat, arrival_offset_s, departure_offset_s]
            properties:
              stop_id: {type: string}
              name: {type: string}
              lon: {type: number}
              lat: {type: number}
              arrival_offset_s: {type: integer}
              departure_offset_s: {type: integer}

    # ------------------------------------------------------------------
    # Traffic
    # ------------------------------------------------------------------
    TrafficStatusResponse:
      type: object
      description: When `enabled` is true, the response also has the traffic status fields.
      required: [enabled]
      properties:
        enabled: {type: boolean}
        traffic_id: {type: string}
        timezone: {type: string}
        bucket_minutes: {type: integer}
        pattern_count: {type: integer}
        feature_count: {type: integer}
        matched_edge_count: {type: integer}
        distinct_bucket_metrics: {type: integer}
        current_bucket:
          $ref: '#/components/schemas/TrafficBucketInfo'
        live_version: {type: integer}
        live_entry_count: {type: integer}
        live_active_entry_count: {type: integer}
        last_swap:
          $ref: '#/components/schemas/LiveSwapReport'
        profiles:
          type: array
          items:
            type: object
            required: [profile_id, policy, cached_engines]
            properties:
              profile_id: {type: string}
              policy:
                type: string
                enum: [replace, slow_down_only]
                description: '`replace` uses the observed speed. `slow_down_only` uses the observed speed only when it is lower.'
              cached_engines: {type: integer}
    LiveSwapReport:
      type: object
      required: [version, update_count, entry_count, active_entry_count, snapshot_ms, profiles, swap_ms, published_at]
      properties:
        version: {type: integer}
        update_count: {type: integer}
        entry_count: {type: integer}
        active_entry_count: {type: integer}
        unmatched_feature_ids:
          type: array
          items: {type: integer}
        snapshot_ms: {type: number}
        profiles:
          type: array
          items:
            type: object
            required: [profile_id, customize_ms, engine_cache]
            properties:
              profile_id: {type: string}
              customize_ms: {type: number}
              engine_cache: {type: string}
        swap_ms: {type: number}
        published_at: {type: string, format: date-time}
    LiveTrafficUpdate:
      type: object
      additionalProperties: false
      description: One live observation for one source feature. You can use `way_id` as an alias of `feature_id`.
      properties:
        feature_id: {type: integer}
        way_id:
          type: integer
          description: Alias of `feature_id`.
        direction:
          type: string
          enum: [forward, backward, both]
          default: both
          description: Direction relative to the source geometry.
        speed_kph:
          type: number
          description: Observed speed. It replaces the historical speed and the profile speed.
        closed:
          type: boolean
          default: false
        clear:
          type: boolean
          default: false
          description: Remove the live state of the feature.
        expires_at:
          type: string
          format: date-time
        ttl_s:
          type: number
          description: Validity in seconds after receipt when `expires_at` is absent. The default is 900.
      oneOf:
        - required: [feature_id]
        - required: [way_id]
    LiveTrafficRequest:
      type: object
      additionalProperties: false
      properties:
        updates:
          type: array
          items:
            $ref: '#/components/schemas/LiveTrafficUpdate'
        replace:
          type: boolean
          default: false
          description: Replace all live entries. When false, the service merges the updates.
    LiveTrafficAccepted:
      type: object
      required: [accepted, replace]
      properties:
        accepted: {type: integer}
        replace: {type: boolean}

    # ------------------------------------------------------------------
    # Network, terrain and height
    # ------------------------------------------------------------------
    NetworkEdgesRequest:
      type: object
      required: [bbox]
      properties:
        bbox:
          $ref: '#/components/schemas/BBox'
        profile_id:
          $ref: '#/components/schemas/ProfileId'
        compare_profile_id:
          type: [string, 'null']
          description: Second profile. Its values and the differences are added to each feature.
        max_edges:
          type: integer
          default: 25000
    NetworkEdgesResponse:
      type: object
      required: [type, features, meta]
      properties:
        type:
          type: string
          const: FeatureCollection
        features:
          type: array
          description: |
            One `LineString` feature for each edge. The properties include
            `edge_id`, `way_id`, `direction`, `length_m`, `road_class`,
            `highway`, `surface`, `max_speed_kph`, `lanes`, the access flags,
            `oneway`, `component`, `grade_pct`, `allowed`, `travel_time_s`,
            `speed_kph`, `cost`, `cost_per_km` and `source_attributes`. With a
            compare profile, they also include `b_*` values and `delta_*`
            values.
          items:
            $ref: '#/components/schemas/GeoJsonFeature'
        meta:
          type: object
          required: [dataset_id, profile_id, compare_profile_id, edge_count, truncated, ranges]
          properties:
            dataset_id: {type: string}
            profile_id: {type: string}
            compare_profile_id: {type: [string, 'null']}
            edge_count: {type: integer}
            truncated: {type: boolean}
            ranges:
              type: object
              description: Minimum and maximum of each numeric property, for color scales.
              additionalProperties:
                type: array
                items: {type: number}
                minItems: 2
                maxItems: 2
    TerrainSource:
      type: object
      description: A terrain source manifest. The service can add more provenance members.
      required: [id, name, version, bounds, minzoom, maxzoom, encoding, tile_size, vertical_datum, resolution_m, attribution, tiles]
      additionalProperties: true
      properties:
        id: {type: string}
        name: {type: string}
        version: {type: string}
        bounds:
          $ref: '#/components/schemas/BBox'
        minzoom: {type: integer}
        maxzoom: {type: integer, maximum: 24}
        encoding:
          type: string
          enum: [terrarium, mapbox]
        tile_size:
          type: integer
          enum: [256, 512]
        vertical_datum: {type: string}
        resolution_m: {type: number}
        attribution: {type: string}
        tiles:
          type: array
          description: Tile URL template on this service.
          items: {type: string}
          example: ['/v1/terrain/hk_dtm/0123456789abcdef/{z}/{x}/{y}.png']
    TerrainSourcesResponse:
      type: object
      required: [sources]
      properties:
        sources:
          type: array
          items:
            $ref: '#/components/schemas/TerrainSource'
        diagnostics:
          type: array
          items: {type: string}
    HeightRequest:
      type: object
      additionalProperties: false
      properties:
        points:
          type: array
          items:
            $ref: '#/components/schemas/Coordinate2'
        encoded_polyline:
          type: [string, 'null']
          description: Encoded polyline (Google algorithm, latitude first). Use it instead of `points`.
        polyline_precision:
          type: integer
          enum: [5, 6]
          default: 6
        range:
          type: boolean
          default: false
          description: Send `[distance_m, height]` pairs along the line.
        resample_distance_m:
          type: [number, 'null']
          description: Make a point at this interval along the line. The last point stays.
    HeightResponse:
      type: object
      required: [service, result]
      properties:
        service:
          type: object
          required: [dataset_id, vertical_datum, crs]
          properties:
            dataset_id: {type: string}
            vertical_datum: {type: [string, 'null']}
            crs:
              type: string
              description: Horizontal CRS of the stored raster.
        result:
          type: object
          properties:
            heights:
              type: array
              description: Heights in metres. Null outside the raster or on a nodata cell.
              items: {type: [number, 'null']}
            range_heights:
              type: array
              items:
                type: array
                prefixItems:
                  - type: number
                  - type: [number, 'null']
                minItems: 2
                maxItems: 2
            shape:
              type: array
              description: The resampled line, for point input.
              items:
                $ref: '#/components/schemas/Coordinate2'
            encoded_polyline:
              type: string
              description: The resampled line, for polyline input.
      example:
        service: {dataset_id: hong_kong_2026_07, vertical_datum: HKPD, crs: 'EPSG:2326'}
        result:
          heights: [12.4, 8.1, 5.6]
          range_heights: [[0.0, 12.4], [1350.2, 8.1], [2591.7, 5.6]]

    # ------------------------------------------------------------------
    # Simulation
    # ------------------------------------------------------------------
    SimulationCreateRequest:
      type: object
      required: [scenario]
      properties:
        scenario:
          $ref: '#/components/schemas/SimulationScenario'
    SimulationScenario:
      type: object
      required: [scenario, fleets]
      properties:
        scenario:
          type: object
          required: [id]
          properties:
            id: {type: string}
            label: {type: string, default: ''}
            seed:
              type: integer
              default: 1
              description: Random seed. The same seed gives the same run.
            description: {type: string, default: ''}
        time:
          type: object
          properties:
            duration_s: {type: number, default: 3600}
            tick_s: {type: number, default: 1}
            stop_when_all_arrived: {type: boolean, default: true}
        fleets:
          type: array
          items:
            $ref: '#/components/schemas/FleetConfig'
        zones:
          type: array
          items:
            $ref: '#/components/schemas/ZoneConfig'
        traffic:
          type: object
          properties:
            model:
              type: string
              enum: [greenshields, bpr]
              default: greenshields
            bpr_alpha: {type: number, default: 1.0}
            bpr_beta: {type: number, default: 4.0}
            min_speed_factor: {type: number, default: 0.05}
            background_load: {type: number, default: 0}
            signal_cycle_s: {type: number, default: 60}
            signal_green_share: {type: number, default: 0.55}
            reroute_budget_per_s: {type: integer, default: 80}
        output:
          type: object
          properties:
            frame_interval_s: {type: number, default: 5}
            frame_max_agents: {type: integer, default: 20000}
            edge_stats_interval_s: {type: number, default: 60}
            store_trajectories: {type: boolean, default: true}
            position_model:
              type: string
              enum: [linear, trapezoidal]
              default: linear
    EndpointDistribution:
      description: Where the simulation samples endpoints.
      oneOf:
        - type: object
          required: [kind]
          properties:
            kind: {const: random_bounds}
        - type: object
          required: [kind, bbox]
          properties:
            kind: {const: random_bbox}
            bbox:
              $ref: '#/components/schemas/BBox'
        - type: object
          required: [kind, polygon]
          properties:
            kind: {const: random_polygon}
            polygon:
              type: array
              items:
                $ref: '#/components/schemas/Coordinate2'
        - type: object
          required: [kind, points]
          properties:
            kind: {const: points}
            points:
              type: array
              items:
                type: object
                required: [lon, lat]
                properties:
                  lon: {type: number}
                  lat: {type: number}
                  weight: {type: number, default: 1.0}
                  label: {type: string, default: ''}
        - type: object
          required: [kind, zone_ids]
          properties:
            kind: {const: zones}
            zone_ids:
              type: array
              items: {type: string}
    DepartureConfig:
      description: When the agents depart. The default is `uniform` from 0 to 600 s.
      oneOf:
        - type: object
          required: [kind, start_s, end_s]
          properties:
            kind: {const: uniform}
            start_s: {type: number}
            end_s: {type: number}
        - type: object
          required: [kind, mean_s, std_s]
          properties:
            kind: {const: peak}
            mean_s: {type: number}
            std_s: {type: number}
        - type: object
          required: [kind, at_s]
          properties:
            kind: {const: instant}
            at_s: {type: number}
        - type: object
          required: [kind, start_s, rate_per_s]
          properties:
            kind: {const: poisson}
            start_s: {type: number}
            rate_per_s: {type: number}
    FleetConfig:
      type: object
      required: [fleet_id, profile_id, agent_count]
      properties:
        fleet_id: {type: string}
        profile_id:
          type: string
          description: Loaded profile that routes and paces this fleet.
        agent_count: {type: integer}
        demand:
          type: object
          properties:
            origins:
              $ref: '#/components/schemas/EndpointDistribution'
            destinations:
              $ref: '#/components/schemas/EndpointDistribution'
            od_pairs:
              type: array
              description: Explicit pairs. They replace `origins` and `destinations`. The service repeats them when there are more agents.
              items:
                type: object
                required: [origin, destination]
                properties:
                  origin:
                    $ref: '#/components/schemas/Coordinate2'
                  destination:
                    $ref: '#/components/schemas/Coordinate2'
        departures:
          $ref: '#/components/schemas/DepartureConfig'
        behavior:
          type: object
          properties:
            overtake_eagerness: {type: number, default: 0.4}
            reroute_eagerness: {type: number, default: 0.3}
            jam_speed_threshold: {type: number, default: 0.4}
            reroute_cooldown_s: {type: number, default: 120}
            obey_traffic_signals: {type: boolean, default: true}
            alternative_route_share: {type: number, default: 0.25}
            max_alternatives: {type: integer, default: 3}
            no_collision: {type: boolean, default: true}
            heterogeneity: {type: number, default: 0.15}
        speed:
          type: object
          properties:
            speed_multiplier_mean: {type: number, default: 1.0}
            speed_multiplier_std: {type: number, default: 0.08}
            max_speed_kph: {type: [number, 'null']}
            acceleration_mps2: {type: number, default: 2.0}
            deceleration_mps2: {type: number, default: 2.5}
            pcu:
              type: [number, 'null']
              description: Passenger car units of one vehicle. The default depends on the mode.
    ZoneEffect:
      oneOf:
        - type: object
          required: [kind]
          properties:
            kind: {const: no_access}
            modes:
              type: array
              description: Closed modes. Empty closes all modes.
              items:
                $ref: '#/components/schemas/TravelMode'
        - type: object
          required: [kind, factor]
          properties:
            kind: {const: speed_factor}
            factor: {type: number}
        - type: object
          required: [kind, factor]
          properties:
            kind: {const: capacity_factor}
            factor: {type: number}
        - type: object
          required: [kind, background_load]
          properties:
            kind: {const: high_traffic}
            background_load: {type: number, minimum: 0, maximum: 1}
        - type: object
          required: [kind]
          properties:
            kind: {const: spawn}
            weight: {type: number, default: 1.0}
        - type: object
          required: [kind]
          properties:
            kind: {const: attract}
            weight: {type: number, default: 1.0}
    ZoneConfig:
      type: object
      required: [zone_id, polygon, effect]
      properties:
        zone_id: {type: string}
        label: {type: string, default: ''}
        polygon:
          type: array
          description: WGS84 outer ring. It can be open or closed.
          items:
            $ref: '#/components/schemas/Coordinate2'
        effect:
          $ref: '#/components/schemas/ZoneEffect'
    SimulationCommand:
      oneOf:
        - type: object
          required: [command]
          properties:
            command:
              type: string
              enum: [pause, resume, cancel]
        - type: object
          required: [command, factor]
          properties:
            command: {const: set_global_speed_factor}
            factor:
              type: number
              description: Multiplier on all edge speeds. `1.0` gives the normal speeds.
        - type: object
          required: [command, zone]
          properties:
            command: {const: add_zone}
            zone:
              $ref: '#/components/schemas/ZoneConfig'
        - type: object
          required: [command, zone_id]
          properties:
            command: {const: remove_zone}
            zone_id: {type: string}
        - type: object
          required: [command, fleet]
          properties:
            command: {const: spawn_fleet}
            fleet:
              $ref: '#/components/schemas/FleetConfig'
    SimRunState:
      type: string
      enum: [pending, dispatching, running, paused, completed, cancelled, failed]
    SimulationStatus:
      type: object
      required: [state, sim_time_s, duration_s, tick_s, agents_total, agents_active, agents_arrived, agents_pending, agents_failed, frames_available, frame_interval_s, edge_bins_available, edge_stats_interval_s, global_speed_factor, wall_time_ms, message, fleets]
      properties:
        state:
          $ref: '#/components/schemas/SimRunState'
        sim_time_s: {type: number}
        duration_s: {type: number}
        tick_s: {type: number}
        agents_total: {type: integer}
        agents_active: {type: integer}
        agents_arrived: {type: integer}
        agents_pending: {type: integer}
        agents_failed: {type: integer}
        frames_available: {type: integer}
        frame_interval_s: {type: number}
        edge_bins_available: {type: integer}
        edge_stats_interval_s: {type: number}
        global_speed_factor: {type: number}
        wall_time_ms: {type: integer}
        message: {type: string}
        fleets:
          type: array
          items:
            type: object
            required: [fleet_id, mode, profile_id, requested, dispatched, dispatch_failed, active, arrived, reroutes]
            properties:
              fleet_id: {type: string}
              mode: {type: string}
              profile_id: {type: string}
              requested: {type: integer}
              dispatched: {type: integer}
              dispatch_failed: {type: integer}
              active: {type: integer}
              arrived: {type: integer}
              reroutes: {type: integer}
    SimulationCreateResponse:
      type: object
      required: [simulation_id, status]
      properties:
        simulation_id: {type: string}
        status:
          $ref: '#/components/schemas/SimulationStatus'
    SimulationInfo:
      type: object
      required: [simulation_id, scenario_id, created_at, status]
      properties:
        simulation_id: {type: string}
        scenario_id: {type: string}
        created_at: {type: string, format: date-time}
        status:
          $ref: '#/components/schemas/SimulationStatus'
        error:
          type: string
          description: Present when the run failed.
        summary:
          type: object
          description: Present on `GET /v1/simulation/{simulation_id}` after the run completes.
          properties:
            summary:
              type: object
              properties:
                simulated_s: {type: number}
                wall_time_ms: {type: integer}
                cancelled: {type: boolean}
                agents_total: {type: integer}
                agents_arrived: {type: integer}
                agents_unfinished: {type: integer}
                agents_never_departed: {type: integer}
                dispatch_failed: {type: integer}
                total_reroutes: {type: integer}
            fleets:
              type: array
              items:
                type: object
                additionalProperties: true
            edge_usage_count: {type: integer}
            trajectory_count: {type: integer}
    SimulationFramesResponse:
      type: object
      required: [simulation_id, state, sim_time_s, frame_interval_s, frames_available, frames]
      properties:
        simulation_id: {type: string}
        state:
          $ref: '#/components/schemas/SimRunState'
        sim_time_s: {type: number}
        frame_interval_s: {type: number}
        frames_available: {type: integer}
        frames:
          type: array
          items:
            type: object
            required: [t, active_total, agents]
            properties:
              t: {type: number}
              active_total:
                type: integer
                description: All active agents. This can be more than the sampled agents.
              agents:
                type: object
                description: Columnar agent data. All arrays have the same length.
                required: [id, fleet, lon, lat, speed_mps, edge]
                properties:
                  id:
                    type: array
                    items: {type: integer}
                  fleet:
                    type: array
                    items: {type: string}
                  lon:
                    type: array
                    items: {type: number}
                  lat:
                    type: array
                    items: {type: number}
                  speed_mps:
                    type: array
                    items: {type: number}
                  edge:
                    type: array
                    items: {type: integer}

    # ------------------------------------------------------------------
    # Workspace
    # ------------------------------------------------------------------
    WorkspaceConfig:
      type: object
      required: [dataset_id, default_profile, profiles, transit_feeds, updated_at]
      properties:
        dataset_id: {type: string}
        default_profile:
          type: string
          description: Profile file path.
        profiles:
          type: array
          items: {type: string}
        transit_feeds:
          type: array
          items: {type: string}
        traffic: {type: string}
        updated_at: {type: [string, 'null']}
    SourceFormat:
      type: string
      enum: [osm_pbf, overture_parquet, geo_package]
    JobRecord:
      type: object
      required: [job_id, kind, label, state, stage, message, started_at]
      properties:
        job_id: {type: string}
        kind: {type: string}
        label: {type: string}
        state:
          type: string
          enum: [running, done, failed]
        stage: {type: string}
        message: {type: string}
        percent: {type: number}
        started_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time}
        error: {type: string}
        result:
          type: object
          description: The job result. The operation that started the job describes the members.
          additionalProperties: true
    JobStarted:
      type: object
      required: [job_id]
      properties:
        job_id: {type: string}
    UploadInfo:
      type: object
      required: [name, path, size_bytes, kind]
      properties:
        name: {type: string}
        path: {type: string}
        size_bytes: {type: integer}
        kind:
          type: string
          enum: [osm, overture, gpkg, gtfs, profile, other]
    ProfileFileInfo:
      type: object
      required: [path, file_name, source, profile_id, label, mode, error, active, is_default]
      properties:
        path: {type: string}
        file_name: {type: string}
        source:
          type: string
          enum: [workspace, examples]
          description: '`workspace` for `.netweevil/profiles`. `examples` for `examples/profiles`.'
        profile_id: {type: [string, 'null']}
        label: {type: [string, 'null']}
        mode: {type: [string, 'null']}
        error:
          type: [string, 'null']
          description: Parse or validation error of the file.
        active: {type: boolean}
        is_default: {type: boolean}
    WorkspaceInfo:
      type: object
      required: [root, state_dir, config_path, locations, loaded, active, saved, datasets, profiles, transit_feeds, uploads, jobs, example_profiles_dir]
      properties:
        root: {type: string}
        state_dir: {type: string}
        config_path: {type: string}
        locations:
          type: array
          items:
            type: object
            required: [key, path, purpose]
            properties:
              key: {type: string}
              path: {type: string}
              purpose: {type: string}
        loaded:
          type: boolean
          description: A dataset is loaded and analyses can run.
        active:
          description: The selection in memory.
          oneOf:
            - $ref: '#/components/schemas/WorkspaceConfig'
            - type: 'null'
        saved:
          description: The selection for the next start without arguments.
          oneOf:
            - $ref: '#/components/schemas/WorkspaceConfig'
            - type: 'null'
        datasets:
          type: array
          items:
            type: object
            required: [dataset_id, label, source_path, source_format, source_size_bytes, imported_at, node_count, edge_count, has_acceleration, compiled_profile_ids, active]
            properties:
              dataset_id: {type: string}
              label: {type: string}
              source_path: {type: string}
              source_format:
                $ref: '#/components/schemas/SourceFormat'
              source_size_bytes: {type: integer}
              imported_at: {type: string}
              node_count: {type: [integer, 'null']}
              edge_count: {type: [integer, 'null']}
              has_acceleration: {type: boolean}
              compiled_profile_ids:
                type: array
                items: {type: string}
              active: {type: boolean}
        profiles:
          type: array
          items:
            $ref: '#/components/schemas/ProfileFileInfo'
        transit_feeds:
          type: array
          items:
            type: object
            required: [feed_id, label, source_path, imported_at, service_start_date, service_days, agency_timezone, stop_count, route_count, trip_count, bundle_path, loaded, scenario_id]
            properties:
              feed_id: {type: string}
              label: {type: string}
              source_path: {type: string}
              imported_at: {type: string}
              service_start_date: {type: string}
              service_days: {type: integer}
              agency_timezone: {type: string}
              stop_count: {type: integer}
              route_count: {type: integer}
              trip_count: {type: integer}
              bundle_path: {type: string}
              loaded: {type: boolean}
              scenario_id:
                type: [string, 'null']
                description: Set when the GTFS editor built the feed.
        uploads:
          type: array
          items:
            $ref: '#/components/schemas/UploadInfo'
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/JobRecord'
        example_profiles_dir: {type: [string, 'null']}
    DatasetImportRequest:
      type: object
      required: [sources, name]
      properties:
        sources:
          type: array
          minItems: 1
          description: Upload names or paths. You can combine more than one Overture parquet file.
          items: {type: string}
        name:
          type: string
          description: Dataset id. Letters, digits, `_` and `-`.
        format:
          oneOf:
            - $ref: '#/components/schemas/SourceFormat'
            - type: 'null'
          description: The service finds the format when it is absent.
        mapping:
          type: [string, 'null']
          description: Upload name or path of an ingest mapping. GeoPackage sources need it.
        admin_boundaries:
          type: [string, 'null']
          description: Upload name or path of a GeoJSON or OSM PBF boundaries file.
        dem:
          oneOf:
            - type: object
              required: [source]
              properties:
                source:
                  type: string
                  description: Upload name or path of an ESRI ASCII grid or a GeoTIFF.
                crs: {type: [string, 'null']}
                vertical_datum: {type: [string, 'null']}
            - type: 'null'
          description: DEM to sample for node heights and edge grades.
    DatasetUpdateRequest:
      type: object
      properties:
        diffs:
          type: array
          description: osmChange upload names in `.netweevil/uploads/`. The service applies them in order.
          items: {type: string}
        source:
          type: [string, 'null']
          description: Upload name of a newer OSM PBF extract. Use it instead of `diffs`.
        reorder:
          type: string
          enum: [auto, always, never]
          default: auto
          description: '`auto` orders the hierarchy again when the fill growth is above `max_fill_growth`.'
        max_fill_growth:
          type: [number, 'null']
          description: The default is 1.10.
    ProfileTemplate:
      type: object
      required: [template_id, label, mode, description, yaml]
      properties:
        template_id:
          type: string
          enum: [car, bicycle, pedestrian, truck, bus, taxi, motorcycle, moped]
        label: {type: string}
        mode: {type: string}
        description: {type: string}
        yaml: {type: string}
    CreateProfileRequest:
      type: object
      required: [yaml]
      properties:
        yaml:
          type: string
          description: The profile document as YAML.
        file_name:
          type: [string, 'null']
          description: File name in `.netweevil/profiles`. The default is `<profile id>.yml`.
        overwrite:
          type: boolean
          default: false
    ProfileFileContent:
      type: object
      required: [path, file_name, yaml]
      properties:
        path: {type: string}
        file_name: {type: string}
        yaml: {type: string}
    TransitImportRequest:
      type: object
      required: [source, name, service_start]
      properties:
        source:
          type: string
          description: Upload name or path of a GTFS zip file or directory.
        name:
          type: string
          description: Feed id.
        service_start:
          type: string
          format: date
          description: First service date, `YYYY-MM-DD`.
        service_days:
          type: integer
          default: 7
    ActivateRequest:
      type: object
      required: [dataset_id, default_profile]
      properties:
        dataset_id: {type: string}
        default_profile:
          type: string
          description: Profile file path (workspace, examples or absolute).
        profiles:
          type: array
          items: {type: string}
        transit_feeds:
          type: array
          items: {type: string}
        traffic:
          type: [string, 'null']
          description: Imported historical traffic set. Live updates work without one.

    # ------------------------------------------------------------------
    # GTFS editor
    # ------------------------------------------------------------------
    GtfsScenario:
      type: object
      required: [scenario_id, label]
      properties:
        schema_version: {type: integer}
        scenario_id: {type: string}
        label: {type: string}
        base_feed_id:
          type: [string, 'null']
          description: Imported feed that this scenario extends. Null makes a new feed.
        output_feed_id:
          type: [string, 'null']
          description: Feed id of the built result. The default is the scenario id.
        agency:
          type: object
          required: [name, timezone]
          properties:
            name: {type: string}
            url: {type: string, default: ''}
            timezone: {type: string}
        service_start_date:
          type: [string, 'null']
          format: date
          description: First service date of a new feed. Overlays use the window of the base feed.
        service_days: {type: [integer, 'null']}
        stops:
          type: array
          items:
            type: object
            required: [stop_id, name, lon, lat]
            properties:
              stop_id: {type: string}
              name: {type: string}
              lon: {type: number}
              lat: {type: number}
        lines:
          type: array
          items:
            $ref: '#/components/schemas/GtfsScenarioLine'
        removed_route_ids:
          type: array
          description: Base feed routes whose trips the build removes.
          items: {type: string}
        created_at: {type: string}
        updated_at: {type: string}
    GtfsScenarioLine:
      type: object
      required: [line_id, short_name, mode, stops]
      properties:
        line_id: {type: string}
        short_name: {type: string}
        long_name: {type: string, default: ''}
        mode:
          $ref: '#/components/schemas/TransitMode'
        color:
          type: [string, 'null']
          description: Hex color without `#`, as GTFS `route_color`.
        headsign:
          type: [string, 'null']
          description: The default is the name of the last stop.
        stops:
          type: array
          items:
            type: object
            required: [stop_id]
            properties:
              stop_id:
                type: string
                description: A scenario stop id or a base feed stop id.
              travel_s:
                type: [integer, 'null']
                description: Running time from the previous stop. When absent, the service uses the distance and the line speed.
              dwell_s: {type: [integer, 'null']}
        average_speed_kph: {type: number, default: 30}
        default_dwell_s: {type: integer, default: 0}
        bidirectional:
          type: boolean
          default: true
          description: Also run trips in the reverse stop order.
        services:
          type: array
          items:
            type: object
            required: [days]
            properties:
              days:
                type: array
                description: Monday through Sunday.
                items: {type: boolean}
                minItems: 7
                maxItems: 7
              windows:
                type: array
                items:
                  type: object
                  required: [start, end, headway_min]
                  properties:
                    start: {type: string, example: '07:00'}
                    end: {type: string, example: '19:00'}
                    headway_min: {type: integer}
              departures:
                type: array
                description: Departures from the first stop as `HH:MM`. Hours can be more than 24.
                items: {type: string}
    GtfsScenarioInfo:
      type: object
      required: [scenario_id, label, base_feed_id, output_feed_id, path, export_path, stop_count, line_count, updated_at, base_loaded, built, summary, validation_error]
      properties:
        scenario_id: {type: string}
        label: {type: string}
        base_feed_id: {type: [string, 'null']}
        output_feed_id: {type: string}
        path: {type: string}
        export_path: {type: string}
        stop_count: {type: integer}
        line_count: {type: integer}
        updated_at: {type: string}
        base_loaded:
          type: boolean
          description: The base feed is loaded. The editor needs it for the base stops.
        built:
          oneOf:
            - type: object
              required: [feed_id, bundle_path, built_at, loaded, stop_count, route_count, trip_count]
              properties:
                feed_id: {type: string}
                bundle_path: {type: string}
                built_at: {type: string}
                loaded: {type: boolean}
                stop_count: {type: integer}
                route_count: {type: integer}
                trip_count: {type: integer}
            - type: 'null'
        summary:
          oneOf:
            - type: object
              required: [stop_count, line_count, trip_count, stop_time_count]
              properties:
                stop_count: {type: integer}
                line_count: {type: integer}
                trip_count: {type: integer}
                stop_time_count: {type: integer}
            - type: 'null'
        validation_error: {type: [string, 'null']}
    GtfsScenarioResponse:
      type: object
      required: [info, scenario]
      properties:
        info:
          $ref: '#/components/schemas/GtfsScenarioInfo'
        scenario:
          $ref: '#/components/schemas/GtfsScenario'
    GtfsBuildRequest:
      type: object
      properties:
        load:
          type: boolean
          default: true
          description: Load the built feed into the service.
