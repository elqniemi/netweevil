          items:
            $ref: '#/components/schemas/RouteViolationType'
        geometry:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/Coordinate3'
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/AnalysisDiagnostic'
        error: {type: [string, 'null']}
        alternatives:
          type: array
