      properties:
        status:
          $ref: '#/components/schemas/BatchItemStatus'
        outcome:
          $ref: '#/components/schemas/AnalysisOutcome'
        fallback_used: {type: boolean}
        origin_component_id: {type: [integer, 'null']}
        destination_component_id: {type: [integer, 'null']}
        origin_hop_distance_m: {type: [number, 'null']}
        destination_hop_distance_m: {type: [number, 'null']}
        origin_snap_distance_m: {type: [number, 'null']}
        destination_snap_distance_m: {type: [number, 'null']}
        total_distance_m: {type: [integer, 'null']}
        total_travel_time_s: {type: [number, 'null']}
        total_generalized_cost: {type: [number, 'null']}
