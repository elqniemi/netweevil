openapi: 3.1.0
info:
  title: NetWeevil HTTP API
  version: 0.4.0-alpha
  summary: Local HTTP API for routing, network analysis, transit, traffic and simulation.
  description: |
    The NetWeevil API is a local HTTP service. It gives routing and network
    analysis on one imported street dataset. It also gives GTFS transit
    queries, live traffic, agent simulation and the workspace setup flow.

    Start the service with `netweevil api serve`. The default address is
    `http://127.0.0.1:8080`.

    ## Content types

    Request bodies are JSON. Send the header `Content-Type: application/json`.
    Most responses are JSON. Some analysis operations can also send GeoJSON.
    Tiles are binary (Mapbox Vector Tile or PNG).

    ## GeoJSON format switch

    Some operations accept the query parameter `format=geojson`. With this
    parameter, the response is a GeoJSON `FeatureCollection` with the content
    type `application/geo+json`. The service then also calculates the full
    geometry. Other values, or no value, give the JSON envelope.

    ## Analysis envelope

    Street analysis requests use one envelope:
    `{"profile_id": ..., "engine_mode": ..., "request": {...}}`.
    The `profile_id` is optional. When you do not send it, the service uses
    the default profile. Not all operations accept `engine_mode`.

    Analysis responses use one envelope: `{"service": {...}, "result": {...}}`.
    The `service` object identifies the dataset, the profile and the engine.

    ## Errors

    Errors from the service have the body `{"error": "...", "diagnostics": [...]}`.
    The `diagnostics` array is optional. It is only present for analysis
    failures that have structured causes.

    The HTTP framework rejects bodies that it cannot read before the service
    examines them. These rejections have a `text/plain` body:

    - `400` for JSON with a syntax error, or a bad path or query parameter.
    - `415` when the `Content-Type` header is not `application/json`.
    - `422` when the JSON has a wrong field type or a missing required field.

    ## Setup mode

    The service can start without a dataset. This is setup mode. In setup
    mode, the workspace operations work. Operations that need a dataset send
    `503 Service Unavailable`. Use `GET /readyz` to see the mode. Use
    `POST /v1/workspace/activate` to load a dataset.
  license:
    name: MIT OR Apache-2.0
    identifier: MIT OR Apache-2.0
security: []
servers:
  - url: /
    description: The service that sends this document.
  - url: http://127.0.0.1:8080
    description: Default local address of `netweevil api serve`.
tags:
  - name: Service
    description: Health, readiness, service information and loaded profiles.
  - name: Documentation
    description: This API description and its interactive viewer.
  - name: Routing
    description: Point-to-point routes, directions, waypoints, trips, trace matching and snapping.
  - name: Matrix and OD
    description: Origin-destination pairs and many-to-many matrices.
  - name: Service areas and accessibility
    description: Areas that a point can reach, and counts of reachable destinations.
  - name: Network analysis
    description: Edge betweenness and scenario batches that compare network changes.
  - name: Transit
    description: GTFS transit routes, transit directions, transit service areas and feed data.
  - name: Traffic
    description: Historical traffic status and live traffic updates.
  - name: Network and tiles
    description: Network edges with profile values, and network vector tiles.
  - name: Terrain and height
    description: Terrain tile sources, terrain tiles and height samples.
  - name: Simulation
    description: Agent-based traffic simulation runs.
  - name: Workspace
    description: Uploads, imports, profiles, jobs and the loaded selection.
  - name: GTFS editor
    description: GTFS scenarios that add lines and stops to a feed or make a new feed.

paths:
  /healthz:
    get:
      tags: [Service]
      operationId: getHealth
      summary: Examine if the process is alive
      description: |
        Sends `{"status": "ok"}` when the process can answer HTTP requests.
        This operation does not examine the dataset. It works in setup mode.
      responses:
        '200':
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok

  /readyz:
    get:
      tags: [Service]
      operationId: getReadiness
      summary: Examine if the service can run analyses
      description: |
        Sends `{"status": "ready"}` when a dataset is loaded.
        Sends `{"status": "setup"}` with status `503` in setup mode.
        Use this operation as a readiness probe.
      responses:
        '200':
          description: A dataset is loaded. Analyses can run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
              example:
                status: ready
        '503':
          description: The service is in setup mode. No dataset is loaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
              example:
                status: setup

  /v1/service:
    get:
      tags: [Service]
      operationId: getServiceInfo
      summary: Get the loaded dataset, profiles, feeds and capabilities
      description: |
        Sends the loaded dataset, the loaded profiles and the loaded transit
        feeds. The response also shows the capabilities and the default engine.
      responses:
        '200':
          description: The service information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceInfoResponse'
        '503':
          $ref: '#/components/responses/SetupMode'

  /v1/profiles:
    get:
      tags: [Service]
      operationId: listProfiles
      summary: List the loaded profiles
      description: Sends one entry for each compiled profile that the service has loaded.
      responses:
        '200':
          description: The loaded profiles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProfileInfo'
        '503':
          $ref: '#/components/responses/SetupMode'

  /v1/profiles/{profile_id}:
    get:
      tags: [Service]
      operationId: getProfile
      summary: Get one loaded profile
      description: Sends the information for one loaded profile.
      parameters:
        - $ref: '#/components/parameters/ProfileIdPath'
      responses:
        '200':
          description: The profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileInfo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/SetupMode'

  /openapi.yaml:
    get:
      tags: [Documentation]
      operationId: getOpenApi
      summary: Get this API description
      description: Sends this OpenAPI 3.1 document as YAML.
      responses:
        '200':
          description: The OpenAPI document.
          content:
            application/yaml:
              schema:
                type: string

  /docs:
    get:
      tags: [Documentation]
      operationId: getDocs
      summary: Open the interactive API reference
      description: |
        Sends an HTML page that shows this API description with Swagger UI.
        The page loads Swagger UI from a CDN. Thus the browser must have
        internet access.
      responses:
        '200':
          description: The HTML page.
          content:
            text/html:
              schema:
                type: string

  /v1/route:
    post:
      tags: [Routing]
      operationId: route
      summary: Calculate a route between two points
      description: |
        Calculates the route with the lowest generalized cost from an origin
        to a destination.

        You can send `profile` (a full profile document) or `profile_overrides`
        (a partial profile that changes the named profile). The service then
        compiles a request profile. It keeps the compiled profile in a cache.
        The headers `x-netweevil-profile-cache` and
        `x-netweevil-profile-prepare-ms` show the cache result.

        With loaded traffic data and a `departure_time`, the service uses
        traffic speeds. The `service.traffic` object then shows the traffic
        engine.
      parameters:
        - $ref: '#/components/parameters/Format'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteExecutionRequest'
            examples:
              basic:
                summary: Route with geometry and segment rows
                value:
                  request:
                    route_id: route_demo_001
                    origin: {id: origin_a, lon: 6.5665, lat: 53.2194}
                    destination: {id: destination_b, lon: 6.5716, lat: 53.2148}
                    snap: {max_distance_m: 500.0}
                    returns:
                      geometry: full
                      segment_rows: true
                      road_type_breakdown: [time_s, distance_m]
                      surface_breakdown: [time_s, distance_m]
              avoid:
                summary: Route that avoids a point and penalizes an area
                value:
                  profile_id: car_research_v1
                  request:
                    route_id: groningen_avoid_east
                    origin: {id: origin, lon: 6.5665, lat: 53.2194}
                    destination: {id: destination, lon: 6.5716, lat: 53.2148}
                    snap: {max_distance_m: 500.0}
                    returns: {geometry: full}
                    avoid:
                      points:
                        - {lon: 6.58006, lat: 53.21535, radius_m: 30.0}
                      polygons:
                        - rings: [[[6.5720, 53.2168], [6.5745, 53.2168], [6.5745, 53.2185], [6.5720, 53.2185]]]
                          penalty_factor: 4.0
              vehicle:
                summary: Van dimensions on a truck profile
                value:
                  profile_id: truck_hgv_v1
                  request:
                    route_id: groningen_van_on_truck_profile
                    origin: {id: origin, lon: 6.626958, lat: 53.380511}
                    destination: {id: destination, lon: 6.591494, lat: 53.335076}
                    snap: {max_distance_m: 500.0}
                    returns: {geometry: full}
                    vehicle: {height_m: 2.0, width_m: 2.0, length_m: 6.0, weight_t: 3.5, axle_load_t: 2.0, trailers: 0}
              profile_overrides:
                summary: Route with request profile overrides
                value:
                  profile_id: car_north_nl_2026_05
                  profile_overrides:
                    preferences: {use_highways: 0.2, use_tolls: 0.0}
                    turns: {left_penalty_s: 12.0}
                  request:
                    route_id: groningen_request_profile
                    origin: {id: origin, lon: 6.5665, lat: 53.2194}
                    destination: {id: destination, lon: 6.5716, lat: 53.2148}
                    snap: {max_distance_m: 500.0}
                    returns: {geometry: full, segment_rows: true}
              traffic:
                summary: Route at an evening peak departure time
                value:
                  profile_id: car_north_nl_2026_05
                  request:
                    route_id: groningen_evening_peak
                    origin: {id: station, lon: 6.5665, lat: 53.2194}
                    destination: {id: zernike, lon: 6.5303, lat: 53.2410}
                    departure_time: '2026-10-05T17:30:00+02:00'
                    returns: {geometry: full, segment_rows: true}
      responses:
        '200':
          description: The route.
          headers:
            x-netweevil-profile-cache:
              description: Only with `profile` or `profile_overrides`. The value is `hit` or `miss`.
              schema:
                type: string
            x-netweevil-profile-prepare-ms:
              description: Only with `profile` or `profile_overrides`. Time to prepare the request profile, in milliseconds.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteResponse'
            application/geo+json:
              schema:
                $ref: '#/components/schemas/RouteGeoJson'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableBody'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/SetupMode'

  /v1/directions:
    post:
      tags: [Routing]
      operationId: directions
      summary: Calculate a route with turn-by-turn instructions
      description: |
        Calculates a route as `/v1/route` does. The response also contains
        maneuvers with written and spoken instructions, signs and lanes.

        Use `directions_options` to set the language, the units and the
        driving side. `GET /v1/service` lists the languages in
        `capabilities.directions_languages`. An unknown language gives
        English and a warning.

        This operation does not use loaded traffic data.
      parameters:
        - $ref: '#/components/parameters/Format'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DirectionsExecutionRequest'
            example:
              request:
                route_id: groningen_directions
                origin: {id: start, lon: 6.5665, lat: 53.2194}
                destination: {id: finish, lon: 6.5716, lat: 53.2148}
                snap: {max_distance_m: 500.0}
              directions_options: {language: nl, units: metric}
      responses:
        '200':
          description: |
            The route and its maneuvers. The GeoJSON variant adds the
            top-level members `maneuvers`, `language`, `units` and
            `driving_side` to the route `FeatureCollection`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectionsResponse'
            application/geo+json:
              schema:
                $ref: '#/components/schemas/DirectionsGeoJson'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableBody'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/SetupMode'

  /v1/waypoints:
    post:
      tags: [Routing]
      operationId: waypoints
      summary: Calculate a route through a sequence of waypoints
      description: |
        Calculates one route through two or more waypoints. A `break`
        waypoint starts a new leg. A `through` waypoint does not split a leg.

        With `optimize_order: true`, the service changes the order of the
        intermediate waypoints to decrease the total cost. The first and the
        last waypoints stay fixed.
      parameters:
        - $ref: '#/components/parameters/Format'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WaypointsExecutionRequest'
            example:
              profile_id: car_north_nl_2026_05
              request:
                route_id: groningen_waypoints
                waypoints:
                  - point: {id: start, lon: 6.5665, lat: 53.2194}
                  - point: {id: visit, lon: 6.5716, lat: 53.2148}
                    kind: break
                  - point: {id: end, lon: 6.5840, lat: 53.2190}
                snap: {max_distance_m: 500.0}
                optimize_order: false
                returns: {geometry: full}
      responses:
        '200':
          description: |
            The route legs. The GeoJSON variant has one route feature for each
            leg, with the property `leg_index`. It also has the top-level
            members `service`, `route_id`, `waypoint_order`,
            `optimization_method`, `total_distance_m`, `total_travel_time_s`
            and `total_generalized_cost`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaypointsResponse'
            application/geo+json:
              schema:
                $ref: '#/components/schemas/GeoJsonFeatureCollection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableBody'
        '503':
          $ref: '#/components/responses/SetupMode'

  /v1/trip:
    post:
      tags: [Routing]
      operationId: trip
      summary: Find the best order to visit a set of stops
      description: |
        Finds a visit order for a set of stops and calculates the route legs.
        The order can obey time windows and service times at the stops.
        The `mode` sets which stops are fixed at the start and at the end.

        Small problems get an exact solution. Large problems use a local
        search. The `result.optimization` object shows the method.
      parameters:
        - $ref: '#/components/parameters/Format'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripExecutionRequest'
            example:
              request:
                trip_id: groningen_deliveries
                mode: roundtrip
                departure_s: 28800
                snap: {max_distance_m: 500.0}
                stops:
                  - point: {id: depot, lon: 6.5665, lat: 53.2194}
                    service_s: 600
                  - point: {id: zernike, lon: 6.5303, lat: 53.2410}
                    service_s: 300
                  - point: {id: station, lon: 6.5641, lat: 53.2108}
                    service_s: 300
                    time_window: {earliest_s: 30600, latest_s: 32400}
                  - point: {id: beijum, lon: 6.6080, lat: 53.2435}
                    service_s: 300
                returns: {geometry: none}
                optimizer: {seed: 0}
      responses:
        '200':
          description: |
            The trip. The GeoJSON variant has one route feature for each leg
            (property `leg_index`) and one `Point` feature for each visit
            (property `kind: trip_stop`). It also has the top-level members
            `service`, `trip_id`, `mode`, `stop_order`, `total_distance_m`,
            `total_travel_time_s`, `total_generalized_cost`,
            `time_windows_met` and `optimization`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripResponse'
            application/geo+json:
              schema:
                $ref: '#/components/schemas/GeoJsonFeatureCollection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableBody'
        '503':
          $ref: '#/components/responses/SetupMode'

  /v1/match:
    post:
      tags: [Routing]
      operationId: matchTrace
      summary: Match a GPS trace to the road network
      description: |
        Matches a sequence of GPS observations to the most probable path on
        the network. The service uses a hidden Markov model with legal network
        distances.

        The result can have more than one matching. A gap starts a new
        matching. A gap occurs when an observation has no candidates, when
        the time gap is too long, or when no legal transition exists.
      parameters:
        - $ref: '#/components/parameters/Format'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TraceMatchExecutionRequest'
            example:
              profile_id: car_north_nl_2026_05
              request:
                trace_id: groningen_trace
                observations:
                  - point: {id: gps_0, lon: 6.5668038, lat: 53.2195332}
                    timestamp_s: 0
                  - point: {id: gps_1, lon: 6.5732778, lat: 53.21744}
                    timestamp_s: 30
                  - point: {id: gps_2, lon: 6.5802015, lat: 53.2152832}
                    timestamp_s: 60
                snap: {max_distance_m: 50}
                gps_accuracy_m: 10
                max_transition_distance_m: 2000
      responses:
        '200':
          description: |
            The matched trace. The GeoJSON variant has one feature for each
            matching. It also has the top-level members `service`, `trace_id`,
            `tracepoints`, `gaps` and `confidence_method`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TraceMatchResponse'
            application/geo+json:
              schema:
                $ref: '#/components/schemas/GeoJsonFeatureCollection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableBody'
        '503':
          $ref: '#/components/responses/SetupMode'

  /v1/locate:
    post:
      tags: [Routing]
      operationId: locate
      summary: Show where points attach to the network
      description: |
        For each point, sends the snap candidates that a route would use. It
        also sends the nearest road segments and the profile values of their
        edges. Use this operation to find why a point does not snap.

        A point that does not snap gets an empty `candidates` list. This is
        not an error.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocateExecutionRequest'
            example:
              profile_id: car_north_nl_2026_05
              request:
                points:
                  - {id: groningen, lon: 6.5665, lat: 53.2194}
                direction: origin
                count: 3
                snap: {max_distance_m: 500.0}
      responses:
        '200':
          description: One entry for each requested point, in request order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableBody'
        '503':
          $ref: '#/components/responses/SetupMode'

  /v1/expansion:
    post:
      tags: [Routing]
      operationId: expansion
      summary: Show the edges that a search settles
      description: |
        Runs one search and records each settled edge in order. Use this
        operation to see how a route search, a service area search or a
        contraction hierarchy query moves across the network.

        The response is a GeoJSON `FeatureCollection` with the content type
        `application/json`. Each feature is one settled edge.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpansionExecutionRequest'
            example:
              profile_id: car_research_v1
              request:
                action: route
                origin: {id: origin, lon: 6.5665, lat: 53.2194}
                destination: {id: destination, lon: 6.6, lat: 53.24}
                max_edges: 100000
      responses:
        '200':
          description: The settled edges.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpansionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableBody'
        '503':
          $ref: '#/components/responses/SetupMode'

  /v1/od:
    post:
      tags: [Matrix and OD]
      operationId: originDestination
      summary: Calculate routes for a list of origin-destination pairs
      description: |
        Calculates one route for each pair. Each pair has its own status. A
        failed pair does not stop the other pairs.

        With loaded traffic data and a `departure_time`, the service uses
        traffic speeds.
      parameters:
        - $ref: '#/components/parameters/Format'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OdExecutionRequest'
            example:
              request:
                pairs:
                  - pair_id: idf_pair_1
                    origin: {id: gare_du_nord, lon: 2.3553, lat: 48.8809}
                    destination: {id: orsay, lon: 2.3255, lat: 48.8600}
                  - pair_id: idf_pair_2
                    origin: {id: versailles_chateau, lon: 2.1204, lat: 48.8049}
                    destination: {id: orly_airport_area, lon: 2.3790, lat: 48.7283}
                snap: {max_distance_m: 500.0}
                returns: {geometry: full}
      responses:
        '200':
          description: |
            The pair results. The GeoJSON variant has one `LineString`
            feature for each pair and each alternative, and a `metadata`
            object with the counts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OdResponse'
            application/geo+json:
              schema:
                $ref: '#/components/schemas/GeoJsonFeatureCollection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableBody'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/SetupMode'

  /v1/matrix:
    post:
      tags: [Matrix and OD]
      operationId: matrix
      summary: Calculate a many-to-many matrix
      description: |
        Calculates one cell for each origin and each destination. Each cell
        has its own status. The service uses the time options of the origins.
        When the origins have no time options, it uses the time options of the
        destinations.
      parameters:
        - $ref: '#/components/parameters/Format'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatrixExecutionRequest'
            example:
              request:
                origins:
                  points:
                    - {id: la_defense, lon: 2.2369, lat: 48.8919}
                    - {id: nation, lon: 2.3950, lat: 48.8483}
                  snap: {max_distance_m: 500.0}
                destinations:
                  points:
                    - {id: chatelet, lon: 2.3470, lat: 48.8580}
                    - {id: orly_airport_area, lon: 2.3790, lat: 48.7283}
                  snap: {max_distance_m: 500.0}
      responses:
        '200':
          description: |
            The matrix cells. The GeoJSON variant has one `LineString` feature
            for each cell and each alternative, and a `metadata` object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatrixResponse'
            application/geo+json:
              schema:
                $ref: '#/components/schemas/GeoJsonFeatureCollection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableBody'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/SetupMode'

  /v1/service-area:
    post:
      tags: [Service areas and accessibility]
      operationId: serviceArea
      summary: Calculate the area that origins can reach
      description: |
        Calculates the network and the polygons that the origins can reach
        within each threshold. A threshold is a time or a distance limit.

        With `direction: inbound`, the area contains the positions that can
        reach the origins. The `output_mode`, `band_mode`, `boundary_mode`
        and `multi_origin_mode` fields control the shape of the result.
      parameters:
        - $ref: '#/components/parameters/Format'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceAreaExecutionRequest'
            example:
              request:
                analysis_id: groningen_service_area_demo
                origins:
                  - {id: origin_a, lon: 6.5665, lat: 53.2194}
                thresholds:
                  - {id: five_minutes, limit: 300.0, metric: travel_time_s}
                  - {id: ten_minutes, limit: 600.0, metric: travel_time_s}
                snap: {max_distance_m: 500.0}
                output_mode: both
                band_mode: cumulative
                polygon: {hull_aggressiveness: 1.0, simplification_tolerance_m: 20.0}
      responses:
        '200':
          description: |
            The service area. The GeoJSON variant has one feature for each
            area feature, and a `metadata` object with the counts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAreaResponse'
            application/geo+json:
              schema:
                $ref: '#/components/schemas/GeoJsonFeatureCollection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableBody'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/SetupMode'

  /v1/service-area-sequence:
    post:
      tags: [Service areas and accessibility]
      operationId: serviceAreaSequence
      summary: Calculate a service area at a sequence of departure times
      description: |
        Runs one service area request at each departure time. Send the times
        in `departure_times`. Alternatively, send `start_time`, `end_time`
        and `step_s`. Each result is one frame.
      parameters:
        - $ref: '#/components/parameters/Format'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceAreaSequenceExecutionRequest'
            example:
              request:
                sequence_id: groningen_morning
                start_time: '2026-07-10T07:00:00+02:00'
                end_time: '2026-07-10T09:00:00+02:00'
                step_s: 1800
                request:
                  analysis_id: groningen_morning_frame
                  origins:
                    - {id: origin_a, lon: 6.5665, lat: 53.2194}
                  thresholds:
                    - {id: ten_minutes, limit: 600.0, metric: travel_time_s}
      responses:
        '200':
          description: |
            The frames. The GeoJSON variant has the features of all frames.
            Each feature has the properties `sequence_id`, `frame_index` and
            `departure_time`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAreaSequenceResponse'
            application/geo+json:
              schema:
                $ref: '#/components/schemas/GeoJsonFeatureCollection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableBody'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/SetupMode'

  /v1/accessibility:
    post:
      tags: [Service areas and accessibility]
      operationId: accessibility
      summary: Count the destinations that each origin can reach
      description: |
        For each origin and each destination category, finds the nearest
        destination. It also counts the destinations within each time
        threshold. This operation sends JSON only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessibilityExecutionRequest'
            example:
              request:
                origins:
                  points:
                    - {id: home_a, lon: 6.5665, lat: 53.2194}
                categories:
                  - category_id: schools
                    destinations:
                      points:
                        - {id: school_1, lon: 6.5716, lat: 53.2148}
                        - {id: school_2, lon: 6.5303, lat: 53.2410}
                thresholds_s: [300, 600, 900]
                max_travel_time_s: 1800
      responses:
        '200':
          description: One row for each origin and category.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessibilityResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableBody'
        '503':
          $ref: '#/components/responses/SetupMode'

  /v1/betweenness:
    post:
      tags: [Network analysis]
      operationId: betweenness
      summary: Calculate weighted edge betweenness
      description: |
        Routes the demand between each weighted origin and each weighted
        destination. Then it gives each edge a score. The score is the demand
        that uses the edge. Use this operation to find critical edges.
      parameters:
        - $ref: '#/components/parameters/Format'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BetweennessExecutionRequest'
            example:
              request:
                analysis_id: hk_example_vertical_criticality
                origins:
                  - {id: hillside_demand_a, lon: 114.1517, lat: 22.2839, z: 34.0, weight: 120.0}
                  - {id: hillside_demand_b, lon: 114.1530, lat: 22.2846, z: 42.0, weight: 80.0}
                destinations:
                  - {id: station_entrance, lon: 114.1577, lat: 22.2820, z: 3.0, weight: 1.0}
                snap: {max_distance_m: 300.0, z_window_m: 5.0}
                departure_time: '2026-07-10T09:55:00+08:00'
                max_od_pairs: 10000
                include_zero: false
      responses:
        '200':
          description: |
            The edge scores. The GeoJSON variant has one `LineString` feature
            for each scored edge.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BetweennessResponse'
            application/geo+json:
              schema:
                $ref: '#/components/schemas/GeoJsonFeatureCollection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableBody'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/SetupMode'

  /v1/scenario-batch:
    post:
      tags: [Network analysis]
      operationId: scenarioBatch
      summary: Compare analyses with and without network scenarios
      description: |
        Runs a set of analyses once without a scenario (the baseline). Then it
        runs the same analyses once for each scenario. Each scenario result
        has a `diff` object that compares it with the baseline.

        A scenario has exactly one source: an `overlay`, a `top_k` selector or
        a `group` selector.
      parameters:
        - $ref: '#/components/parameters/Format'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScenarioBatchExecutionRequest'
            example:
              request:
                batch_id: groningen_closures
                departure_time: '2026-07-10T08:00:00+02:00'
                scenarios:
                  - id: close_bridge
                    overlay:
                      id: close_bridge
                      features:
                        - {source_feature_id: 4463602, force_closed: true}
                  - id: top_two
                    top_k:
                      ranking:
                        - {source_feature_id: 4463602, score: 10.0}
                        - {source_feature_id: 6348846, score: 7.5}
                      count: 2
                routes:
                  - route_id: station_to_zernike
                    origin: {id: station, lon: 6.5665, lat: 53.2194}
                    destination: {id: zernike, lon: 6.5303, lat: 53.2410}
      responses:
        '200':
          description: |
            The baseline and the scenario results. The GeoJSON variant has the
            features of all analyses. Each feature has the properties
            `analysis_kind`, `analysis_id` and `scenario_id`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioBatchResponse'
            application/geo+json:
              schema:
                $ref: '#/components/schemas/GeoJsonFeatureCollection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableBody'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/SetupMode'

  /v1/transit-route:
    post:
      tags: [Transit]
      operationId: transitRoute
      summary: Calculate a scheduled transit journey
      description: |
        Calculates a journey on a loaded GTFS feed. The journey has access,
        transit, transfer and egress legs. Times in the result are seconds
        from `result.time_context.time_origin_unix_s`.

        With `returns.walking_geometry: network` or
        `modes.street_access: network`, the service uses street profiles for
        the street legs. A foot profile must be loaded. Use
        `pedestrian_profile_id`, `access_profile_id` and `egress_profile_id`
        to select the profiles.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitRouteExecutionRequest'
            example:
              feed_id: openov_nl_2026_05
              request:
                route_id: openov_groningen_pt_1
                origin: {id: groningen_centrum, lon: 6.5665, lat: 53.2194}
                destination: {id: zernike_campus, lon: 6.5337, lat: 53.2406}
                time:
                  datetime: '2026-05-11T08:30:00+02:00'
                  arrive_by: false
                  search_window_s: 7200
                modes:
                  access: [walk]
                  egress: [walk]
                  transit: [bus, tram, rail]
                  max_access_distance_m: 1200.0
                  max_egress_distance_m: 1200.0
                  max_transfers: 3
                returns:
                  include_geometry: true
                  walking_geometry: straight_line
                  include_stops: true
                  include_stop_segments: true
      responses:
        '200':
          description: The journey.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransitRouteResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableBody'
        '503':
          $ref: '#/components/responses/SetupMode'

  /v1/transit-directions:
    post:
      tags: [Transit]
      operationId: transitDirections
      summary: Calculate a transit journey with step instructions
      description: |
        Calculates a journey as `/v1/transit-route` does. The response also
        contains a list of steps with written instructions: wait, board,
        ride, alight, access, transfer and egress. Street legs with a network
        path also contain walking maneuvers.

        The service always includes geometry, stops and stop segments for
        this operation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitDirectionsExecutionRequest'
            example:
              feed_id: openov_nl_2026_05
              request:
                route_id: openov_groningen_pt_1
                origin: {id: groningen_centrum, lon: 6.5665, lat: 53.2194}
                destination: {id: zernike_campus, lon: 6.5337, lat: 53.2406}
                time: {datetime: '2026-05-11T08:30:00+02:00'}
              directions_options: {language: en}
      responses:
        '200':
          description: The journey and its steps.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransitDirectionsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableBody'
        '503':
          $ref: '#/components/responses/SetupMode'

  /v1/transit-service-area:
    post:
      tags: [Transit]
      operationId: transitServiceArea
      summary: Calculate the stops and the area that transit can reach
      description: |
        Finds the stops that the origins can reach within `max_travel_time_s`
        on transit. With `catchment_mode: street_isochrone`, the service also
        continues on the street network after the transit legs. It then sends
        isochrone features.
      parameters:
        - $ref: '#/components/parameters/Format'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitServiceAreaExecutionRequest'
            example:
              feed_id: openov_nl_2026_05
              request:
                analysis_id: groningen_transit_isochrone
                catchment_mode: street_isochrone
                origins:
                  - {id: groningen_station, lon: 6.5654, lat: 53.2106}
                time:
                  datetime: '2026-05-11T08:30:00+02:00'
                  search_window_s: 3600
                modes:
                  access: [walk]
                  egress: [walk]
                  street_access: network
                  max_access_distance_m: 1200
                  max_transfers: 3
                max_travel_time_s: 1800
                returns: {include_stops: true, include_stop_segments: true, include_geometry: true}
      responses:
        '200':
          description: |
            The reachable stops, the stop segments and the isochrones. The
            GeoJSON variant has isochrone features, `Point` features for
            stops (`geometry_type: stop`) and `LineString` features for stop
            segments (`geometry_type: stop_segment`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransitServiceAreaResponse'
            application/geo+json:
              schema:
                $ref: '#/components/schemas/GeoJsonFeatureCollection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableBody'
        '503':
          $ref: '#/components/responses/SetupMode'

  /v1/transit-feeds/{feed_id}/station-geometry:
    post:
      tags: [Transit]
      operationId: transitStationGeometry
      summary: Get station surfaces and boarding points in a bounding box
      description: |
        Sends reference features for a loaded feed. The features are platform
        surfaces from an optional file next to the GTFS file
        (`<name>.stations.geojson`), and the boarding points of stops with a
        graph binding. These features are for display. They are not routes.
      parameters:
        - $ref: '#/components/parameters/FeedIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StationGeometryRequest'
            example:
              bbox: [114.1, 22.2, 114.3, 22.4]
              limit: 2000
      responses:
        '200':
          description: The features that intersect the bounding box.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StationGeometryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableBody'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/SetupMode'

  /v1/transit-feeds/{feed_id}/bindings:
    get:
      tags: [Transit]
      operationId: transitBindings
      summary: Audit the graph bindings of transit stops
      description: |
        Examines each stop that has an explicit graph binding. For each stop,
        the service finds the departure and the arrival candidates on a foot
        profile. A stop without candidates in one direction gets a diagnostic.
        The response is a GeoJSON `FeatureCollection` with the content type
        `application/json`.
      parameters:
        - $ref: '#/components/parameters/FeedIdPath'
        - name: pedestrian_profile_id
          in: query
          description: Foot profile to use. The default is the first loaded foot profile.
          schema:
            type: string
        - name: stop_id
          in: query
          description: Examine only this stop.
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum number of stops to examine. The service clamps the value to 1 through 10000.
          schema:
            type: integer
            minimum: 0
            default: 1000
      responses:
        '200':
          description: One `Point` feature for each examined stop.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransitBindingsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/SetupMode'

  /v1/transit-feeds/{feed_id}/stops:
    get:
      tags: [Transit]
      operationId: listFeedStops
      summary: List the stops of a loaded feed
      description: |
        Sends the stops of a loaded feed. You can filter by a bounding box and
        by a text in the stop name or the stop id.
      parameters:
        - $ref: '#/components/parameters/FeedIdPath'
        - name: bbox
          in: query
          description: Bounding box as `west,south,east,north` in WGS84 degrees.
          schema:
            type: string
          example: 6.50,53.19,6.62,53.25
        - name: q
          in: query
          description: Text that the stop name or the stop id must contain. The match ignores case.
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum number of stops to send.
          schema:
            type: integer
            minimum: 0
            default: 4000
      responses:
        '200':
          description: The stops.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedStopsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/SetupMode'

  /v1/transit-feeds/{feed_id}/routes:
    get:
      tags: [Transit]
      operationId: listFeedRoutes
      summary: List the routes of a loaded feed
      description: Sends the GTFS routes of a loaded feed. You can filter by a text.
      parameters:
        - $ref: '#/components/parameters/FeedIdPath'
        - name: q
          in: query
          description: Text that the route names or the route id must contain. The match ignores case.
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum number of routes to send.
          schema:
            type: integer
            minimum: 0
            default: 500
      responses:
        '200':
          description: The routes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FeedRoute'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/SetupMode'

  /v1/transit-feeds/{feed_id}/patterns:
    get:
      tags: [Transit]
      operationId: listFeedRoutePatterns
      summary: List the stop patterns of a route
      description: |
        Sends the distinct stop sequences of one GTFS route. Each pattern has
        the number of vehicle runs that use it, and the typical time offsets
        at each stop.
      parameters:
        - $ref: '#/components/parameters/FeedIdPath'
        - name: route_id
          in: query
          required: true
          description: GTFS route id.
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum number of patterns to send.
          schema:
            type: integer
            minimum: 0
            default: 12
      responses:
        '200':
          description: The patterns.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TransitRoutePattern'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/SetupMode'

  /v1/traffic:
    get:
      tags: [Traffic]
      operationId: getTrafficStatus
      summary: Get the traffic status
      description: |
        Shows if traffic data is active. When it is active, the response also
        shows the historical traffic set, the current time bucket, the live
        entries and the last live update.
      responses:
        '200':
          description: The traffic status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrafficStatusResponse'
        '503':
          $ref: '#/components/responses/SetupMode'

  /v1/traffic/live:
    post:
      tags: [Traffic]
      operationId: postLiveTraffic
      summary: Send live traffic updates
      description: |
        Validates a batch of live updates. Then the service applies the batch
        in the background. Each update sets a speed, closes a feature, or
        clears the live state of a feature. An update expires at `expires_at`
        or after `ttl_s` seconds (default 900).

        Without `wait`, the service sends `202` at once. With `wait=true`, the
        service sends `200` after it publishes the new engines.
      parameters:
        - $ref: '#/components/parameters/TrafficWait'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LiveTrafficRequest'
            example:
              updates:
                - {way_id: 4463602, direction: forward, speed_kph: 25, ttl_s: 1800}
                - {feature_id: 6348846, closed: true, ttl_s: 3600}
      responses:
        '200':
          description: The batch is published (only with `wait=true`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveSwapReport'
        '202':
          description: The batch is accepted. The service applies it in the background.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveTrafficAccepted'
              example:
                accepted: 2
                replace: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableBody'
        '503':
          $ref: '#/components/responses/SetupMode'
    delete:
      tags: [Traffic]
      operationId: deleteLiveTraffic
      summary: Remove all live traffic entries
      description: |
        Removes every live entry. The historical traffic data stays. Without
        `wait`, the service sends `202` at once.
      parameters:
        - $ref: '#/components/parameters/TrafficWait'
      responses:
        '200':
          description: The empty live state is published (only with `wait=true`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveSwapReport'
        '202':
          description: The request is accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveTrafficAccepted'
              example:
                accepted: 0
                replace: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/SetupMode'

  /v1/network/edges:
    post:
      tags: [Network and tiles]
      operationId: networkEdges
      summary: Get the network edges in a bounding box with profile values
      description: |
        Sends the edges in a bounding box as GeoJSON features with the content
        type `application/json`. Each feature has the edge attributes and the
        values of the profile (allowed, speed, time and cost).

        With `compare_profile_id`, each feature also has the values of a
        second profile and the differences.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NetworkEdgesRequest'
            example:
              bbox: [6.55, 53.21, 6.58, 53.23]
              profile_id: car_research_v1
              compare_profile_id: cycling_north_nl_2026_05
              max_edges: 5000
      responses:
        '200':
          description: The edges.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkEdgesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableBody'
        '503':
          $ref: '#/components/responses/SetupMode'

  /v1/tiles/{z}/{x}/{tile}:
    get:
      tags: [Network and tiles]
      operationId: networkTile
      summary: Get a network vector tile
      description: |
        Sends one Mapbox Vector Tile with the layer `network`. The layer
        contains the edges that the profile can use. Low zoom levels contain
        only the major road classes.

        The header `x-netweevil-truncated` is `true` when the tile has more
        than 100000 features and the service removed some.
      parameters:
        - name: z
          in: path
          required: true
          description: Zoom level, 0 through 22.
          schema:
            type: integer
            minimum: 0
            maximum: 22
        - name: x
          in: path
          required: true
          description: Tile column.
          schema:
            type: integer
            minimum: 0
        - name: tile
          in: path
          required: true
          description: Tile row with the extension, as `{y}.mvt`.
          schema:
            type: string
            pattern: '^[0-9]+\.mvt$'
          example: 8421.mvt
        - name: profile_id
          in: query
          description: Profile to use. The default is the default profile.
          schema:
            type: string
      responses:
        '200':
          description: The tile.
          headers:
            ETag:
              description: Changes when the compiled profile changes.
              schema:
                type: string
            x-netweevil-truncated:
              description: '`true` when the service removed features above the limit.'
              schema:
                type: string
                enum: ['true', 'false']
          content:
            application/vnd.mapbox-vector-tile:
              schema:
                type: string
                contentEncoding: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/SetupMode'

  /v1/terrain-sources:
    get:
      tags: [Terrain and height]
      operationId: listTerrainSources
      summary: List the terrain tile sources
      description: |
        Sends the terrain sources under `.netweevil/terrain/`. Each source has
        a tile URL template on this service. A source with a bad manifest
        gives a diagnostic. This operation works in setup mode.
      responses:
        '200':
          description: The terrain sources.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TerrainSourcesResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/terrain/{source}/{version}/{z}/{x}/{tile}:
    get:
      tags: [Terrain and height]
      operationId: terrainTile
      summary: Get a terrain PNG tile
      description: |
        Sends one terrain tile as PNG. The encoding is `terrarium` or
        `mapbox`, as the source shows. Tiles of a version do not change.
        Thus the response has a long cache time and an ETag. Send
        `If-None-Match` to get `304` when the tile is in your cache.
        This operation works in setup mode.
      parameters:
        - name: source
          in: path
          required: true
          description: Terrain source id. Letters, digits, `_` and `-`.
          schema:
            type: string
            pattern: '^[A-Za-z0-9_-]+$'
        - name: version
          in: path
          required: true
          description: Source version. 16 to 64 lowercase hexadecimal characters.
          schema:
            type: string
            pattern: '^[0-9a-f]{16,64}$'
        - name: z
          in: path
          required: true
          description: Zoom level, 0 through 24.
          schema:
            type: integer
            minimum: 0
            maximum: 24
        - name: x
          in: path
          required: true
          description: Tile column.
          schema:
            type: integer
            minimum: 0
        - name: tile
          in: path
          required: true
          description: Tile row with the extension, as `{y}.png`.
          schema:
            type: string
            pattern: '^[0-9]+\.png$'
        - name: If-None-Match
          in: header
          description: ETag of a tile in your cache.
          schema:
            type: string
      responses:
        '200':
          description: The tile.
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
              example: public, max-age=31536000, immutable
          content:
            image/png:
              schema:
                type: string
                contentEncoding: binary
        '304':
          description: The tile in your cache is current.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/height:
    post:
      tags: [Terrain and height]
      operationId: height
      summary: Sample the elevation raster at points or along a line
      description: |
        Samples the dataset elevation raster. Send `points` or an
        `encoded_polyline`. With `range: true`, the result also has the
        distance along the line for each height. With `resample_distance_m`,
        the service first makes new points at that interval.

        The dataset must have an elevation raster. Import the dataset with a
        DEM to add one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HeightRequest'
            example:
              points:
                - [114.1455, 22.2759]
                - [114.1580, 22.2820]
                - [114.1699, 22.2793]
              range: true
              resample_distance_m: 100
      responses:
        '200':
          description: The heights.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeightResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableBody'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/SetupMode'

  /v1/simulation:
    get:
      tags: [Simulation]
      operationId: listSimulations
      summary: List the simulations
      description: Sends the simulations in this process, sorted by simulation id. The list does not include summaries.
      responses:
        '200':
          description: The simulations.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SimulationInfo'
    post:
      tags: [Simulation]
      operationId: createSimulation
      summary: Start a simulation
      description: |
        Validates a scenario and starts a simulation run in the background.
        Each fleet must use a loaded profile. Use the simulation id to follow
        the run.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulationCreateRequest'
            example:
              scenario:
                scenario: {id: groningen_rush_hour_demo, label: Morning rush demo, seed: 42}
                time: {duration_s: 1800.0, tick_s: 1.0, stop_when_all_arrived: true}
                fleets:
                  - fleet_id: commuter_cars
                    profile_id: car_research_v1
                    agent_count: 600
                    demand:
                      origins: {kind: random_bounds}
                      destinations:
                        kind: points
                        points:
                          - {lon: 6.5665, lat: 53.2194, weight: 2.0, label: center}
                          - {lon: 6.5716, lat: 53.2148, weight: 1.0, label: station}
                    departures: {kind: peak, mean_s: 300.0, std_s: 180.0}
                zones:
                  - zone_id: centre_slow
                    label: City centre slow zone
                    polygon: [[6.560, 53.215], [6.575, 53.215], [6.575, 53.222], [6.560, 53.222]]
                    effect: {kind: speed_factor, factor: 0.6}
      responses:
        '200':
          description: The simulation started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationCreateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableBody'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/SetupMode'

  /v1/simulation/{simulation_id}:
    get:
      tags: [Simulation]
      operationId: getSimulation
      summary: Get the status of a simulation
      description: Sends the status of a simulation. After the run completes, the response also has a summary.
      parameters:
        - $ref: '#/components/parameters/SimulationIdPath'
      responses:
        '200':
          description: The simulation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationInfo'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Simulation]
      operationId: deleteSimulation
      summary: Cancel and remove a simulation
      description: Cancels the run if it is active. Then the service removes the simulation and its data.
      parameters:
        - $ref: '#/components/parameters/SimulationIdPath'
      responses:
        '200':
          description: The simulation is removed.
          content:
            application/json:
              schema:
                type: object
                required: [simulation_id, removed]
                properties:
                  simulation_id:
                    type: string
                  removed:
                    type: boolean
                    const: true
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/simulation/{simulation_id}/control:
    post:
      tags: [Simulation]
      operationId: controlSimulation
      summary: Send a command to a running simulation
      description: |
        Pauses, resumes or cancels a run. Other commands change the global
        speed, add or remove a zone, or add a fleet. A completed run accepts
        only `cancel`.
      parameters:
        - $ref: '#/components/parameters/SimulationIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulationCommand'
            examples:
              pause:
                value: {command: pause}
              speed:
                value: {command: set_global_speed_factor, factor: 0.8}
              zone:
                value:
                  command: add_zone
                  zone:
                    zone_id: bridge_closed
                    polygon: [[6.57, 53.21], [6.58, 53.21], [6.58, 53.22], [6.57, 53.22]]
                    effect: {kind: no_access, modes: [car]}
      responses:
        '200':
          description: The simulation after the command.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationInfo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableBody'

  /v1/simulation/{simulation_id}/frames:
    get:
      tags: [Simulation]
      operationId: getSimulationFrames
      summary: Get agent position frames
      description: |
        Sends the stored agent positions in a time range. The default format
        is columnar JSON. With `format=geojson`, the service sends only the
        last frame in the range, as GeoJSON points.
      parameters:
        - $ref: '#/components/parameters/SimulationIdPath'
        - $ref: '#/components/parameters/SimStartS'
        - $ref: '#/components/parameters/SimEndS'
        - name: max_agents
          in: query
          description: Maximum agents in each frame. The service keeps an even sample.
          schema:
            type: integer
            minimum: 0
        - name: format
          in: query
          description: '`json` (columnar) or `geojson` (last frame only). This value is case sensitive.'
          schema:
            type: string
            enum: [json, geojson]
            default: json
      responses:
        '200':
          description: The frames.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationFramesResponse'
            application/geo+json:
              schema:
                $ref: '#/components/schemas/GeoJsonFeatureCollection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/simulation/{simulation_id}/edges:
    get:
      tags: [Simulation]
      operationId: getSimulationEdges
      summary: Get edge congestion statistics
      description: |
        Sends edge statistics as GeoJSON. With `mode=bins` (the default), the
        service sends the time bins in the range. With `mode=summary`, the
        service sends the usage of the whole run. The summary is available
        only after the run completes.
      parameters:
        - $ref: '#/components/parameters/SimulationIdPath'
        - $ref: '#/components/parameters/SimStartS'
        - $ref: '#/components/parameters/SimEndS'
        - name: min_occupancy
          in: query
          description: Bins mode. Skip edges with a lower mean occupancy, in passenger car units.
          schema:
            type: number
            default: 0
        - name: mode
          in: query
          description: '`bins` or `summary`.'
          schema:
            type: string
            enum: [bins, summary]
            default: bins
        - name: min_traversals
          in: query
          description: Summary mode. Skip edges with fewer traversals.
          schema:
            type: integer
            minimum: 0
            default: 1
      responses:
        '200':
          description: The edge statistics.
          content:
            application/geo+json:
              schema:
                $ref: '#/components/schemas/GeoJsonFeatureCollection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/simulation/{simulation_id}/temporal:
    get:
      tags: [Simulation]
      operationId: getSimulationTemporal
      summary: Get agent positions as time-stamped GeoJSON
      description: |
        Sends the frames in a time range as GeoJSON points with a datetime
        property. Use this output with a temporal map layer.
      parameters:
        - $ref: '#/components/parameters/SimulationIdPath'
        - $ref: '#/components/parameters/SimStartS'
        - $ref: '#/components/parameters/SimEndS'
        - name: max_agents
          in: query
          description: Maximum agents in each frame. The service keeps an even sample.
          schema:
            type: integer
            minimum: 0
        - name: base_datetime
          in: query
          description: Datetime of simulation time zero, as ISO 8601 without an offset.
          schema:
            type: string
            default: '2026-01-01T00:00:00'
      responses:
        '200':
          description: The time-stamped positions.
          content:
            application/geo+json:
              schema:
                $ref: '#/components/schemas/GeoJsonFeatureCollection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/simulation/{simulation_id}/agents/{agent_id}:
    get:
      tags: [Simulation]
      operationId: getSimulationAgent
      summary: Get the trajectory of one agent
      description: |
        Sends the trajectory of one agent as GeoJSON with the content type
        `application/json`. The trajectory is available only after the run
        completes, and only when `output.store_trajectories` is true.
      parameters:
        - $ref: '#/components/parameters/SimulationIdPath'
        - name: agent_id
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: The trajectory.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeoJsonFeatureCollection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/workspace:
    get:
      tags: [Workspace]
      operationId: getWorkspace
      summary: Get the workspace state
      description: |
        Sends the workspace locations, the datasets, the profile files, the
        transit feeds, the uploads and the jobs. It also shows the loaded
        selection and the saved selection. This operation works in setup mode.
      responses:
        '200':
          description: The workspace state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceInfo'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/workspace/jobs:
    get:
      tags: [Workspace]
      operationId: listJobs
      summary: List the background jobs
      description: Sends the import, update, build and activation jobs of this process.
      responses:
        '200':
          description: The jobs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobRecord'

  /v1/workspace/jobs/{job_id}:
    get:
      tags: [Workspace]
      operationId: getJob
      summary: Get one background job
      description: Sends the state and the progress of one job. A completed job has a `result`.
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobRecord'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/workspace/uploads:
    post:
      tags: [Workspace]
      operationId: uploadFile
      summary: Upload a file to the workspace
      description: |
        Writes the raw request body to `.netweevil/uploads/<name>`. This
        operation has no body size limit. Use the upload name in import
        requests.
      parameters:
        - name: name
          in: query
          required: true
          description: File name. It must not contain a path.
          schema:
            type: string
          example: groningen-latest.osm.pbf
        - name: overwrite
          in: query
          description: Replace an upload with the same name.
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              contentEncoding: binary
      responses:
        '200':
          description: The upload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadInfo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/workspace/uploads/{name}:
    delete:
      tags: [Workspace]
      operationId: deleteUpload
      summary: Delete an upload
      description: Deletes a file from `.netweevil/uploads/`.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The upload is deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletedName'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/workspace/datasets/import:
    post:
      tags: [Workspace]
      operationId: importDataset
      summary: Import a street dataset
      description: |
        Starts a background job that imports an OSM PBF extract, Overture
        GeoParquet files or GeoPackage files. Use `GET /v1/workspace/jobs/{job_id}`
        to follow the job.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetImportRequest'
            example:
              sources: [groningen-latest.osm.pbf]
              name: groningen_2026_05
              admin_boundaries: groningen_province_admin_bounds.geojson
      responses:
        '200':
          description: |
            The job started. The job `result` has `dataset_id`, `node_count`,
            `edge_count` and `manifest_path`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStarted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableBody'

  /v1/workspace/datasets/{dataset_id}:
    delete:
      tags: [Workspace]
      operationId: deleteDataset
      summary: Delete a dataset
      description: Deletes a dataset and its bundles. You cannot delete the loaded dataset.
      parameters:
        - $ref: '#/components/parameters/DatasetIdPath'
      responses:
        '200':
          description: The dataset is deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletedFlag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/workspace/datasets/{dataset_id}/update:
    post:
      tags: [Workspace]
      operationId: updateDataset
      summary: Update a dataset with OSM changes
      description: |
        Starts a background job that applies osmChange files to a dataset.
        Alternatively, the job replaces the source with a newer OSM PBF
        extract. When the dataset is loaded, the job also reloads the service.
      parameters:
        - $ref: '#/components/parameters/DatasetIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetUpdateRequest'
            example:
              diffs: [groningen-2026-05-12.osc.gz]
              reorder: auto
      responses:
        '200':
          description: |
            The job started. The job `result` has `dataset_id`, `last_update`,
            `stage_seconds` and `reloaded`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStarted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableBody'

  /v1/workspace/profile-templates:
    get:
      tags: [Workspace]
      operationId: listProfileTemplates
      summary: List the profile templates
      description: Sends the built-in profile templates as YAML text. Use a template as a start for a new profile.
      responses:
        '200':
          description: The templates.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProfileTemplate'

  /v1/workspace/profiles:
    post:
      tags: [Workspace]
      operationId: createProfileFile
      summary: Write a profile file
      description: |
        Parses and validates a profile YAML document. Then the service writes
        it to `.netweevil/profiles/`. The service does not load the profile.
        Use `POST /v1/workspace/activate` to load it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProfileRequest'
      responses:
        '200':
          description: The profile file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileFileInfo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableBody'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/workspace/profiles/{name}:
    get:
      tags: [Workspace]
      operationId: getProfileFile
      summary: Read a profile file
      description: Sends the YAML text of a profile file in `.netweevil/profiles/`.
      parameters:
        - $ref: '#/components/parameters/ProfileFileNamePath'
      responses:
        '200':
          description: The profile file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileFileContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Workspace]
      operationId: deleteProfileFile
      summary: Delete a profile file
      description: Deletes a profile file. You cannot delete a profile file that the service has loaded.
      parameters:
        - $ref: '#/components/parameters/ProfileFileNamePath'
      responses:
        '200':
          description: The profile file is deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletedName'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/workspace/transit/import:
    post:
      tags: [Workspace]
      operationId: importTransitFeed
      summary: Import a GTFS feed
      description: |
        Starts a background job that imports a GTFS zip file or directory.
        The service window starts at `service_start` and has `service_days`
        days.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitImportRequest'
            example:
              source: gtfs-openov-nl.zip
              name: openov_nl_2026_05
              service_start: '2026-05-11'
              service_days: 7
      responses:
        '200':
          description: |
            The job started. The job `result` has `feed_id`, `stop_count`,
            `route_count`, `trip_count`, `connection_count` and `bundle_path`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStarted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableBody'

  /v1/workspace/transit-feeds/{feed_id}:
    delete:
      tags: [Workspace]
      operationId: deleteTransitFeed
      summary: Delete a transit feed
      description: |
        Deletes an imported transit feed and its bundle. When the feed is
        loaded, the service first unloads it. The service also removes the
        feed from the saved selection.
      parameters:
        - $ref: '#/components/parameters/FeedIdPath'
      responses:
        '200':
          description: The feed is deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletedFlag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/workspace/activate:
    post:
      tags: [Workspace]
      operationId: activateSelection
      summary: Load a dataset, profiles and feeds
      description: |
        Starts a background job that loads a dataset with its profiles,
        transit feeds and optional traffic set. The job compiles profiles
        when necessary. When the job completes, the service uses the new
        selection. The service also saves the selection for the next start.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivateRequest'
            example:
              dataset_id: groningen_2026_05
              default_profile: examples/profiles/car_research_v1.yml
              profiles: [examples/profiles/pedestrian_research_v1.yml]
              transit_feeds: [openov_nl_2026_05]
      responses:
        '200':
          description: |
            The job started. The job `result` has `dataset_id`,
            `topology_bundle_id`, `default_profile_id`, `profile_ids` and
            `transit_feed_ids`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStarted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableBody'

  /v1/workspace/reload:
    post:
      tags: [Workspace]
      operationId: reloadSelection
      summary: Reload the selection from disk
      description: |
        Starts a background job that loads the current selection again. In
        setup mode, the job loads the saved selection. Use this operation
        after you change a profile file or a bundle on disk.
      responses:
        '200':
          description: The job started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStarted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/gtfs-editor/scenarios:
    get:
      tags: [GTFS editor]
      operationId: listGtfsScenarios
      summary: List the GTFS scenarios
      description: Sends the information for each scenario in the workspace. The list does not include the scenario documents.
      responses:
        '200':
          description: The scenarios.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GtfsScenarioInfo'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [GTFS editor]
      operationId: createGtfsScenario
      summary: Create a GTFS scenario
      description: |
        Creates a scenario. A scenario with `base_feed_id` adds lines and
        stops to that feed. A scenario without `base_feed_id` makes a new
        feed from its own stops and lines.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GtfsScenario'
            example:
              scenario_id: tram_line_zernike
              label: New tram line to Zernike
              base_feed_id: openov_nl_2026_05
              agency: {name: Scenario transit, timezone: Europe/Amsterdam}
              stops:
                - {stop_id: sc_station, name: Hoofdstation, lon: 6.5654, lat: 53.2106}
                - {stop_id: sc_zernike, name: Zernike, lon: 6.5337, lat: 53.2406}
              lines:
                - line_id: tram_1
                  short_name: T1
                  mode: tram
                  stops:
                    - {stop_id: sc_station}
                    - {stop_id: sc_zernike}
                  services:
                    - days: [true, true, true, true, true, false, false]
                      windows:
                        - {start: '07:00', end: '19:00', headway_min: 10}
      responses:
        '200':
          description: The scenario.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GtfsScenarioResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableBody'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/gtfs-editor/scenarios/{scenario_id}:
    get:
      tags: [GTFS editor]
      operationId: getGtfsScenario
      summary: Get a GTFS scenario
      description: Sends the scenario document and its information.
      parameters:
        - $ref: '#/components/parameters/ScenarioIdPath'
      responses:
        '200':
          description: The scenario.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GtfsScenarioResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [GTFS editor]
      operationId: updateGtfsScenario
      summary: Replace a GTFS scenario
      description: |
        Replaces the scenario document. You cannot change `scenario_id` or
        `base_feed_id`. Create a new scenario for that.
      parameters:
        - $ref: '#/components/parameters/ScenarioIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GtfsScenario'
      responses:
        '200':
          description: The scenario.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GtfsScenarioResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableBody'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [GTFS editor]
      operationId: deleteGtfsScenario
      summary: Delete a GTFS scenario
      description: Deletes the scenario document and its built feed.
      parameters:
        - $ref: '#/components/parameters/ScenarioIdPath'
      responses:
        '200':
          description: The scenario is deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletedName'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/gtfs-editor/scenarios/{scenario_id}/build:
    post:
      tags: [GTFS editor]
      operationId: buildGtfsScenario
      summary: Build the feed of a GTFS scenario
      description: |
        Starts a background job that builds a transit feed from the scenario.
        By default, the job also loads the feed into the service. The request
        body is optional.
      parameters:
        - $ref: '#/components/parameters/ScenarioIdPath'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GtfsBuildRequest'
      responses:
        '200':
          description: |
            The job started. The job `result` has `feed_id`, `bundle_path`,
            `stop_count`, `route_count`, `trip_count`, `connection_count` and
            `loaded`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStarted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/gtfs-editor/scenarios/{scenario_id}/revert:
    post:
      tags: [GTFS editor]
      operationId: revertGtfsScenario
      summary: Remove the built feed of a GTFS scenario
      description: |
        Removes the built feed of the scenario and unloads it. The scenario
        document stays. `reverted` is false when no built feed existed.
      parameters:
        - $ref: '#/components/parameters/ScenarioIdPath'
      responses:
        '200':
          description: The result.
          content:
            application/json:
              schema:
                type: object
                required: [reverted]
                properties:
                  reverted:
                    type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/gtfs-editor/scenarios/{scenario_id}/export:
    get:
      tags: [GTFS editor]
      operationId: exportGtfsScenario
      summary: Download the scenario as a GTFS zip file
      description: Writes the scenario as a GTFS zip file and sends the file.
      parameters:
        - $ref: '#/components/parameters/ScenarioIdPath'
      responses:
        '200':
          description: The GTFS zip file.
          headers:
            Content-Disposition:
              schema:
                type: string
              example: attachment; filename="tram_line_zernike.gtfs.zip"
            x-netweevil-export-path:
              description: Path of the written zip file on the server.
              schema:
                type: string
          content:
            application/zip:
              schema:
                type: string
                contentEncoding: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  parameters:
    Format:
      name: format
      in: query
      description: |
        Response format. `geojson` gives a GeoJSON `FeatureCollection` with
        the content type `application/geo+json`. The value ignores case. Other
        values, or no value, give the JSON envelope.
      schema:
        type: string
        enum: [json, geojson]
        default: json
    ProfileIdPath:
      name: profile_id
      in: path
      required: true
      description: Id of a loaded profile.
      schema:
        type: string
      example: car_research_v1
    FeedIdPath:
      name: feed_id
      in: path
      required: true
      description: Id of a transit feed.
      schema:
        type: string
      example: openov_nl_2026_05
    DatasetIdPath:
      name: dataset_id
      in: path
      required: true
      description: Id of an imported dataset.
      schema:
        type: string
      example: groningen_2026_05
    ProfileFileNamePath:
      name: name
      in: path
      required: true
      description: File name in `.netweevil/profiles/`.
      schema:
        type: string
      example: car_research_v1.yml
    ScenarioIdPath:
      name: scenario_id
      in: path
      required: true
      description: Id of a GTFS scenario.
      schema:
        type: string
      example: tram_line_zernike
    SimulationIdPath:
      name: simulation_id
      in: path
      required: true
      description: Id that `POST /v1/simulation` sent.
      schema:
        type: string
    SimStartS:
      name: start_s
      in: query
      description: Start of the time range, in simulation seconds.
      schema:
        type: number
        default: 0
    SimEndS:
      name: end_s
      in: query
      description: End of the time range, in simulation seconds. The default is the end of the run.
      schema:
        type: number
    TrafficWait:
      name: wait
      in: query
      description: Send the response after the service publishes the new engines.
      schema:
        type: boolean
        default: false

  responses:
    BadRequest:
      description: |
        The request is not valid, or the analysis failed. The service sends
        `ErrorResponse` JSON. The HTTP framework sends `text/plain` for JSON
        syntax errors and for bad path or query parameters.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: 'no route found from origin_a to destination_b'
            diagnostics:
              - code: disconnected_components
                severity: error
                message: Origin and destination are in different network components.
                point_ids: [origin_a, destination_b]
                component_ids: [0, 17]
                suggested_actions: [set connectivity.disconnected to hop_either_end]
        text/plain:
          schema:
            type: string
    NotFound:
      description: The named item does not exist. Examples are an unknown profile, feed, job or scenario.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "unknown profile_id 'car_v9'"
    Conflict:
      description: The operation conflicts with the current state. Examples are a name that exists or an item that is in use.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "an upload named 'groningen.osm.pbf' already exists; pass overwrite=true to replace it"
    UnsupportedMediaType:
      description: The `Content-Type` header is not `application/json`. The HTTP framework sends this response.
      content:
        text/plain:
          schema:
            type: string
          example: 'Expected request with `Content-Type: application/json`'
    UnprocessableBody:
      description: |
        The JSON body does not agree with the schema. For example, a required
        field is missing or a field has the wrong type. The HTTP framework
        sends this response.
      content:
        text/plain:
          schema:
            type: string
          example: 'Failed to deserialize the JSON body into the target type: request: missing field `route_id` at line 1 column 80'
    InternalError:
      description: The service has an internal problem. For example, a file on disk is not valid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    SetupMode:
      description: |
        The service is in setup mode. No dataset is loaded. Some operations
        (for example live traffic) also use this status when a background
        worker stopped.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: no dataset is loaded; open Setup in the console or POST /v1/workspace/activate

  schemas:
    # ------------------------------------------------------------------
    # Errors and GeoJSON
    # ------------------------------------------------------------------
    ErrorResponse:
      type: object
      description: Error body of the service.
      required: [error]
      properties:
        error:
          type: string
          description: Message that tells what went wrong.
        diagnostics:
          type: array
          description: Structured causes of an analysis failure. Absent when empty.
          items:
            $ref: '#/components/schemas/AnalysisDiagnostic'
    AnalysisDiagnostic:
      type: object
      required: [code, severity, message]
      properties:
        code:
          type: string
          enum: [snap_no_candidate, disconnected_components, legal_route_unreachable, fallback_used]
        severity:
          type: string
          enum: [info, warning, error]
        message:
          type: string
        point_ids:
          type: array
          items: {type: string}
        component_ids:
          type: array
          items: {type: integer, minimum: 0}
        suggested_actions:
          type: array
          items: {type: string}
    GeoJsonGeometry:
      type: object
      description: A GeoJSON geometry. Coordinates are WGS84 longitude, latitude and optional elevation.
      required: [type]
      properties:
        type:
          type: string
          enum: [Point, MultiPoint, LineString, MultiLineString, Polygon, MultiPolygon, GeometryCollection]
        coordinates:
          type: array
        geometries:
          type: array
          items:
            $ref: '#/components/schemas/GeoJsonGeometry'
    GeoJsonFeature:
      type: object
      required: [type, geometry, properties]
      properties:
        type:
          type: string
          const: Feature
        id:
          type: [integer, string]
        geometry:
          oneOf:
            - $ref: '#/components/schemas/GeoJsonGeometry'
            - type: 'null'
        properties:
          type: [object, 'null']
          additionalProperties: true
    GeoJsonFeatureCollection:
      type: object
      description: |
        A GeoJSON `FeatureCollection`. Some operations add top-level members,
        for example `metadata`, `service` or `traffic`.
      required: [type, features]
      additionalProperties: true
      properties:
        type:
          type: string
          const: FeatureCollection
        features:
          type: array
          items:
            $ref: '#/components/schemas/GeoJsonFeature'
        metadata:
          type: object
          additionalProperties: true
        traffic:
          $ref: '#/components/schemas/TrafficSelection'
    Coordinate2:
      type: array
      description: '`[lon, lat]` in WGS84 degrees.'
      items: {type: number}
      minItems: 2
      maxItems: 2
    Coordinate3:
      type: array
      description: '`[lon, lat, z]`. `lon` and `lat` are WGS84 degrees. `z` is the elevation in metres.'
      items: {type: number}
      minItems: 3
      maxItems: 3
    BBox:
      type: array
      description: '`[west, south, east, north]` in WGS84 degrees.'
      items: {type: number}
      minItems: 4
      maxItems: 4
    DeletedName:
      type: object
      required: [deleted]
      properties:
        deleted:
          type: string
          description: Name or id of the deleted item.
    DeletedFlag:
      type: object
      required: [deleted]
      properties:
        deleted:
          type: boolean
          const: true

    # ------------------------------------------------------------------
    # Service
    # ------------------------------------------------------------------
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
    ReadinessResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ready, setup]
          description: '`ready` when a dataset is loaded. `setup` in setup mode.'
    ServiceInfoResponse:
      type: object
      required: [workspace_root, dataset, default_profile_id, loaded_profiles, loaded_transit_feeds, capabilities, engine]
      properties:
        workspace_root:
          type: string
        dataset:
          $ref: '#/components/schemas/DatasetInfo'
        default_profile_id:
          type: string
        loaded_profiles:
          type: array
          items:
            $ref: '#/components/schemas/ProfileInfo'
        loaded_transit_feeds:
          type: array
          items:
            $ref: '#/components/schemas/TransitFeedInfo'
        capabilities:
          $ref: '#/components/schemas/ServiceCapabilities'
        engine:
          $ref: '#/components/schemas/EngineDescription'
    DatasetInfo:
      type: object
      required: [dataset_id, label, source_path, imported_at, topology_bounds, node_count, edge_count, turn_count, connected_components]
      properties:
        dataset_id:
          type: string
        label:
          type: string
        source_path:
          type: string
        imported_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          description: When a dataset update last changed the loaded build. Absent when no update occurred.
        topology_bounds:
          oneOf:
            - $ref: '#/components/schemas/TopologyBounds'
            - type: 'null'
        node_count:
          type: [integer, 'null']
        edge_count:
          type: [integer, 'null']
        turn_count:
          type: [integer, 'null']
        connected_components:
          oneOf:
            - $ref: '#/components/schemas/ConnectedComponentsMeta'
            - type: 'null'
    TopologyBounds:
      type: object
      required: [min_lon, min_lat, max_lon, max_lat]
      properties:
        min_lon: {type: number}
        min_lat: {type: number}
        max_lon: {type: number}
        max_lat: {type: number}
    ConnectedComponentsMeta:
      type: object
      required: [kind, component_count, largest_component_node_count, largest_component_edge_count]
      properties:
        kind:
          type: string
          enum: [weak]
        component_count: {type: integer}
        largest_component_node_count: {type: integer}
        largest_component_edge_count: {type: integer}
    ProfileInfo:
      type: object
      required: [profile_id, label, mode, defaults_pack, source_path, created_at, edge_count, default_returns]
      properties:
        profile_id:
          type: string
        label:
          type: string
        mode:
          $ref: '#/components/schemas/TravelMode'
        defaults_pack:
          type: string
        source_path:
          type: string
        created_at:
          type: string
          format: date-time
        edge_count:
          type: [integer, 'null']
        default_returns:
          $ref: '#/components/schemas/ReturnConfig'
      example:
        profile_id: car_research_v1
        label: Car research profile
        mode: car
        defaults_pack: car_eu_v1
        source_path: examples/profiles/car_research_v1.yml
        created_at: '2026-05-11T09:12:44Z'
        edge_count: 412387
        default_returns: {geometry: none, segment_rows: false, road_type_breakdown: [], surface_breakdown: [], penalty_breakdown: false, explain_cost_derivation: false, admin_areas: false, elevation: false}
    TransitFeedInfo:
      type: object
      required: [feed_id, source_path, service_start_date, service_days, agency_timezone, time_origin_unix_s, stop_count, route_count, trip_count, connection_count, bound_stop_count, transfer_profile_ids]
      properties:
        feed_id: {type: string}
        source_path: {type: string}
        service_start_date: {type: string, format: date}
        service_days: {type: integer}
        agency_timezone: {type: string}
        time_origin_unix_s:
          type: integer
          description: Unix time of transit time zero. Transit times are seconds from this instant.
        stop_count: {type: integer}
        route_count: {type: integer}
        trip_count: {type: integer}
        connection_count: {type: integer}
        bound_stop_count: {type: integer}
        transfer_profile_ids:
          type: array
          description: Profiles that have a network transfer table for this feed.
          items: {type: string}
    ServiceCapabilities:
      type: object
      required: [analyses, geometry, breakdown_metrics, connectivity_policies, failure_modes, directions_languages]
      properties:
        analyses:
          type: array
          items: {type: string}
          example: [route, locate, directions, match, waypoints, trip, od, matrix, accessibility, service_area, service_area_sequence, height, betweenness, scenario_batch, transit_route, transit_service_area, simulation]
        geometry:
          type: array
          items: {type: string}
          example: [none, full, segments]
        breakdown_metrics:
          type: array
          items: {type: string}
          example: [time_s, distance_m]
        connectivity_policies:
          type: array
          items: {type: string}
        failure_modes:
          type: array
          items: {type: string}
        directions_languages:
          type: array
          description: BCP 47 tags of the languages that have a phrase table.
          items: {type: string}
          example: [de, en, fi, fr, nl, zh-Hant]
    EngineDescription:
      type: object
      required: [route_engine, batch_engine, acceleration]
      properties:
        route_engine: {type: string}
        batch_engine: {type: string}
        acceleration: {type: string}
    ExecutionContext:
      type: object
      description: |
        Identifies the dataset, the profile and the engine that answered.
        Traffic-aware answers also have a `traffic` object.
      required: [dataset_id, profile_id, route_engine, batch_engine, acceleration]
      properties:
        dataset_id: {type: string}
        profile_id: {type: string}
        route_engine: {type: string}
        batch_engine: {type: string}
        acceleration: {type: string}
        traffic:
          $ref: '#/components/schemas/TrafficSelection'
      example:
        dataset_id: groningen_2026_05
        profile_id: car_research_v1
        route_engine: accelerated_pairwise_turns
        batch_engine: accelerated_pairwise_turns_batch_reuse
        acceleration: spatial_index+edge_phantoms+cch
    TrafficSelection:
      type: object
      description: How a traffic-aware request was answered.
      required: [profile_id, engine, live_version, live_entries_applied, engine_cache, prepare_ms]
      properties:
        profile_id: {type: string}
        engine:
          type: string
          enum: [departure_bucket_cch, time_dependent_exact]
        traffic_id: {type: string}
        departure_time: {type: string}
        bucket:
          $ref: '#/components/schemas/TrafficBucketInfo'
        live_version: {type: integer}
        live_entries_applied:
          type: integer
          description: Live entries in the departure-bucket metric.
        engine_cache:
          type: string
          enum: [hit, miss, none]
        prepare_ms: {type: number}
        bucket_boundaries_crossed:
          type: integer
          description: Bucket boundaries between departure and arrival. Zero means that one bucket metric applied to the full trip.
    TrafficBucketInfo:
      type: object
      required: [index, label, metric_bucket]
      properties:
        index: {type: integer}
        label: {type: string}
        metric_bucket:
          type: integer
          description: Representative bucket whose metric this bucket shares.

    # ------------------------------------------------------------------
    # Shared request parts
    # ------------------------------------------------------------------
    ProfileId:
      type: [string, 'null']
      description: Id of a loaded profile. When absent, the service uses the default profile.
    EngineMode:
      type: string
      description: |
        `auto` obeys all turn restrictions. `ignore_multi_edge_restrictions`
        ignores restrictions that span more than one edge. Traffic-aware
        requests accept only `auto`.
      enum: [auto, ignore_multi_edge_restrictions]
      default: auto
    TravelMode:
      type: string
      description: Travel mode. The service also accepts the aliases `transit` (bus), `truck` (hgv), `motor_scooter` and `scooter` (moped).
      enum: [car, bicycle, foot, bus, hgv, taxi, motorcycle, moped]
    DrivingSide:
      type: string
      enum: [right, left]
    LabeledPoint:
      type: object
      required: [id, lon, lat]
      properties:
        id:
          type: string
          description: Your id for the point. The result uses it.
        lon:
          type: number
          minimum: -180
          maximum: 180
        lat:
          type: number
          minimum: -90
          maximum: 90
        z:
          type: [number, 'null']
          description: Elevation in the dataset vertical datum, in metres.
    SnapOptions:
      type: object
      description: How points attach to the network.
      properties:
        max_distance_m:
          type: number
          default: 500
          description: Maximum distance from a point to the network.
        z_window_m:
          type: [number, 'null']
          description: When the point has `z`, reject network positions with a larger elevation difference.
        attribute_filters:
          type: object
          description: Feature attributes that candidate edges must have.
          additionalProperties: {type: string}
        point_constraints:
          type: object
          description: Direction constraints, keyed by the point `id`.
          additionalProperties:
            $ref: '#/components/schemas/PointSnapConstraint'
    PointSnapConstraint:
      type: object
      properties:
        bearing:
          oneOf:
            - $ref: '#/components/schemas/BearingConstraint'
            - type: 'null'
        approach:
          type: string
          enum: [unrestricted, curb, opposite]
          default: unrestricted
          description: '`curb` arrives or departs on the side of the point. `opposite` uses the other side.'
        driving_side:
          oneOf:
            - $ref: '#/components/schemas/DrivingSide'
            - type: 'null'
          description: Traffic side for `curb` and `opposite`. When absent, the service uses the country rule of each edge.
        street_side_tolerance_m:
          type: number
          default: 5
          description: Points nearer the road center than this distance have no side.
    BearingConstraint:
      type: object
      required: [degrees, tolerance_degrees]
      properties:
        degrees:
          type: number
          minimum: 0
          maximum: 360
          description: Travel direction clockwise from true north.
        tolerance_degrees:
          type: number
          minimum: 0
          maximum: 180
    ConnectivityPolicy:
      type: object
      description: What to do when the endpoints are in different network components.
      properties:
        disconnected:
          type: string
          enum: [strict, ignore_unreachable, hop_origin_to_nearest_reachable_component, hop_destination_to_nearest_reachable_component, hop_either_end]
          default: strict
        max_hop_distance_m:
          type: [number, 'null']
        report_hop_distance_separately:
          type: boolean
          default: false
    FallbackPolicy:
      type: object
      description: |
        Movements that are not legal, at a price. The `allow_*` and
        `ignore_turn_restrictions` flags make the movements available with
        their penalties. `auto_relax_unreachable` first routes with all
        rules. It relaxes the rules only when no legal route exists.
      properties:
        allow_reverse_oneway: {type: boolean, default: false}
        allow_illegal_turn: {type: boolean, default: false}
        ignore_turn_restrictions: {type: boolean, default: false}
        allow_uturn_where_normally_forbidden: {type: boolean, default: false}
        auto_relax_unreachable: {type: boolean, default: false}
        penalties:
          $ref: '#/components/schemas/IllegalMovementPenaltyPolicy'
        max_illegal_distance_m:
          type: [number, 'null']
        max_illegal_turns:
          type: [integer, 'null']
    IllegalMovementPenaltyPolicy:
      type: object
      properties:
        reverse_oneway_penalty_s: {type: [number, 'null']}
        illegal_turn_penalty_s: {type: [number, 'null']}
        ignored_turn_restriction_penalty_s: {type: [number, 'null']}
        forbidden_uturn_penalty_s: {type: [number, 'null']}
    BreakdownMetric:
      type: string
      enum: [time_s, distance_m]
    ReturnConfig:
      type: object
      description: The parts of a route that the result contains.
      properties:
        geometry:
          type: string
          enum: [none, full, segments]
          default: none
        segment_rows:
          type: boolean
          default: false
          description: Add one row for each traversed edge.
        road_type_breakdown:
          type: array
          items:
            $ref: '#/components/schemas/BreakdownMetric'
        surface_breakdown:
          type: array
          items:
            $ref: '#/components/schemas/BreakdownMetric'
        penalty_breakdown: {type: boolean, default: false}
        explain_cost_derivation: {type: boolean, default: false}
        admin_areas:
          type: boolean
          default: false
          description: Add the countries, states, border crossings and timezones along the route.
        elevation:
          type: boolean
          default: false
          description: Add the elevation profile, the ascent, the descent and the steepest grades.
    AlternativeRouteOptions:
      type: object
      properties:
        max_routes:
          type: integer
          default: 1
          description: Total number of routes, including the best route. `1` gives no alternatives.
        max_cost_ratio:
          type: number
          default: 1.35
        max_extra_time_s:
          type: [number, 'null']
        max_extra_distance_m:
          type: [integer, 'null']
        min_jaccard_distance:
          type: number
          default: 0.2
        max_search_attempts:
          type: integer
          default: 24
    TemporalRequestOptions:
      type: object
      description: |
        Runtime options for street analyses. These fields are at the same
        level as the other request fields. All content is inline. Requests do
        not name files on the server.
      properties:
        departure_time:
          type: [string, 'null']
          description: RFC 3339 departure time. A time-dependent search uses it.
          example: '2026-10-05T17:30:00+02:00'
        arrive_by:
          type: [string, 'null']
          description: RFC 3339 latest arrival time.
        scenario:
          oneOf:
            - $ref: '#/components/schemas/ScenarioOverlay'
            - type: 'null'
        holidays:
          type: array
          description: Public holiday dates, `YYYY-MM-DD`.
          items: {type: string, format: date}
        overlays:
          type: array
          description: Continuous temporal overlays. Later overlays take precedence.
          items:
            $ref: '#/components/schemas/TemporalOverlayDocument'
        avoid:
          $ref: '#/components/schemas/AvoidOptions'
        vehicle:
          $ref: '#/components/schemas/VehicleParams'
        max_labels_per_state:
          type: integer
          default: 16
        arrive_by_lookback_s:
          type: number
          default: 86400
        constraints:
          type: array
          description: Hard limits on named cost components. These requests use exact label setting.
          items:
            $ref: '#/components/schemas/ComponentConstraint'
        pareto:
          oneOf:
            - $ref: '#/components/schemas/ParetoRouteOptions'
            - type: 'null'
        traffic:
          type: string
          description: |
            How loaded traffic speeds apply to timed requests. Without traffic
            data, all values act as `off`.
          enum: [auto, historical, time_dependent, 'off']
          default: auto
    ComponentConstraint:
      type: object
      required: [component, max_value]
      properties:
        component: {type: string}
        max_value: {type: number}
    ParetoRouteOptions:
      type: object
      required: [component]
      properties:
        component: {type: string}
        max_routes: {type: integer, default: 16}
        max_labels_per_state: {type: integer, default: 64}
    AvoidOptions:
      type: object
      description: Locations, areas and source features that the request avoids.
      additionalProperties: false
      properties:
        points:
          type: array
          items:
            $ref: '#/components/schemas/AvoidPoint'
        polygons:
          type: array
          items:
            $ref: '#/components/schemas/AvoidPolygon'
        source_feature_ids:
          type: array
          description: OSM way ids. The service always removes every edge of these features.
          items: {type: integer}
    AvoidPoint:
      type: object
      additionalProperties: false
      required: [lon, lat]
      properties:
        lon: {type: number}
        lat: {type: number}
        radius_m:
          type: number
          default: 10
        penalty_factor:
          type: [number, 'null']
          minimum: 1
          maximum: 1000
          description: When absent, the service removes the edges. A factor multiplies their cost.
    AvoidPolygon:
      type: object
      additionalProperties: false
      required: [rings]
      properties:
        rings:
          type: array
          description: GeoJSON polygon rings. The first ring is the outer ring. The other rings are holes.
          items:
            type: array
            items:
              $ref: '#/components/schemas/Coordinate2'
        penalty_factor:
          type: [number, 'null']
          minimum: 1
          maximum: 1000
    VehicleParams:
      type: [object, 'null']
      description: Physical vehicle values. Each field replaces the same field of the profile `vehicle` block.
      additionalProperties: false
      properties:
        height_m: {type: [number, 'null']}
        width_m: {type: [number, 'null']}
        length_m: {type: [number, 'null']}
        weight_t:
          type: [number, 'null']
          description: Gross weight in metric tonnes.
        axle_load_t:
          type: [number, 'null']
          description: Heaviest axle load in metric tonnes.
        hazmat:
          type: [boolean, 'null']
          description: The vehicle carries dangerous goods.
        hazmat_water:
          type: [boolean, 'null']
          description: The vehicle carries goods that can pollute water.
        adr_tunnel_code:
          type: [string, 'null']
          enum: [B, C, D, E, null]
          description: ADR tunnel restriction code of the load. It sets `hazmat`.
        trailers:
          type: [integer, 'null']
          minimum: 0
          maximum: 255
    ScenarioOverlay:
      type: object
      description: Runtime changes to source features, keyed by source feature id.
      properties:
        id:
          type: [string, 'null']
        features:
          type: array
          items:
            $ref: '#/components/schemas/ScenarioFeatureOverride'
    ScenarioFeatureOverride:
      type: object
      required: [source_feature_id]
      properties:
        source_feature_id: {type: integer}
        force_closed: {type: boolean, default: false}
        force_open: {type: boolean, default: false}
        replace_rules:
          type: boolean
          default: false
          description: Replace the imported rules. When false, the rules are added.
        rules:
          type: array
          items:
            $ref: '#/components/schemas/TemporalRule'
        speed_factor:
          type: [number, 'null']
          description: Multiplier that always applies, after the rule speed factors.
    TemporalRule:
      type: object
      required: [day_mask, effect]
      properties:
        day_mask:
          type: integer
          minimum: 0
          maximum: 255
          description: Monday is bit 0 and Sunday is bit 6. Bit 7 is a public holiday.
        intervals:
          type: array
          items:
            $ref: '#/components/schemas/MinuteInterval'
        effect:
          $ref: '#/components/schemas/TemporalEffect'
        modes:
          type: integer
          default: 0
          description: Access mask bits of the modes. `0` applies the rule to all modes.
        dates:
          oneOf:
            - $ref: '#/components/schemas/DateRange'
            - type: 'null'
        weekdays_include_holidays:
          type: boolean
          default: false
    MinuteInterval:
      type: object
      required: [start_minute, end_minute]
      properties:
        start_minute:
          type: integer
          minimum: 0
          maximum: 1440
          description: Minute after midnight, inclusive.
        end_minute:
          type: integer
          minimum: 0
          maximum: 1440
          description: Minute after midnight, exclusive. A start after the end goes across midnight.
    TemporalEffect:
      description: The effect of an active rule.
      oneOf:
        - type: string
          enum: [closed, open_only, forward_only, backward_only]
        - type: object
          required: [speed_factor]
          additionalProperties: false
          properties:
            speed_factor: {type: number}
        - type: object
          required: [max_speed]
          additionalProperties: false
          properties:
            max_speed:
              type: number
              description: Posted speed limit in km/h while the rule is active.
    DateRange:
      type: object
      required: [start, end]
      properties:
        start:
          $ref: '#/components/schemas/CalendarDate'
        end:
          $ref: '#/components/schemas/CalendarDate'
    CalendarDate:
      type: object
      required: [year, month, day]
      properties:
        year:
          type: [integer, 'null']
          description: '`null` for a date that occurs each year.'
        month: {type: integer, minimum: 1, maximum: 12}
        day:
          type: integer
          minimum: 1
          maximum: 31
          description: Day of month. `31` also means the last day of the month.
    TemporalOverlayDocument:
      type: object
      properties:
        id:
          type: [string, 'null']
        rows:
          type: array
          items:
            $ref: '#/components/schemas/TemporalOverlayRow'
    TemporalOverlayRow:
      type: object
      description: One time interval for one feature. All other members are named numeric values (for example `shade_fraction`).
      required: [feature_id, t_start, t_end]
      properties:
        feature_id: {type: integer}
        t_start:
          type: string
          format: date-time
          description: RFC 3339 start, inclusive.
        t_end:
          type: string
          format: date-time
          description: RFC 3339 end, exclusive.
      additionalProperties:
        type: number

    # ------------------------------------------------------------------
    # Route and directions
    # ------------------------------------------------------------------
    RouteRequest:
      allOf:
        - type: object
          required: [route_id, origin, destination]
          properties:
            route_id:
              type: string
            origin:
              $ref: '#/components/schemas/LabeledPoint'
            destination:
              $ref: '#/components/schemas/LabeledPoint'
            snap:
              $ref: '#/components/schemas/SnapOptions'
            connectivity:
              $ref: '#/components/schemas/ConnectivityPolicy'
            fallback:
              $ref: '#/components/schemas/FallbackPolicy'
            returns:
              $ref: '#/components/schemas/ReturnConfig'
            alternatives:
              $ref: '#/components/schemas/AlternativeRouteOptions'
        - $ref: '#/components/schemas/TemporalRequestOptions'
    RouteExecutionRequest:
      type: object
      required: [request]
      properties:
        profile_id:
          $ref: '#/components/schemas/ProfileId'
        profile:
          type: [object, 'null']
          description: |
            A full profile document. The service compiles it for this request.
            See `docs/guides/request-profiles.md`.
          additionalProperties: true
        profile_overrides:
          type: [object, 'null']
          description: |
            A partial profile document. The service merges it into the profile
            of `profile_id` (or the default profile).
          additionalProperties: true
        engine_mode:
          $ref: '#/components/schemas/EngineMode'
        request:
          $ref: '#/components/schemas/RouteRequest'
    DirectionsOptions:
      type: object
      additionalProperties: false
      properties:
        language:
          type: [string, 'null']
          description: BCP 47 tag, for example `nl`, `de-CH` or `zh-HK`. An unknown tag gives English and a warning.
        units:
          type: string
          enum: [metric, imperial]
          default: metric
        driving_side:
          oneOf:
            - $ref: '#/components/schemas/DrivingSide'
            - type: 'null'
          description: Replaces the driving side of the dataset.
        facility_attribute:
          type: [string, 'null']
          description: Feature attribute that identifies stairs, escalators, lifts and moving walkways.
    DirectionsExecutionRequest:
      allOf:
        - $ref: '#/components/schemas/RouteExecutionRequest'
        - type: object
          properties:
            directions_options:
              $ref: '#/components/schemas/DirectionsOptions'
    AnalysisOutcome:
      type: string
      enum: [legal, degraded, partial, unreachable]
    RoadClass:
      type: string
      enum: [motorway, trunk, primary, secondary, tertiary, residential, service, track, ferry, path, unknown]
    SurfaceClass:
      type: string
      enum: [asphalt, paved, gravel, cobblestone, ground, dirt, sand, unknown]
    RouteViolationType:
      type: string
      enum: [reverse_oneway, illegal_turn, ignored_turn_restriction, forbidden_uturn]
    SnappedPoint:
      type: object
      required: [point_id, requested_lon, requested_lat, snapped_node_id, snapped_lon, snapped_lat, snapped_z, snap_distance_m, snapped_edge_id, snapped_edge_fraction, snapped_from_node_id, snapped_to_node_id, component_id]
      properties:
        point_id: {type: string}
        requested_lon: {type: number}
        requested_lat: {type: number}
        snapped_node_id: {type: integer}
        snapped_lon: {type: number}
        snapped_lat: {type: number}
        snapped_z:
          type: number
          description: Elevation of the snapped position in metres. Zero when the source has no elevation.
        snap_distance_m: {type: number}
        snapped_edge_id: {type: [integer, 'null']}
        snapped_edge_fraction: {type: [number, 'null']}
        snapped_from_node_id: {type: [integer, 'null']}
        snapped_to_node_id: {type: [integer, 'null']}
        component_id: {type: [integer, 'null']}
    CostComponents:
      type: object
      description: Named additive profile cost components.
      additionalProperties: {type: number}
    RouteSummary:
      type: object
      required: [network_distance_m, network_travel_time_s, network_generalized_cost, waiting_time_s, illegal_movement_penalty_s, illegal_movement_penalty_cost, violation_count, total_distance_m, total_travel_time_s, total_generalized_cost, segment_count]
      properties:
        network_distance_m: {type: integer}
        network_travel_time_s: {type: number}
        network_generalized_cost: {type: number}
        components:
          $ref: '#/components/schemas/CostComponents'
        waiting_time_s: {type: number}
        departure_time: {type: string}
        arrival_time: {type: string}
        scenario_id: {type: string}
        illegal_movement_penalty_s: {type: number}
        illegal_movement_penalty_cost: {type: number}
        violation_count: {type: integer}
        violation_types:
          type: array
          items:
            $ref: '#/components/schemas/RouteViolationType'
        total_distance_m:
          type: integer
          description: Network distance plus hop distances, in metres.
        total_travel_time_s: {type: number}
        total_generalized_cost: {type: number}
        segment_count: {type: integer}
    RouteViolation:
      type: object
      required: [violation_type, edge_id, from_edge_id, to_edge_id, distance_m, penalty_s, penalty_generalized_cost]
      properties:
        violation_type:
          $ref: '#/components/schemas/RouteViolationType'
        edge_id: {type: [integer, 'null']}
        from_edge_id: {type: [integer, 'null']}
        to_edge_id: {type: [integer, 'null']}
        distance_m: {type: [number, 'null']}
        penalty_s: {type: number}
        penalty_generalized_cost: {type: number}
    RouteHopSegment:
      type: object
      required: [endpoint, distance_m, geometry]
      properties:
        endpoint:
          type: string
          enum: [origin, destination]
        distance_m: {type: number}
        geometry:
          type: array
          items:
            $ref: '#/components/schemas/Coordinate3'
    RouteSegment:
      type: object
      required: [edge_id, from_node_id, to_node_id, source_way_id, length_m, travel_time_s, generalized_cost, waiting_time_s, road_class, surface, name, violation_type]
      properties:
        edge_id: {type: integer}
        from_node_id: {type: integer}
        to_node_id: {type: integer}
        source_way_id: {type: integer}
        length_m: {type: integer}
        travel_time_s: {type: number}
        generalized_cost: {type: number}
        components:
          $ref: '#/components/schemas/CostComponents'
        waiting_time_s: {type: number}
        entry_time: {type: string}
        exit_time: {type: string}
        road_class:
          $ref: '#/components/schemas/RoadClass'
        surface:
          $ref: '#/components/schemas/SurfaceClass'
        name: {type: [string, 'null']}
        violation_type:
          oneOf:
            - $ref: '#/components/schemas/RouteViolationType'
            - type: 'null'
    MetricBreakdown:
      type: object
      properties:
        distance_m: {type: [integer, 'null']}
        time_s: {type: [number, 'null']}
    RouteBreakdowns:
      type: object
      required: [road_class, surface]
      properties:
        road_class:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/MetricBreakdown'
        surface:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/MetricBreakdown'
    RouteRegions:
      type: object
      required: [spans, border_crossing_count, timezones]
      properties:
        spans:
          type: array
          items:
            $ref: '#/components/schemas/RouteAdminSpan'
        border_crossing_count: {type: integer}
        timezones:
          type: array
          description: IANA zones in the order that the route enters them.
          items: {type: string}
    RouteAdminSpan:
      type: object
      required: [country_code, country_name, state_code, state_name, driving_side, start_distance_m, distance_m]
      properties:
        country_code: {type: [string, 'null']}
        country_name: {type: [string, 'null']}
        state_code: {type: [string, 'null']}
        state_name: {type: [string, 'null']}
        driving_side:
          oneOf:
            - $ref: '#/components/schemas/DrivingSide'
            - type: 'null'
        start_distance_m: {type: number}
        distance_m: {type: number}
    RouteElevationProfile:
      type: object
      required: [points, ascent_m, descent_m, min_elevation_m, max_elevation_m, max_uphill_grade, max_downhill_grade, vertical_datum]
      properties:
        points:
          type: array
          description: '`[distance_m, elevation_m]` for each route vertex. The elevation is null when it is not known.'
          items:
            type: array
            prefixItems:
              - type: number
              - type: [number, 'null']
            minItems: 2
            maxItems: 2
        ascent_m: {type: number}
        descent_m: {type: number}
        min_elevation_m: {type: [number, 'null']}
        max_elevation_m: {type: [number, 'null']}
        max_uphill_grade:
          type: number
          description: Steepest uphill grade as rise divided by run.
        max_downhill_grade: {type: number}
