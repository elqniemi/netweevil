services:
  api:
    build:
      context: .
      # Optional build-time data provisioning (leave unset to provision at
      # runtime by importing from the ./datasets bind mount instead):
      #   NETWEEVIL_FETCH_OSM_URL      — bake an OSM extract fetched at build
      #   NETWEEVIL_FETCH_OVERTURE_BBOX — bake Overture segments for a bbox
      #                                   (west,south,east,north)
      # Baked state seeds the netweevil-state volume on its first mount.
      args:
        DATA_SOURCE_URL: "${NETWEEVIL_FETCH_OSM_URL:-}"
        OVERTURE_BBOX: "${NETWEEVIL_FETCH_OVERTURE_BBOX:-}"
        DATASET_NAME: "${NETWEEVIL_DATASET:-osm}"
    image: netweevil:latest
    # Setup mode: open http://localhost:8080/ and use Setup to import data.
    # Files placed in ./datasets are visible inside the container as
    # /data/datasets/<file> and can be referenced by path instead of uploaded.
    # To pin a dataset at start instead, replace the command with:
    #   ["api", "serve", "--dataset", "osm", "--default-profile",
    #    "examples/profiles/car_research_v1.yml", "--bind", "0.0.0.0:8080"]
    command: ["bootstrap", "--no-open", "--bind", "0.0.0.0:8080"]
    ports:
      - "${NETWEEVIL_PORT:-8080}:8080"
    volumes:
      - netweevil-state:/data/.netweevil
      - ./datasets:/data/datasets:ro
      - ./examples:/data/examples:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 120s
    restart: unless-stopped

volumes:
  netweevil-state:
