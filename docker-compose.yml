services:
  api:
    build: .
    image: netweevil:latest
    command:
      [
        "api",
        "serve",
        "--dataset",
        "${NETWEEVIL_DATASET:-osm}",
        "--default-profile",
        "${NETWEEVIL_PROFILE:-examples/profiles/car_research_v1.yml}",
        "--bind",
        "0.0.0.0:8080",
      ]
    ports:
      - "${NETWEEVIL_PORT:-8080}:8080"
    volumes:
      - netweevil-state:/data/.netweevil
      - ./datasets:/data/datasets:ro
      - ./examples:/data/examples:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 120s
    restart: unless-stopped

volumes:
  netweevil-state:
