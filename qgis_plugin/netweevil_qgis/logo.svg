<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">netweevil logo</title>
  <desc id="desc">A weevil whose elytra are a routing network of connected nodes, with a long curved snout that becomes a route running down to a destination node, surrounded by faint accessibility ripples.</desc>
  <defs>
    <linearGradient id="tile" x1="40" y1="24" x2="472" y2="488" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#18C2A6"/>
      <stop offset="0.55" stop-color="#0C7C8E"/>
      <stop offset="1" stop-color="#0A4F63"/>
    </linearGradient>
    <linearGradient id="body" x1="210" y1="140" x2="430" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0C3D4B"/>
      <stop offset="1" stop-color="#06212A"/>
    </linearGradient>
    <radialGradient id="node" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#CFFAEE"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#tile)"/>

  <g transform="translate(-22 -20)">
    <!-- accessibility ripples from the destination node -->
    <g fill="none" stroke="#EAFFF8" stroke-linecap="round">
      <path d="M168.4 414.4 A 46 46 0 0 1 111.0 360.4" stroke-width="6" opacity="0.20"/>
      <path d="M176.2 439.5 A 72 72 0 0 1 86.3 355.0" stroke-width="6" opacity="0.12"/>
    </g>

    <!-- antennae (elbowed, weevil-style) -->
    <g fill="none" stroke="#EAFFF8" stroke-linecap="round" stroke-linejoin="round" stroke-width="6" opacity="0.85">
      <path d="M188 320 L160 316 L147 300"/>
      <path d="M198 306 L180 288 L186 268"/>
    </g>

    <!-- weevil silhouette: snout + head + body as one dark form -->
    <path fill="url(#body)" d="M216 268 C 192 302 168 336 154 368 C 147 381 148 386 160 386 C 182 358 206 326 222 300 Z"/>
    <circle cx="212" cy="266" r="34" fill="url(#body)"/>
    <ellipse cx="322" cy="196" rx="122" ry="84" transform="rotate(-27 322 196)" fill="url(#body)"/>

    <!-- soft highlight + eye on the head -->
    <ellipse cx="288" cy="150" rx="64" ry="30" transform="rotate(-27 288 150)" fill="#EAFFF8" opacity="0.12"/>
    <circle cx="226" cy="252" r="7" fill="#EAFFF8" opacity="0.92"/>

    <!-- network edges across the elytra -->
    <g fill="none" stroke="#EAFFF8" stroke-linecap="round" stroke-linejoin="round" stroke-width="9">
      <path d="M250 240 L304 196"/>
      <path d="M304 196 L360 206"/>
      <path d="M360 206 L402 158"/>
      <path d="M304 196 L338 250"/>
      <path d="M338 250 L360 206"/>
    </g>

    <!-- the route: down the snout to the destination, drawn as a road -->
    <path fill="none" stroke="#EAFFF8" stroke-linecap="round" stroke-width="15" d="M250 240 C 222 282 192 330 158 374"/>
    <path fill="none" stroke="#0C3D4B" stroke-linecap="round" stroke-width="5.5" stroke-dasharray="2 21" d="M250 240 C 222 282 192 330 158 374"/>

    <!-- network nodes -->
    <g>
      <circle cx="250" cy="240" r="16" fill="url(#node)"/><circle cx="250" cy="240" r="7" fill="#0C3D4B"/>
      <circle cx="304" cy="196" r="16" fill="url(#node)"/><circle cx="304" cy="196" r="7" fill="#0C3D4B"/>
      <circle cx="360" cy="206" r="16" fill="url(#node)"/><circle cx="360" cy="206" r="7" fill="#0C3D4B"/>
      <circle cx="338" cy="250" r="16" fill="url(#node)"/><circle cx="338" cy="250" r="7" fill="#0C3D4B"/>
      <circle cx="402" cy="158" r="16" fill="url(#node)"/><circle cx="402" cy="158" r="7" fill="#0C3D4B"/>
    </g>

    <!-- destination node -->
    <circle cx="158" cy="374" r="25" fill="url(#node)"/>
    <circle cx="158" cy="374" r="11" fill="#0C3D4B"/>
  </g>
</svg>
