# Default bicycle profile created by the NetWeevil setup flow.
# Edit freely: the file is yours. Change `profile.id` to keep several variants.
profile:
  id: bicycle_default
  label: "Bicycle (default)"
  mode: bicycle
  defaults_pack: eu_bicycle_2026_01
  extends: bicycle_default

cost:
  objective: generalized
  distance_weight: 0.004
  time_weight: 1.0

speed_rules:
  - match:
      highway: cycleway
    speed_kph: 20
  - match:
      highway: path
    speed_kph: 16
  - match:
      highway: residential
    speed_kph: 18
  - match:
      highway: living_street
    speed_kph: 14
  - match:
      highway: service
    speed_kph: 15
  - match:
      highway: tertiary
    speed_kph: 18
  - match:
      highway: secondary
    speed_kph: 17
  - match:
      highway: primary
    speed_kph: 16
  - match:
      highway: track
    speed_kph: 12
  - match:
      highway: footway
    speed_kph: 8

exclude_rules:
  - match:
      highway: motorway
  - match:
      highway: trunk

factors:
  - match:
      surface: gravel
    speed_factor: 0.8
  - match:
      surface: cobblestone
    speed_factor: 0.7
  - match:
      surface: ground
    speed_factor: 0.75
  - match:
      surface: sand
    speed_factor: 0.4
  - match:
      smoothness: bad
    speed_factor: 0.7

turns:
  left_penalty_s: 3
  right_penalty_s: 1
  uturn_penalty_s: 10
  traffic_signal_penalty_s: 8

ferry:
  allow: true
  use_ferry: 0.3
  boarding_cost_s: 180
  infer_duration_when_missing: true
  default_speed_kph: 15

preferences:
  use_highways: 0.05
  use_tolls: 0.0
  use_tracks: 0.4
  service_penalty_s: 5

returns:
  geometry: full
  segment_rows: true
  road_type_breakdown:
    - time_s
    - distance_m
  surface_breakdown:
    - time_s
    - distance_m
  penalty_breakdown: true
  explain_cost_derivation: true
