# Default motorcycle profile created by the NetWeevil setup flow.
# Edit freely: the file is yours. Change `profile.id` to keep several variants.
profile:
  id: motorcycle_default
  label: "Motorcycle (default)"
  mode: motorcycle
  defaults_pack: eu_motorcycle_2026_01

cost:
  objective: fastest
  distance_weight: 0.0
  time_weight: 1.0

speeds:
  posted_limits: cap

speed_rules:
  - match:
      highway: motorway
    speed_kph: 110
  - match:
      highway: trunk
    speed_kph: 90
  - match:
      highway: primary
    speed_kph: 75
  - match:
      highway: secondary
    speed_kph: 65
  - match:
      highway: tertiary
    speed_kph: 55
  - match:
      highway: residential
    speed_kph: 30
  - match:
      highway: service
    speed_kph: 20
  - match:
      highway: track
    speed_kph: 15

# Loose and uneven surfaces cost two-wheelers more than cars.
factors:
  - match:
      surface: cobblestone
    speed_factor: 0.7
  - match:
      surface: gravel
    speed_factor: 0.5
  - match:
      surface: sand
    speed_factor: 0.3
  - match:
      smoothness: bad
    speed_factor: 0.6

turns:
  left_penalty_s: 3
  right_penalty_s: 1
  uturn_penalty_s: 15
  traffic_signal_penalty_s: 6
  roundabout_entry_penalty_s: 2

ferry:
  allow: true
  use_ferry: 0.35
  boarding_cost_s: 300
  infer_duration_when_missing: true
  default_speed_kph: 22

preferences:
  use_highways: 0.7
  use_tolls: 0.4
  use_tracks: 0.2
  service_penalty_s: 15

returns:
  geometry: full
  segment_rows: true
  road_type_breakdown:
    - time_s
    - distance_m
  penalty_breakdown: true
