# Default taxi profile created by the NetWeevil setup flow.
# Edit freely: the file is yours. Change `profile.id` to keep several variants.
# Taxis drive like cars and may also use roads open to taxis or to all
# public service vehicles (`taxi`, `psv` access), such as many bus lanes.
profile:
  id: taxi_default
  label: "Taxi (default)"
  mode: taxi
  defaults_pack: eu_taxi_2026_01

cost:
  objective: fastest
  distance_weight: 0.0
  time_weight: 1.0

speeds:
  posted_limits: cap

speed_rules:
  - match:
      highway: motorway
    speed_kph: 105
  - match:
      highway: trunk
    speed_kph: 90
  - match:
      highway: primary
    speed_kph: 70
  - match:
      highway: secondary
    speed_kph: 60
  - match:
      highway: tertiary
    speed_kph: 50
  - match:
      highway: residential
    speed_kph: 30
  - match:
      highway: busway
    speed_kph: 40
  - match:
      highway: service
    speed_kph: 20
  - match:
      highway: track
    speed_kph: 15

factors:
  - match:
      surface: cobblestone
    speed_factor: 0.75
  - match:
      surface: gravel
    speed_factor: 0.7
  - match:
      smoothness: bad
    speed_factor: 0.7

turns:
  left_penalty_s: 4
  right_penalty_s: 1
  uturn_penalty_s: 20
  traffic_signal_penalty_s: 6
  roundabout_entry_penalty_s: 2

ferry:
  allow: true
  use_ferry: 0.35
  boarding_cost_s: 300
  infer_duration_when_missing: true
  default_speed_kph: 22

preferences:
  use_highways: 0.8
  use_tolls: 0.4
  use_tracks: 0.1
  service_penalty_s: 15
  # Pick-ups and drop-offs are destination traffic; through trips are not.
  destination_only_penalty_s: 600

returns:
  geometry: full
  segment_rows: true
  road_type_breakdown:
    - time_s
    - distance_m
  penalty_breakdown: true
