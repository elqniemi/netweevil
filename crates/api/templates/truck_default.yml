# Default truck (HGV) profile created by the NetWeevil setup flow.
# Edit freely: the file is yours. Change `profile.id` to keep several variants.
profile:
  id: truck_default
  label: "Truck (HGV, default)"
  mode: hgv
  defaults_pack: eu_hgv_2026_01

cost:
  objective: fastest
  distance_weight: 0.0
  time_weight: 1.0

# Posted limits cap the truck speeds below; trucks rarely reach car limits.
speeds:
  posted_limits: cap

# `road_class` also covers the link roads of each class.
speed_rules:
  - match:
      road_class: motorway
    speed_kph: 80
  - match:
      road_class: trunk
    speed_kph: 70
  - match:
      road_class: primary
    speed_kph: 60
  - match:
      road_class: secondary
    speed_kph: 50
  - match:
      road_class: tertiary
    speed_kph: 45
  - match:
      road_class: residential
    speed_kph: 25
  - match:
      road_class: service
    speed_kph: 15

exclude_rules:
  - match:
      road_class: track

factors:
  - match:
      surface: cobblestone
    speed_factor: 0.7
  - match:
      surface: gravel
    speed_factor: 0.6
  - match:
      smoothness: bad
    speed_factor: 0.6

turns:
  left_penalty_s: 10
  right_penalty_s: 4
  uturn_penalty_s: 180
  traffic_signal_penalty_s: 10
  roundabout_entry_penalty_s: 5

ferry:
  allow: true
  use_ferry: 0.35
  boarding_cost_s: 900
  infer_duration_when_missing: true
  default_speed_kph: 20

preferences:
  use_highways: 0.9
  use_tolls: 0.5
  use_tracks: 0.0
  service_penalty_s: 60
  destination_only_penalty_s: 900

# A 40 t articulated truck: edges with lower height, width, length, weight
# or axle-load limits, or no trailers, are excluded. Requests may override
# any field with their own `vehicle` block.
vehicle:
  height_m: 4.0
  width_m: 2.55
  length_m: 16.5
  weight_t: 40.0
  axle_load_t: 11.5
  trailers: 1

returns:
  geometry: full
  segment_rows: true
  road_type_breakdown:
    - time_s
    - distance_m
  penalty_breakdown: true
